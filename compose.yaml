# Start with: docker compose up -d   (pulls the published image; add --build to build from this checkout)
# TL_IMAGE_TAG picks the release: latest (stable), beta, or a version such as 1.0.0-beta.16.
# Create deploy/web-password.txt first; never commit it.
services:
  torrentlinker:
    image: ghcr.io/vietnoirien/torrentlinker:${TL_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        TL_UID: ${TL_UID:-1000}
        TL_GID: ${TL_GID:-1000}
    ports:
      - "${TL_BIND_ADDRESS:-127.0.0.1}:8787:8787"
    environment:
      TL_WEB_PASSWORD_FILE: /run/secrets/web_password
      # Portainer or no file? Replace the line above with: TL_WEB_PASSWORD: ${WEB_PASSWORD}
      TL_SECURE_COOKIE: ${TL_SECURE_COOKIE:-0}
      TL_ROOT_PATH: ${TL_ROOT_PATH:-}
    secrets:
      - web_password
    volumes:
      - torrentlinker_config:/config
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
secrets:
  web_password:
    file: ./deploy/web-password.txt
volumes:
  torrentlinker_config:

 warn:{label:"ratio sous 0,5 (téléchargements bloqués)",paired:true,fresh:true,
  me:{username:"viet_t4k",role:"member",joined:"2026-10-02",seen:"2026-11-23"},
  uploaded:18*GB,downloaded:90*GB,raw_up:18*GB,raw_down:90*GB,bonus_up:0,bonus_down:0,money:310,ratio:null,ratio_raw:null,warning:true,freeleech:2,multiplier:null,badges:[],
  payouts:[[3,9,4,12*GB,21600,"films","solaris-1972",null],[9,7,6,8*GB,21600,"series","severance-s01",null]]},
 none:{label:"tr4ker non appairé",paired:false}};
for(const a of Object.values(ACCOUNTS)){if(!a.paired)continue;
 /* The displayed ratio counts the bonus: (uploaded + bonus_upload) / (downloaded + bonus_download), as the backend does. */
 a.ratio=a.downloaded>0?(a.uploaded+a.bonus_up)/(a.downloaded+a.bonus_down):null;a.ratio_raw=a.raw_down>0?a.raw_up/a.raw_down:null}
const ui={tracker:"c411",scenario:"active",period:0,theme:null};
const SCENARIOS=["empty","active","warn","none"];

/* ---- c411: the existing Profile is not touched; this is only a stand-in so the picker has a default. */
function c411(){return `<section class="pf-panel pf-identity"><div class="pf-avatar" aria-hidden="true">V</div>
 <div class="pf-who"><h2>viet_c411</h2><div class="pf-meta">Profil c411 actuel, inchangé par cet aperçu</div>
 <div class="pf-pills"><span class="pf-pill ok">API à jour</span><span class="pf-pill info">Zen</span></div></div></section>
 <section class="pf-kpis" aria-label="Chiffres clés">${[["Zen","2 140"],["Ratio","3,42"],["Téléversé","1,8 To"],["Téléchargé","520 Go"],["Seeds actifs","236"],["Niveau","12"]].map(([k,v])=>`<div class="pf-kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="d">&nbsp;</div></div>`).join("")}</section>
 <section class="pf-panel"><p class="pf-empty" style="margin:0">Les graphiques, la progression, le Zen et les transferts de c411 restent ceux du Profil actuel. Choisissez tr4ker pour voir la nouvelle vue.</p></section>`}

/* ---- tr4ker */
function notPaired(){return `<section class="pf-panel pf-state" id="t4k-unpaired"><h3>tr4ker n’est pas appairé</h3>
 <p class="pf-muted">Le profil de tr4ker se lit dans votre navigateur, avec votre session. Appairez-le dans Paramètres → Connexions → Compagnon.</p>
 <p style="margin-top:12px !important"><button type="button" class="primary" data-act="pair">Ouvrir le Compagnon</button></p></section>`}
function pills(a){const p=[`<span class="pf-pill info">${esc(a.me.role)}</span>`];
 if(a.multiplier!=null)p.push(`<span class="pf-pill ok">+${a.multiplier} % crédits</span>`);
 if(a.warning)p.push('<span class="pf-pill err">Ratio sous 0,5 : téléchargements bloqués</span>');
 for(const b of a.badges)p.push(`<span class="pf-pill off">${esc(b)}</span>`);
 return p.join("")}
function identity(a){return `<section class="pf-panel pf-identity"><div class="pf-avatar" aria-hidden="true">${esc(a.me.username[0].toUpperCase())}</div>
 <div class="pf-who"><h2 id="t4k-username">${esc(a.me.username)}</h2><div class="pf-meta">Membre depuis le ${new Date(a.me.joined).toLocaleDateString("fr-FR")} · dernière connexion le ${new Date(a.me.seen).toLocaleDateString("fr-FR")}</div>
 <div class="pf-pills">${pills(a)}</div></div>
 <div class="pf-actions"><button type="button" class="primary" data-act="refresh">Actualiser</button></div></section>`}
function kpis(a){const paid=a.payouts.reduce((s,p)=>s+p[1],0),
  ratio=a.ratio==null?"—":N1.format(a.ratio),
  tiles=[["Crédits",fmt(a.money),"<small>cr</small>",a.payouts.length?`${fmt(paid)} cr reçus en paiements`:"aucun paiement"],
   ["Ratio",ratio,"",a.ratio==null?"rien téléchargé":`brut ${a.ratio_raw==null?"—":N1.format(a.ratio_raw)}`],
   ["Téléversé",bytes(a.uploaded),"",`dont bonus ${bytes(a.bonus_up)}`],
   ["Téléchargé",bytes(a.downloaded),"",a.bonus_down?`dont bonus ${bytes(a.bonus_down)}`:"aucun bonus"],
   ["Freeleech",fmt(a.freeleech),"<small>torrents</small>","compteur du compte"],
   ["Paiements",fmt(a.payouts.length),"",`sur ${MIN} pour l’estimation`]];
 return `<section class="pf-kpis" aria-label="Chiffres clés">${tiles.map(([k,v,s,d])=>`<div class="pf-kpi"><div class="k">${k}</div><div class="v">${v}${s}</div><div class="d">${d}</div></div>`).join("")}</section>`}
function ratioPanel(a){const upTotal=a.raw_up+a.bonus_up,downTotal=a.raw_down+a.bonus_down,scale=Math.max(upTotal,downTotal,1);
 const bar=(raw,bonus,cls)=>`<div class="pf-stack" role="img" aria-label="brut ${bytes(raw)}, bonus ${bytes(bonus)}"><span class="raw ${cls}" style="width:${raw/scale*100}%"></span><span class="bonus hatched" style="width:${bonus/scale*100}%"></span></div>`;
 return `<div class="pf-panel" id="t4k-ratio"><p class="pf-eyebrow">Ratio et compteurs <span class="pf-src">/api/me/stats</span></p>
 <div class="pf-acct"><div><div class="lbl"><span>Téléversé</span><span class="pf-num">${bytes(a.raw_up)} brut + ${bytes(a.bonus_up)} bonus</span></div>${bar(a.raw_up,a.bonus_up,"")}</div>
 <div><div class="lbl"><span>Téléchargé</span><span class="pf-num">${bytes(a.raw_down)} brut + ${bytes(a.bonus_down)} bonus</span></div>${bar(a.raw_down,a.bonus_down,"dl")}</div></div>
 <div class="pf-rows"><div class="pf-row"><span>Ratio affiché (bonus compté)</span><span class="pf-num ${a.warning?"pf-bad":""}">${a.ratio==null?"—":N1.format(a.ratio)}</span></div>
 <div class="pf-row"><span>Ratio brut</span><span class="pf-num">${a.ratio_raw==null?"—":N1.format(a.ratio_raw)}</span></div>
 <div class="pf-row"><span>Avertissement de ratio</span><span class="${a.warning?"pf-bad":"pf-ok"}">${a.warning?"oui : en dessous de 0,5":"non"}</span></div></div>
 <p class="pf-note">Le bonus acheté à la boutique s’ajoute au téléversé affiché. Les compteurs bruts restent séparés. tr4ker n’a pas de Zen : ses crédits sont une estimation apprise.</p></div>`}
function shop(a){const rows=SHOP.map(([id,name,price,b])=>{const ok=a.money>=price;
  return `<tr><td>${name}</td><td class="r mono">${fmt(price)} cr</td><td class="r mono">${N1.format(price/(b/GB))} cr/Go</td><td class="r pf-buy ${ok?"pf-ok":"pf-muted"}">${ok?"assez de crédits":`il manque ${fmt(price-a.money)} cr`}</td></tr>`}).join("");
 return `<div class="pf-panel" id="t4k-shop"><p class="pf-eyebrow">Boutique <span class="pf-src">/api/shop</span><span class="pf-tag">lecture seule</span></p>
 <div class="pf-tablewrap"><table><thead><tr><th>Volume</th><th class="r">Prix</th><th class="r">Tarif</th><th class="r">Votre solde</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p class="pf-note">Les achats se font sur tr4ker. TorrentLinker ne dépense jamais de crédits. Liste lue le 23 novembre 2026.</p></div>`}
function inPeriod(a){return a.payouts.filter(p=>ui.period===0||p[0]<=ui.period)}
function payouts(a){const all=a.payouts,list=inPeriod(a),total=list.reduce((s,p)=>s+p[1],0);
 const head=`<div class="pf-head"><p class="pf-eyebrow" style="margin:0 !important">Historique des paiements <span class="pf-src">/api/me/sw-rewards</span></p>
  <div id="profile-period" class="pf-seg" role="group" aria-label="Période">${[[7,"7 j"],[30,"30 j"],[90,"90 j"],[0,"Tout"]].map(([d,l])=>`<button type="button" data-days="${d}" aria-pressed="${ui.period===d}">${l}</button>`).join("")}</div></div>`;
 if(!all.length)return `<div class="pf-panel pf-wide" id="t4k-payouts">${head}<div class="pf-state" id="t4k-payouts-empty"><h3>Aucun paiement pour l’instant</h3>
  <p class="pf-muted">tr4ker paie un torrent après 6 h cumulées de seed depuis son dernier paiement, par vagues plusieurs fois par jour. Un délai de plusieurs heures est normal.</p></div></div>`;
 const body=list.length?`<div class="pf-tablewrap"><table><thead><tr><th>Date</th><th>Torrent</th><th>Catégorie</th><th class="r">Taille</th><th class="r">Seeders</th><th class="r">Seed</th><th class="r">Bonus</th><th class="r">Crédits</th></tr></thead><tbody>${list.map(p=>`<tr><td class="mono">${new Date(NOW-p[0]*DAY).toLocaleDateString("fr-FR")}</td><td>${esc(p[6])}</td><td>${esc(p[5])}</td><td class="r mono">${bytes(p[3])}</td><td class="r mono">${p[2]}</td><td class="r mono">${dur(p[4])}</td><td class="r mono">${p[7]==null?"—":"+"+p[7]+" %"}</td><td class="r mono">+${p[1]}</td></tr>`).join("")}</tbody></table></div>`
  :`<p class="pf-empty" id="t4k-payouts-none" style="padding:14px 0">Aucun paiement sur cette période.</p>`;
 return `<div class="pf-panel pf-wide" id="t4k-payouts">${head}${body}<div class="pf-rows"><div class="pf-row"><span>Sur la période</span><span class="pf-num">${list.length} paiements · ${fmt(total)} cr</span></div><div class="pf-row"><span>Enregistrés sur cet ordinateur</span><span class="pf-num">${all.length}</span></div></div>
 <p class="pf-note">Chaque paiement est gardé une seule fois, avec la taille, le nombre de seeders, la catégorie et le bonus de badge au moment du paiement.</p></div>`}
function estimate(a){const n=a.payouts.length,pct=Math.min(100,n/MIN*100);
 return `<div class="pf-panel pf-wide" id="t4k-estimate"><p class="pf-eyebrow">Estimation à partir de vos paiements <span class="pf-tag">indisponible</span></p>
 <p>Pas encore assez de données : <b class="pf-num">${n} / ${MIN}</b> paiements.</p>
 <div class="pf-meter" role="progressbar" aria-valuemin="0" aria-valuemax="${MIN}" aria-valuenow="${n}" aria-label="Paiements pour l’estimation"><span style="width:${pct}%"></span></div>
 <p class="pf-note">Aucun gain n’est affiché avant. Une fois l’estimation calculée, elle indiquera le nombre de paiements qui l’ont produite : c’est une estimation à partir de vos paiements, jamais une règle de tr4ker. En attendant, les Plans tr4ker classent par seeders, taille et freeleech.</p></div>`}
function sync(a){return `<div class="pf-panel pf-wide" id="t4k-sync"><p class="pf-eyebrow">Synchronisation</p><div class="pf-rows">
 <div class="pf-row"><span>Compagnon tr4ker</span><span class="pf-ok">appairé · à jour il y a 1 min</span></div>
 <div class="pf-row"><span>Ce qui est lu</span><span>compte, ratio, crédits, paiements, boutique</span></div></div>
 <p class="pf-note">Votre clé API, votre passkey et vos codes de récupération ne quittent jamais le navigateur.</p></div>`}
function tr4ker(){const a=ACCOUNTS[ui.scenario];if(!a.paired)return notPaired();
 return `${identity(a)}${kpis(a)}<section class="pf-two">${ratioPanel(a)}${shop(a)}${payouts(a)}${estimate(a)}${sync(a)}</section>`}

function render(){const a=ACCOUNTS[ui.scenario];
 document.documentElement.dataset.theme=ui.theme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
 $("view").innerHTML=ui.tracker==="c411"?c411():tr4ker();
 for(const b of document.querySelectorAll("#tracker button"))b.setAttribute("aria-pressed",String(b.dataset.tracker===ui.tracker));
 $("picker-note").textContent=ui.tracker==="c411"?"c411 reste le tracker par défaut.":"Le compte tr4ker, lu par le Compagnon.";
 $("scenario-label").textContent=a.label;
 $("privacy").textContent="Les chiffres viennent de votre session dans le navigateur ; aucun cookie, clé API ni passkey n’est conservé ici.";
 $("scenario").disabled=ui.tracker==="c411";
 document.title=ui.tracker==="c411"?"Profil · c411 · aperçu #179":"Profil · tr4ker · aperçu #179"}
const say=t=>{$("hint").textContent=t};
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.tracker){ui.tracker=b.dataset.tracker;render();say(ui.tracker==="tr4ker"?"Vue tr4ker":"Vue c411 (inchangée)");return}
 if(b.id==="scenario"){ui.scenario=SCENARIOS[(SCENARIOS.indexOf(ui.scenario)+1)%SCENARIOS.length];ui.period=0;render();say("Situation : "+ACCOUNTS[ui.scenario].label);return}
 if(b.id==="theme"){ui.theme=(document.documentElement.dataset.theme==="light")?"dark":"light";render();return}
 if(b.id==="reset"){ui.tracker="c411";ui.scenario="active";ui.period=0;ui.theme=null;render();say("Aperçu réinitialisé");return}
 if(b.dataset.days!==undefined){ui.period=+b.dataset.days;render();return}
 if(b.dataset.act==="refresh"){say("Actualisation demandée au Compagnon (simulation)");return}
 if(b.dataset.act==="pair"){say("Ouvrirait Paramètres → Connexions → Compagnon (simulation)");return}});
render();
</script>
</body></html>

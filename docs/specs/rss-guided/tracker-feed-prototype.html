<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSS · Tracker per subscription preview (#180)</title><style>/* Shared palette for Qt, the Web shell and bundled panels.

}
.feed-priority span {

.feed-editor {

}

}

.feed-category-pills {

}

.feed-preserved-rule {

.feed-community{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.feed-community>button{width:100%;text-align:left;background:transparent;color:var(--muted);font-size:13px;padding:9px 10px;line-height:1.5}
.feed-side-head{min-height:38px;gap:12px}.feed-side-head>.muted{white-space:nowrap}


/* New in this preview: the Tracker choice and tr4ker's feed fields. */
.demo-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:8px 12px; margin:0 0 14px; border:1px dashed var(--line); border-radius:10px; font-size:12.5px; color:var(--muted); }
.seg { display:flex; gap:8px; flex-wrap:wrap; }
.seg button { border-radius:999px; padding:6px 14px; }
.seg button[aria-pressed="true"] { background:var(--tint); border-color:var(--accent); font-weight:650; }
.seg .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; }
.source-note { margin:6px 0 0; font-size:13px; }
.badge-t { display:inline-block; font-size:11px; font-weight:650; padding:1px 8px; border-radius:999px; margin-left:6px; border:1px solid currentColor; }
.badge-c411 { color:#3b82f6; } .badge-tr4ker { color:#f97316; }
.passkey-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.feed-fields[hidden] { display:none; }
dialog { max-width: min(760px, calc(100vw - 24px)); width:100%; }
</style></head>
<body>
<div class="demo-bar"><span>Preview</span><button type="button" id="demo-theme" class="quiet">Theme: dark</button><button type="button" id="demo-lang" class="quiet">EN</button><button type="button" id="demo-open" class="quiet">Open the editor</button></div>
<div class="feed-layout"><aside><div class="feed-side-head"><span class="muted" id="side-title">Subscriptions</span></div>
<div id="side-list"></div></aside>
<div class="feed-main"><div class="feed-header"><h2 id="main-title">RSS</h2></div><p class="muted" id="main-note"></p></div></div>
<dialog id="dialog" open><button class="close" aria-label="Close" id="close">×</button><div id="dialog-content"><div class="feed-editor">
 <h2 id="t-title">RSS subscription</h2>
 <h3 id="t-follow">What to follow</h3>
 <div class="feed-field"><span id="t-tracker">Tracker</span>
  <div class="seg" role="group" aria-label="Tracker" id="tracker">
   <button type="button" data-t="c411" aria-pressed="true"><span class="dot" style="background:#3b82f6"></span>c411</button>
   <button type="button" data-t="tr4ker" aria-pressed="false"><span class="dot" style="background:#f97316"></span>tr4ker</button>
  </div></div>
 <label class="feed-field"><span id="t-name">Name</span><input id="name" value="Films 1080p"></label>
 <label class="feed-field"><span id="t-query">Title contains</span><input id="query" placeholder="Words the title must contain"></label>
 <div id="c411-fields" class="feed-fields"><div class="feed-field"><span id="t-cats">Categories</span>
   <div class="seg" id="cats"><button type="button" aria-pressed="true">Films</button><button type="button" aria-pressed="false">TV</button><button type="button" aria-pressed="false">Music</button></div></div></div>
 <div id="tr4ker-fields" class="feed-fields" hidden>
  <label class="feed-field"><span id="t-slug">Category</span><select id="slug"><option value="">All categories</option><option value="films">Films</option><option value="series">Series</option><option value="audio">Audio</option></select></label>
  <label class="feed-check"><input type="checkbox" id="free"><span id="t-free">Freeleech only</span></label>
  <p class="source-note muted" id="source"></p>
  <div class="passkey-row"><span id="passkey-state" class="muted"></span><button type="button" id="passkey-btn" class="quiet">Open Settings &gt; Connection &gt; tr4ker</button></div>
 </div>
 <p class="feed-strip" id="strip" role="status"></p>
 <div class="feed-where"><button class="primary" id="save" type="button">Save</button></div>
</div></div></dialog>
</body>
<script>
const state = { t: "c411", fr: false, passkey: true, subs: [{ n: "Films 1080p", t: "c411" }, { n: "Nouveautés tr4ker", t: "tr4ker" }] };
const $ = (id) => document.getElementById(id);
const say = (en, fr) => (state.fr ? fr : en);
const text = {
  "t-title": ["RSS subscription", "Abonnement RSS"], "t-follow": ["What to follow", "Ce qu’il faut suivre"],
  "t-tracker": ["Tracker", "Tracker"], "t-name": ["Name", "Nom"], "t-query": ["Title contains", "Le titre contient"],
  "t-cats": ["Categories", "Catégories"], "t-slug": ["Category", "Catégorie"], "t-free": ["Freeleech only", "Freeleech uniquement"],
  "side-title": ["Subscriptions", "Abonnements"], "main-title": ["RSS", "RSS"],
};
function render() {
  for (const [id, [en, fr]] of Object.entries(text)) $(id).textContent = state.fr ? fr : en;
  document.querySelectorAll("#tracker button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.t === state.t)));
  const t4k = state.t === "tr4ker";
  $("c411-fields").hidden = t4k; $("tr4ker-fields").hidden = !t4k;
  const query = $("query").value.trim();
  // tr4ker without a query follows its passkey feed; with a query it polls Torznab.
  if (t4k) {
    $("source").textContent = query
      ? say("A query polls tr4ker through Torznab (API key). The category and freeleech choices need the feed: clear the query to use them.", "Une requête interroge tr4ker via Torznab (clé API). La catégorie et le freeleech demandent le flux : videz la requête pour les utiliser.")
      : say("Without a query this follows tr4ker's RSS feed: its 100 latest items, filtered by the category and freeleech you choose.", "Sans requête, cet abonnement suit le flux RSS de tr4ker : ses 100 derniers éléments, filtrés par la catégorie et le freeleech choisis.");
    $("slug").disabled = $("free").disabled = Boolean(query);
    $("passkey-state").textContent = query ? "" : state.passkey ? say("Passkey saved in the keyring. It is never stored in the subscription or exported.", "Passkey enregistrée dans le trousseau. Elle n’est jamais stockée dans l’abonnement ni exportée.") : say("The feed needs your tr4ker passkey.", "Le flux demande votre passkey tr4ker.");
    $("passkey-btn").hidden = query || state.passkey; $("passkey-btn").textContent = say("Open Settings > Connection > tr4ker", "Ouvrir Réglages > Connexion > tr4ker");
    $("strip").textContent = query ? say("Checking tr4ker through Torznab…", "Vérification de tr4ker via Torznab…") : state.passkey ? say("100 items in the feed · the first check is the baseline, nothing is queued.", "100 éléments dans le flux · la première vérification sert de référence, rien n’est ajouté.") : say("Add the tr4ker passkey to read the feed.", "Ajoutez la passkey tr4ker pour lire le flux.");
    $("strip").className = !query && !state.passkey ? "feed-strip danger" : "feed-strip";
  } else {
    $("strip").textContent = say("c411 subscriptions work as before.", "Les abonnements c411 fonctionnent comme avant."); $("strip").className = "feed-strip";
  }
  $("side-list").replaceChildren(...state.subs.map((s) => { const p = document.createElement("p"); p.textContent = s.n; const b = document.createElement("span"); b.className = "badge-t badge-" + s.t; b.textContent = s.t; p.append(b); return p; }));
  $("demo-lang").textContent = state.fr ? "FR" : "EN";
}
document.querySelectorAll("#tracker button").forEach((b) => (b.onclick = () => { state.t = b.dataset.t; render(); }));
document.querySelectorAll("#cats button").forEach((b) => (b.onclick = () => b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"))));
$("query").oninput = render;
$("passkey-btn").onclick = () => { state.passkey = true; render(); };
$("save").onclick = () => { state.subs.push({ n: $("name").value || "RSS", t: state.t }); render(); $("main-note").textContent = say("Saved in memory only (preview).", "Enregistré en mémoire uniquement (aperçu)."); };
$("close").onclick = () => $("dialog").close();
$("demo-open").onclick = () => $("dialog").show();
$("demo-lang").onclick = () => { state.fr = !state.fr; render(); };
$("demo-theme").onclick = () => { const light = document.documentElement.dataset.theme !== "light"; document.documentElement.dataset.theme = light ? "light" : "dark"; $("demo-theme").textContent = "Theme: " + (light ? "light" : "dark"); };
render();
</script></html>

<!doctype html>
<html lang="fr" data-theme="dark">
  <!-- Preview of issue #180 built from the REAL RSS view (feeds/view.html). Open this file from disk. -->
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>RSS</title
  ><link rel="stylesheet" href="panel/base.css" /><link
    rel="stylesheet"
    href="feeds/view.css?v=5"
  />
  <link rel="stylesheet" href="panel/community-items.css" />
  <link rel="stylesheet" href="panel/toast.css" />
  <link rel="stylesheet" href="preview/preview.css?v=3" />
  <script src="panel/i18n.js" defer></script>
  <script src="panel/toast.js" defer></script>
  <!-- Stub: answers every request from memory instead of the Web shell. -->
  <script src="panel/transport.js" defer></script>
  <script src="feeds/tr4ker-categories.js" defer></script>
  <script src="preview/backend.js?v=5" defer></script>
  <script src="feeds/transport.js" defer></script>
  <script src="feeds/view.js?v=5" defer></script>
  <script src="preview/chrome.js" defer></script>
  <body>
    <div id="preview-bar" role="toolbar" aria-label="Aperçu #180">
      <strong>Aperçu #180</strong>
      <label class="pv-switch"><input type="checkbox" id="pv-changes" checked /> <span id="pv-changes-label">Afficher les changements</span></label>
      <select id="pv-lang" aria-label="Langue"><option value="fr">Français</option><option value="en">English</option></select>
      <select id="pv-theme" aria-label="Thème"><option value="dark">Sombre</option><option value="light">Clair</option></select>
      <label class="pv-switch"><input type="checkbox" id="pv-passkey" /> <span id="pv-passkey-label">Passkey tr4ker absente</span></label>
      <button type="button" id="pv-reset">Réinitialiser</button>
    </div>
    <div class="feed-layout">
      <aside>
        <div id="feeds-side-head" class="feed-side-head"></div>
        <div id="feeds-sidebar"></div>
        <div id="feeds-community" class="feed-community"></div>
      </aside>
      <div class="feed-main">
        <div id="feeds-empty" class="feed-empty" hidden></div>
        <div id="feeds-body">
          <div id="feeds-header" class="feed-header"></div>
          <div id="feeds-filters" class="feed-filters" role="tablist"></div>
          <div id="feeds-actions" class="feed-selection" hidden></div>
          <div id="feeds-results" class="table-wrap"></div>
        </div>
      </div>
    </div>
    <dialog id="dialog">
      <button class="close" aria-label="Close">×</button>
      <div id="dialog-content"></div>
    </dialog>
  <script src="panel/community-items.js"></script></body>
</html>

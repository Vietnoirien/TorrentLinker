<!doctype html>
<!-- Throwaway design review for #79, #87 and #88. Fictional data, memory only. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TorrentLinker · Interface review</title>
<style id="shared-palette">/* Shared palette for Qt, the Web shell and bundled panels.
   Keep these two token blocks literal: gui/theme.py reads their declarations.
   Approved panel-specific light overrides remain in each panel's view.css. */
:root {
  color-scheme: dark;
  --bg: #161d23;
  --panel: #202932;
  --raised: #26323c;
  --line: #33404b;
  --text: #e2e9ed;
  --muted: #98aab7;
  --accent: #80bdb6;
  --accent-text: #102a2b;
  --tint: #263e43;
  --hover: #263e43;
  --danger: #ff9c9c;
  --warning: #edbf73;
  --success: #4ad394;
  --link: #64c9c0;
  --shadow: none;
  --ink: var(--text);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f6fa;
  --panel: #ffffff;
  --raised: #f7f9fc;
  --line: #d5dfe9;
  --text: #203047;
  --muted: #5c6c80;
  --accent: #087f76;
  --accent-text: #ffffff;
  --tint: #d8eeeb;
  --hover: #e8f3f2;
  --danger: #b42332;
  --warning: #8a5800;
  --success: #1f9d63;
  --link: #087f76;
  --shadow: 0 16px 60px #172b3e12;
}
</style>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 13px;min-width:0}button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:hover{background:var(--raised)}button:disabled{opacity:.45;cursor:default}.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:650}button[aria-current=page],button[aria-pressed=true]{background:var(--tint);border-color:var(--accent)}button:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:2px}a{color:var(--link)}h1,h2,h3,p{margin:0}h1{font-size:27px;letter-spacing:-.6px}h2{font-size:19px}h3{font-size:15px}p,.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:16px}.panel{padding:20px;border:1px solid var(--line);background:var(--panel);border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}.pill{background:var(--tint);padding:3px 8px;border-radius:5px;font-size:12px}.review{padding:14px 24px;border-bottom:1px dashed var(--accent);background:var(--raised)}.review label{font-size:12px;display:flex;align-items:center;gap:6px}.review summary{font-size:12px;color:var(--muted)}#viewport{max-width:1600px;margin:auto;transition:max-width .15s}#viewport.mobile{max-width:390px;border-inline:1px solid var(--line)}.shell{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:760px}.sidebar{padding:20px 12px;background:var(--panel);border-right:1px solid var(--line)}.sidebar nav{display:grid;gap:5px;margin-top:24px}.sidebar button{justify-content:flex-start;width:100%;border-color:transparent}.brand{font-size:17px;font-weight:650;padding:0 8px}.workspace{min-width:0}.top{padding:18px 24px;border-bottom:1px solid var(--line)}.top label{display:flex;gap:8px;align-items:center}.content{padding:24px;display:grid;gap:20px}.subnav{display:flex;gap:8px;flex-wrap:wrap}.settings{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px}.settings nav{display:grid;align-content:start;gap:4px}.settings nav button{justify-content:flex-start;flex:none}.settings>*{min-width:0}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:grid;gap:6px}.field small{color:var(--muted)}.field input,.field select,.field textarea{width:100%}.wide{grid-column:1/-1}.save{padding-top:16px;border-top:1px solid var(--line)}.table{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--muted)}td:first-child{white-space:normal;min-width:180px}input[type=checkbox]{width:auto;accent-color:var(--accent)}.zen-band{border-top:1px solid var(--line);padding:16px 24px;background:var(--panel)}.status{padding:12px 24px;background:var(--tint)}.state{padding:48px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px;display:grid;gap:12px;justify-items:center}.danger{color:var(--danger)}progress{width:100%;accent-color:var(--accent)}dialog{max-width:600px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:24px}dialog::backdrop{background:#0009}dialog .actions{justify-content:flex-end;margin-top:24px}.doc{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px}.doc nav{display:grid;gap:8px;align-content:start}.doc article{max-width:760px}.doc article p{margin:16px 0}.mobile-nav{display:none}pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto}.mobile .shell{grid-template-columns:1fr}.mobile .sidebar{display:none}.mobile .mobile-nav{display:block}.mobile .settings,.mobile .doc{grid-template-columns:1fr}.mobile .settings nav{display:flex;overflow:auto}.mobile .settings nav button{white-space:nowrap}.mobile .content,.mobile .top{padding:16px}.mobile .form{grid-template-columns:1fr}.mobile .top .row{align-items:stretch}.mobile .zen-band{padding:16px}.mobile .doc nav{grid-template-columns:1fr}.mobile h1{font-size:23px}@media(max-width:700px){.shell{grid-template-columns:1fr}.sidebar{display:none}.mobile-nav{display:block}.settings,.doc,.form{grid-template-columns:1fr}.settings nav{display:flex;overflow:auto}.settings nav button{white-space:nowrap}.content,.top,.review{padding:16px}.zen-band{padding:16px}}
</style>
<div class="review stack"><div class="row between"><strong>Prototype · #79 / #87 / #88</strong><span class="muted">Fictional fixtures · no files, services or persistence</span></div><div class="row">
<label>Review <select id="area"><option value="zen">#79 · Zen</option><option value="settings">#87 · Settings</option><option value="shell">#88 · Shell & Documentation</option></select></label>
<label>Host <select id="host"><option value="desktop">Desktop</option><option value="web">Web</option></select></label>
<label>Language <select id="language"><option value="en">English</option><option value="fr">Français</option></select></label>
<label>Theme <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
<label>State <select id="scenario"><option value="ready">Ready</option><option value="empty">Empty</option><option value="loading">Loading</option><option value="error">Error</option></select></label>
<label>Viewport <select id="size"><option value="desktop">Desktop</option><option value="mobile">390 px</option></select></label>
<button id="reset">Reset fixture</button></div><details><summary>Review state</summary><pre id="debug"></pre></details></div>
<div id="viewport"><div id="app"></div></div><dialog id="dialog"></dialog>
<script>
const $=id=>document.getElementById(id), tr=(en,fr)=>s.language==='fr'?fr:en;
const query=new URLSearchParams(location.search);
let s={area:query.get('area')||'zen',host:'desktop',language:'en',theme:'dark',scenario:'ready',size:'desktop',page:'catalogue',section:'connections',client:'Studio',selected:[0,1],fetching:false,sending:false,sent:0,expanded:['Films'],fields:{},savedFields:{},dirty:false,planSort:0,seedSort:0,notice:'',update:true,guide:'start',history:['start'],historyAt:0,guideFilter:'',guideLanguage:'en',queued:false,clients:['Studio','Seedbox'],folders:['/library/films','/library/music']};
const copy=JSON.stringify(s);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b=(label,action,cls='')=>`<button class="${cls}" data-action="${action}">${label}</button>`;
const note=()=>{ $('debug').textContent=JSON.stringify(s,null,2);if($('save-status'))$('save-status').textContent=s.dirty?tr('Unsaved changes','Modifications non enregistrées'):tr('All changes saved','Toutes les modifications sont enregistrées') };
const names=()=>({catalogue:tr('Catalogue','Catalogue'),plan:tr('Plan','Plan'),seeding:tr('Seeding','Seed'),profile:tr('Profile','Profil'),library:tr('Library','Bibliothèque'),search:tr('Search','Recherche'),torrents:tr('Torrents','Torrents'),upload:tr('Upload','Upload'),feeds:tr('RSS','RSS'),assistant:tr('Assistant','Assistant'),media:tr('Media','Médias'),settings:tr('Settings','Paramètres'),docs:tr('Documentation','Documentation')});
const sections=()=>({connections:tr('Connections','Connexions'),clients:tr('Clients','Clients'),companion:tr('Companion','Companion'),agents:tr('Agent access','Accès agent'),assistant:tr('Assistant','Assistant'),general:tr('General','Général'),library:tr('Library Folders','Dossiers de bibliothèque'),downloads:tr('Download Folders','Dossiers de téléchargement'),paths:tr('Client Paths','Chemins du client'),matching:tr('Search & Matching','Recherche et correspondance'),zen:tr('Zen','Zen')});
const select=(key,label,items,value)=>`<label class="field">${label}<select data-field="${key}">${items.map(x=>`<option ${String(s.fields[key]??value)===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`;
const field=(key,label,value='',type='text',help='')=>`<label class="field">${label}<input data-field="${key}" type="${type}" value="${esc(s.fields[key]??value)}">${help?`<small>${help}</small>`:''}</label>`;
const check=(key,label,checked=false)=>`<label class="row"><input type="checkbox" data-field="${key}" ${(s.fields[key]??checked)?'checked':''}>${label}</label>`;
function stateView(){if(s.scenario==='ready')return '';return `<div class="state"><h2>${s.scenario==='loading'?tr('Loading…','Chargement…'):s.scenario==='error'?tr('Could not load this page','Impossible de charger cette page'):tr('Nothing here yet','Aucun élément pour le moment')}</h2><p>${s.scenario==='loading'?tr('Your work stays here while this finishes.','Votre travail reste ici pendant le chargement.'):s.scenario==='error'?tr('The server did not respond. Your changes are kept.','Le serveur ne répond pas. Vos modifications sont conservées.'):tr('Add a connection or fetch data to get started.','Ajoutez une connexion ou récupérez des données pour commencer.')}</p>${s.scenario==='loading'?'<progress></progress>':b(s.scenario==='error'?tr('Retry','Réessayer'):tr('Show example','Afficher un exemple'),'ready','primary')}</div>`}
function band(){return `<footer class="zen-band row between"><div class="row"><strong>12 840 Zen</strong><span class="pill">≈ 184 Zen / ${tr('day','jour')}</span><span class="muted">${tr('Updated 2 min ago','Mis à jour il y a 2 min')}</span></div><div class="row">${b(tr('Build a Plan','Créer un Plan'),'page:plan')}${b('Catalogue','page:catalogue')}</div></footer>`}
function render(){document.documentElement.dataset.theme=s.theme;document.documentElement.lang=s.language;for(const k of ['area','host','language','theme','scenario','size'])$(k).value=s[k];$('viewport').className=s.size==='mobile'?'mobile':'';const ns=names();const nav=Object.entries(ns).map(([k,v])=>`<button data-action="page:${k}" aria-current="${s.page===k?'page':'false'}">${v}</button>`).join('');$('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">TorrentLinker</div><nav aria-label="${tr('Main navigation','Navigation principale')}">${nav}</nav>${s.host==='web'?b(tr('Sign out','Déconnexion'),'signout'):''}</aside><div class="workspace"><header class="top stack"><div class="row between"><select class="mobile-nav" id="navigation" aria-label="Navigation">${Object.entries(ns).map(([k,v])=>`<option value="${k}" ${s.page===k?'selected':''}>${v}</option>`).join('')}</select><strong>${ns[s.page]||ns.settings}</strong><label>${tr('Client','Client')} <select id="client"><option ${s.page!=='torrents'?'disabled':''} ${s.client==='All clients'?'selected':''}>${tr('All clients','Tous les clients')}</option>${s.clients.map(c=>`<option ${s.client===c?'selected':''}>${c}</option>`).join('')}</select></label></div>${s.area==='shell'&&s.update?`<div class="panel row between"><span>${tr('An update is available. You are running beta.43.','Une mise à jour est disponible. Vous utilisez beta.43.')}</span><div class="row">${b(tr('Release notes','Notes de version'),'release')}${b(tr('Dismiss','Masquer'),'dismiss')}</div></div>`:''}</header>${s.notice?`<div class="status row between" role="status"><span>${esc(s.notice)}</span>${b('×','clear')}</div>`:''}<main class="content">${s.page==='settings'?settings():s.page==='docs'?docs():['catalogue','plan','seeding'].includes(s.page)?zen():shellPage()}</main>${['catalogue','plan','seeding','profile'].includes(s.page)?band():''}</div></div>`;note()}
function zen(){const nav=`<nav class="subnav">${['catalogue','plan','seeding'].map(k=>`<button data-action="page:${k}" aria-current="${s.page===k?'page':'false'}">${names()[k]}</button>`).join('')}</nav>`;return `<h1>${names()[s.page]}</h1>${nav}${stateView()||(s.page==='catalogue'?catalogue():s.page==='plan'?plan():seeding())}`}
function catalogue(){const cats=[['Films',4280],['Séries',2100],['Musique',1860],['Livres',920]];return `<div class="row between"><p>${tr('Fetch every category or update only the one you need.','Récupérez toutes les catégories ou seulement celle dont vous avez besoin.')}</p>${b(s.fetching?tr('Pause fetching','Suspendre la récupération'):tr('Fetch all categories','Récupérer toutes les catégories'),s.fetching?'pause':'fetch:all','primary')}</div>${s.fetching?`<div class="panel stack"><div class="row between"><strong>${tr('Fetching','Récupération')} · ${s.fetching}</strong><span>42%</span></div><progress value="42" max="100"></progress>${b(tr('Stop fetching and plan now','Arrêter et créer le Plan'),'plan-now')}</div>`:''}<div class="grid">${cats.map(([name,count])=>`<section class="panel stack"><div class="row between"><h2>${name}</h2><span class="pill">${count}</span></div><p>${tr('Updated today · 12:40','Mis à jour aujourd’hui · 12:40')}</p>${b(tr('Fetch only','Récupérer seulement')+' '+name,'fetch:'+name)}</section>`).join('')}</div>`}
const rows=[['Northern Lights · 1080p','Films','8.4 GiB',42],['A Small Orchestra · FLAC','Musique','1.2 GiB',18],['The Long Journey · S01','Séries','24 GiB',67]];
function plan(){return `<div class="panel row between"><div><h2>${tr('Zen Profile','Profil Zen')}</h2><p>${tr('Class: Swarm Keeper · 24 seed hours/day · 10% disk margin','Classe : Swarm Keeper · 24 h de seed/jour · 10 % de réserve disque')}</p></div>${b(tr('Edit in Settings','Modifier dans les paramètres'),'zen-settings')}</div><div class="row between"><div class="row">${b(tr('Fetch and build','Récupérer et créer'),'fetch:Plan')}${b(tr('Select whole Plan','Sélectionner tout le Plan'),'select-all')}${b(tr('Clear selection','Effacer la sélection'),'select-none')}</div><label>${tr('Sort','Trier')} <select id="plan-sort"><option ${s.planSort===0?'selected':''}>Zen / GiB ↓</option><option ${s.planSort===1?'selected':''}>${tr('Size ↑','Taille ↑')}</option><option ${s.planSort===2?'selected':''}>${tr('Name ↑','Nom ↑')}</option></select></label></div>${s.fetching?`<div class="panel stack"><p>${tr('Fetching candidates…','Récupération des candidats…')}</p><progress></progress>${b(tr('Stop fetching and plan now','Arrêter et créer le Plan'),'plan-now')}</div>`:''}<div class="panel table"><table><thead><tr><th>${tr('Torrent','Torrent')}</th><th>${tr('Category','Catégorie')}</th><th>${tr('Size','Taille')}</th><th>≈ Zen/${tr('day','jour')}</th></tr></thead><tbody>${rows.map((r,i)=>[r,i]).sort((a,b)=>s.planSort===2?a[0][0].localeCompare(b[0][0]):s.planSort===1?parseFloat(a[0][2])-parseFloat(b[0][2]):b[0][3]/parseFloat(b[0][2])-a[0][3]/parseFloat(a[0][2])).map(([r,i])=>`<tr><td><label><input type="checkbox" data-selection="${i}" ${s.selected.includes(i)?'checked':''}> ${r[0]}</label></td>${r.slice(1).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="row between"><span>${s.selected.length} ${tr('selected','sélectionnés')}</span><div class="row">${b(tr('Queue selected downloads','Mettre les téléchargements sélectionnés en file'),'queue')}${b(tr('Review and send','Vérifier et envoyer'),'send-review','primary')}</div></div>${s.sending?`<div class="panel stack"><h2>${tr('Sending','Envoi')} · ${s.sent}/${s.selected.length}</h2><progress value="${s.sent}" max="${s.selected.length||1}"></progress><div class="row">${b(tr('Stop sending','Arrêter l’envoi'),'stop-send')}${b(tr('Simulate next completion','Simuler la fin suivante'),'sent')}</div></div>`:''}`}
function seeding(){return `<div class="row between"><div class="row">${b(tr('Expand all','Tout développer'),'expand')}${b(tr('Collapse all','Tout réduire'),'collapse')}</div><label>${tr('Sort','Trier')} <select id="seed-sort"><option>Zen/${tr('day','jour')} ↓</option><option>${tr('Name ↑','Nom ↑')}</option><option>${tr('Ratio ↓','Ratio ↓')}</option></select></label></div><p>${tr('Expanded categories are remembered for this owner.','Les catégories développées sont mémorisées pour ce propriétaire.')}</p>${['Films','Musique','Séries'].map(cat=>`<section class="panel stack">${b((s.expanded.includes(cat)?'▾ ':'▸ ')+cat+' · '+rows.filter(r=>r[1]===cat).length,'expand:'+cat)}${s.expanded.includes(cat)?rows.filter(r=>r[1]===cat).map(r=>`<div class="row between"><strong>${r[0]}</strong><span>${r[2]} · ${r[3]} Zen/${tr('day','jour')} · ratio 2.4</span></div>`).join(''):''}</section>`).join('')}`}
function settings(){const sec=sections();return `<h1>${names().settings}</h1><div class="settings"><nav aria-label="${names().settings}">${Object.entries(sec).map(([k,v])=>`<button data-action="section:${k}" aria-current="${s.section===k?'page':'false'}">${v}</button>`).join('')}</nav><section class="stack"><h2>${sec[s.section]}</h2>${stateView()||settingsBody()}<footer class="save row between"><span class="muted" id="save-status">${s.dirty?tr('Unsaved changes','Modifications non enregistrées'):tr('All changes saved','Toutes les modifications sont enregistrées')}</span><div class="row">${b(tr('Cancel','Annuler'),'cancel')}${b(tr('Save','Enregistrer'),'save','primary')}</div></footer></section></div>`}
function settingsBody(){switch(s.section){case 'connections':return `<div class="panel stack"><h3>${tr('Torrent Client','Client torrent')}</h3><div class="form">${select('kind',tr('Client type','Type de client'),['qBittorrent','Deluge','Transmission','rTorrent','µTorrent'],'qBittorrent')}${field('name',tr('Client name','Nom du client'),'Studio')}${field('address',tr('Remote address','Adresse distante'),'http://fixture.invalid:8080')}${field('user',tr('Username','Identifiant'),'owner')}${field('password',tr('Password','Mot de passe'),'fixture','password')}${field('api',tr('API key','Clé API'),'fixture','password')}</div>${b(tr('Test connection','Tester la connexion'),'test')}</div><div class="panel stack"><h3>Indexer</h3><div class="form">${field('torznab','Torznab URL','https://fixture.invalid/torznab')}${field('index-key',tr('API key','Clé API'),'fixture','password')}${field('extra-keys',tr('More API keys','Autres clés API'),'')}${field('announce',tr('Announce URL','URL d’annonce'),'https://fixture.invalid/announce')}</div>${b(tr('Test Indexer','Tester l’indexeur'),'test')}</div><div class="panel form">${field('tmdb','TMDb API key','fixture','password')}</div><div class="panel stack"><h3>Proxy</h3><div class="form">${field('proxy',tr('Address','Adresse'),'socks5://fixture.invalid:1080')}${field('proxy-user',tr('Username','Identifiant'))}${field('proxy-password',tr('Password','Mot de passe'),'','password')}</div>${check('proxy-client',tr('Also for the Torrent Client','Également pour le client torrent'))}${b(tr('Test proxy','Tester le proxy'),'test')}</div><p>${s.host==='desktop'?tr('Passwords use the system keyring when available.','Les mots de passe utilisent le trousseau système si disponible.'):tr('Secrets are stored by the server. They are never returned in full.','Le serveur conserve les secrets. Ils ne sont jamais retournés en clair.')}</p>`;
case 'clients':return `<div class="stack">${s.clients.map(c=>`<div class="panel row between"><div><h3>${c}</h3><p>qBittorrent · ${c===s.client?tr('Active','Actif'):tr('Available','Disponible')}</p></div><div class="row">${b(tr('Edit','Modifier'),'edit-client:'+c)}${b(tr('Use','Utiliser'),'use:'+c)}${b(tr('Remove','Supprimer'),'remove-client:'+c)}</div></div>`).join('')}${b(tr('Add client','Ajouter un client'),'add-client')}</div>`;
case 'companion':return `<div class="panel stack"><h3>${tr('Browser companion','Extension du navigateur')}</h3><p>${s.host==='desktop'?tr('Local receiver · port 8767 · Ready to pair','Récepteur local · port 8767 · Prêt à être associé'):tr('Pair this browser with its desktop receiver. The Web server cannot pair a different machine.','Associez ce navigateur à son récepteur de bureau. Le serveur Web ne peut pas associer une autre machine.')}</p><div class="row">${b(tr('Pair browser','Associer le navigateur'),'pair')}${b(tr('Revoke pairing','Révoquer l’association'),'revoke')}</div></div>`;
case 'agents':return `<div class="panel stack"><h3>${tr('Agent access','Accès agent')}</h3>${check('agents-enabled',tr('Enable owner agent access','Activer l’accès agent du propriétaire'))}${field('agent-name',tr('Agent name','Nom de l’agent'),'Local assistant')}<p>${tr('Read-only by default. Review individual mutation proposals before approval.','Lecture seule par défaut. Vérifiez chaque proposition de modification avant approbation.')}</p><div class="row">${b(tr('Create token','Créer un jeton'),'token')}${b(tr('Revoke token','Révoquer le jeton'),'revoke')}${b(tr('Review proposal','Vérifier une proposition'),'proposal')}</div></div>`;
case 'assistant':return `<div class="panel stack"><h3>${tr('Provider connection','Connexion au fournisseur')}</h3><div class="form">${select('provider',tr('Provider','Fournisseur'),['Ollama','OpenAI-compatible'],'Ollama')}${field('provider-url',tr('Base URL','URL de base'),'http://fixture.invalid:11434')}${field('provider-key',tr('API key','Clé API'),'','password')}${field('model',tr('Model','Modèle'),'fixture-model')}</div><div class="row">${b(tr('Test connection','Tester la connexion'),'test')}${b(tr('List models','Lister les modèles'),'models')}</div></div><div class="panel form">${field('run-limit',tr('Steps per run','Étapes par exécution'),'20','number')}${field('daily-limit',tr('Daily budget','Budget quotidien'),'5','number')}${select('default-mode',tr('Default mode','Mode par défaut'),[tr('Discuss','Discuter'),tr('Run within limits','Exécuter dans les limites')],tr('Discuss','Discuter'))}</div>`;
case 'general':return `<div class="panel form">${select('locale',tr('Language','Langue'),['Automatic','English','Français'],'Automatic')}${select('appearance',tr('Theme','Thème'),['System','Dark','Light'],'System')}${s.host==='desktop'?select('scale',tr('Interface size','Taille de l’interface'),['100%','125%','150%'],'100%'):`<p>${tr('Use browser zoom to change interface size.','Utilisez le zoom du navigateur pour modifier la taille de l’interface.')}</p>`}${select('layout',tr('Media interface','Interface multimédia'),['Cinematic','Collection','Focus'],'Cinematic')}${check('adult',tr('Show XXX content','Afficher le contenu XXX'))}</div>${b(tr('Diagnostics','Diagnostics'),'diagnostics')}`;
case 'library':return folders(false);
case 'downloads':return folders(true)+`<div class="panel">${check('sequential',tr('Request sequential video downloads when supported','Demander les téléchargements vidéo séquentiels si disponibles'),true)}</div>`;
case 'paths':return `<p>${tr('Map the client’s path to the folder visible on this host.','Associez le chemin du client au dossier visible sur cet hôte.')}</p><div class="panel form">${field('client-path',tr('Client path','Chemin du client'),'/downloads')}${field('host-path',tr('Local / server path','Chemin local / serveur'),'/mnt/seedbox')}</div><div class="row">${b(tr('Browse','Parcourir'),'browse')}${b(tr('Validate mapping','Vérifier la correspondance'),'test')}</div>`;
case 'matching':return `<div class="panel stack"><h3>${tr('Search categories','Catégories de recherche')}</h3><div class="form">${field('films','Films','2000')}${field('music',tr('Music','Musique'),'3000')}${field('books',tr('Books','Livres'),'7000')}${field('series',tr('Series','Séries'),'5000')}</div>${b(tr('Fill from Indexer','Remplir depuis l’indexeur'),'test')}</div><div class="panel form">${field('tolerance',tr('Size tolerance before fetching a .torrent (%)','Tolérance de taille avant récupération d’un .torrent (%)'),'2','number')}${field('coverage',tr('Minimum Partial Match coverage (%)','Couverture minimale d’une correspondance partielle (%)'),'90','number')}${field('ignored',tr('Ignored Files','Fichiers ignorés'),'*.nfo, *.txt')}${field('excluded',tr('Excluded from Plans','Exclus des Plans'),'sample, trailer')}</div>`;
case 'zen':return `<div class="panel form">${select('class',tr('Class','Classe'),['Swarm Keeper','Tanker','Reuploader'],'Swarm Keeper')}${field('tree',tr('Tree bonus unlocked (%)','Bonus d’arbre débloqué (%)'),'5','number')}${field('badge',tr('Shop badges bonus','Bonus des badges boutique'),'5','number')}${field('hours',tr('Seed hours per day','Heures de seed par jour'),'24','number')}${field('cap',tr('Torrent cap','Limite de torrents'),'500','number')}${field('margin',tr('Free space kept on each disk (%)','Espace libre conservé sur chaque disque (%)'),'10','number')}</div><p>${tr('These fields are edited here only. Plan shows a summary and links back here.','Ces champs se modifient uniquement ici. Le Plan affiche un résumé et renvoie ici.')}</p>${b(tr('Test available speed','Tester le débit disponible'),'speed')}`}}
function folders(downloads){return `<p>${downloads?tr('Choose a destination for each download category.','Choisissez une destination pour chaque catégorie de téléchargement.'):tr('Only enabled Library Folders are scanned.','Seuls les dossiers de bibliothèque activés sont analysés.')}</p><div class="stack">${s.folders.map((p,i)=>`<div class="panel stack"><div class="row between"><strong>${esc(p)}</strong>${check('folder-'+i,tr('Enabled','Activé'),true)}</div>${downloads?select('category-'+i,tr('Category','Catégorie'),['Films','Musique','Séries','Default'],i?'Musique':'Films'):select('content-'+i,tr('Content type','Type de contenu'),['Automatic','Video','Music','Books'],'Automatic')}<div class="row">${b(tr('Browse','Parcourir'),'browse')}${b(tr('Remove','Supprimer'),'remove-folder:'+i)}</div></div>`).join('')}${b(tr('Add folder','Ajouter un dossier'),'add-folder')}${s.host==='desktop'?b(tr('Import folders from client','Importer les dossiers du client'),'import-folders'):`<p>${tr('Browse folders on the server, within configured roots.','Parcourez les dossiers du serveur dans les racines configurées.')}</p>`}</div>`}
const guides=()=>({start:tr('Getting started','Bien démarrer'),media:tr('Media','Médias'),folders:tr('Library Folders','Dossiers de bibliothèque'),assistant:tr('Assistant','Assistant')});
function docs(){const gs=guides();return `<h1>${names().docs}</h1><div class="row">${b('← '+tr('Back','Précédent'),'back')}${b(tr('Forward','Suivant')+' →','forward')}<label>${tr('Guide language','Langue du guide')} <select id="guide-language"><option value="en" ${s.guideLanguage==='en'?'selected':''}>English</option><option value="fr" ${s.guideLanguage==='fr'?'selected':''}>Français</option></select></label></div>${stateView()||`<div class="doc"><nav><input id="guide-filter" placeholder="${tr('Filter guides','Filtrer les guides')}" value="${esc(s.guideFilter)}" aria-label="${tr('Filter guides','Filtrer les guides')}">${Object.entries(gs).filter(([k,v])=>v.toLowerCase().includes(s.guideFilter.toLowerCase())).map(([k,v])=>b(v,'guide:'+k)).join('')||`<p>${tr('No matching guide','Aucun guide correspondant')}</p>`}</nav><article class="panel"><h2>${gs[s.guide]}</h2><p>${s.guideLanguage==='fr'?'Ajoutez un client torrent dans les paramètres, puis choisissez les dossiers accessibles depuis cet appareil.':'Add a Torrent Client in Settings, then choose folders accessible from this device.'}</p><h3>${s.guideLanguage==='fr'?'Choisir les bons dossiers':'Choose the right folders'}</h3><p>${s.guideLanguage==='fr'?'Les dossiers de bibliothèque contiennent les fichiers à analyser. Les dossiers de téléchargement sont les destinations des nouveaux téléchargements.':'Library Folders contain files to scan. Download Folders are destinations for new downloads.'}</p>${b(gs.folders,'guide:folders')} ${b(gs.media,'guide:media')}<p class="muted">${tr('Sample guide excerpt for navigation review.','Extrait de guide fictif pour vérifier la navigation.')}</p></article></div>`}`}
function shellPage(){return `<h1>${names()[s.page]}</h1><p>${tr('Find your files, review their status and choose the next action.','Retrouvez vos fichiers, vérifiez leur état et choisissez la prochaine action.')}</p>${stateView()||`<div class="panel stack"><h2>${tr('Shared application shell','Cadre commun de l’application')}</h2><p>${tr('The existing page remains here. This prototype only changes navigation and documentation.','La page existante reste ici. Ce prototype ne modifie que la navigation et la documentation.')}</p><div class="row">${b(tr('Keyboard shortcuts','Raccourcis clavier'),'shortcuts')}${b(names().docs,'page:docs')}${s.host==='web'?b(tr('Activity','Activité'),'activity'):''}</div></div>`}`}
function modal(title,body,actions=[]){$('dialog').innerHTML=`<h2>${title}</h2><div class="stack" style="margin-top:16px">${body}</div><div class="row actions">${b(tr('Cancel','Annuler'),'close')}${actions.map(([label,action,cls])=>b(label,action,cls)).join('')}</div>`;$('dialog').showModal()}
function message(text){s.notice=text;render()}
function action(a){const [kind,...parts]=a.split(':'),value=parts.join(':');if(kind==='page'){s.page=value;if(s.client==='All clients'&&value!=='torrents')s.client=s.clients[0]||'Studio';if(['catalogue','plan','seeding'].includes(value))s.area='zen';else if(value==='settings')s.area='settings';else s.area='shell';s.scenario='ready';render();return}if(kind==='section'){s.section=value;render();return}if(kind==='fetch'){s.fetching=value;render();return}if(kind==='expand'){s.expanded=value?s.expanded.includes(value)?s.expanded.filter(x=>x!==value):[...s.expanded,value]:['Films','Musique','Séries'];render();return}if(kind==='guide'){s.guide=value;s.history=s.history.slice(0,s.historyAt+1);s.history.push(value);s.historyAt++;render();return}if(kind==='use'){s.client=value;render();return}if(kind==='edit-client'){s.client=value;s.section='connections';render();return}if(kind==='remove-client'){modal(tr('Remove client?','Supprimer le client ?'),`<p>${esc(value)} · ${tr('Existing files stay in place.','Les fichiers existants sont conservés.')}</p>`,[[tr('Remove','Supprimer'),'confirm-client:'+value,'primary']]);return}if(kind==='confirm-client'){s.clients=s.clients.filter(c=>c!==value);if(s.client===value)s.client=s.clients[0]||'All clients';$('dialog').close();render();return}if(kind==='remove-folder'){s.folders.splice(Number(value),1);s.dirty=true;render();return}
switch(kind){case 'ready':s.scenario='ready';break;case 'pause':s.fetching=false;break;case 'plan-now':s.fetching=false;s.page='plan';break;case 'select-all':s.selected=[0,1,2];break;case 'select-none':s.selected=[];break;case 'collapse':s.expanded=[];break;case 'zen-settings':s.area='settings';s.page='settings';s.section='zen';break;case 'queue':s.queued=true;s.notice=tr('Selected downloads added to the queue.','Téléchargements sélectionnés ajoutés à la file.');break;case 'send-review':modal(tr('Send selected Plan','Envoyer le Plan sélectionné'),`<p>${s.selected.length} ${tr('torrents to','torrents vers')} ${esc(s.client)}</p>${check('refresh-first',tr('Refresh first','Actualiser avant'),true)}<p>${tr('Check the current client state before sending. A missing category folder is requested next.','Vérifiez l’état actuel du client avant l’envoi. Le dossier d’une catégorie manquante sera demandé ensuite.')}</p>`,[[tr('Continue','Continuer'),'destination','primary']]);return;case 'destination':$('dialog').close();modal(tr('Choose Download Folder','Choisir le dossier de téléchargement'),`<p>Films</p>${field('destination',tr('Destination','Destination'),'/downloads/films')}${b(tr('Browse','Parcourir'),'browse')}<p>${s.host==='desktop'?tr('Browse opens the native folder picker.','Parcourir ouvre le sélecteur natif de dossiers.'):tr('Browse shows server folders within configured roots.','Parcourir affiche les dossiers du serveur dans les racines configurées.')}</p>`,[[tr('Send','Envoyer'),'start-send','primary']]);return;case 'start-send':$('dialog').close();s.sending=true;s.sent=0;break;case 'stop-send':s.sending=false;s.notice=tr('Sending stopped. Completed sends are retained.','Envoi arrêté. Les envois terminés sont conservés.');break;case 'sent':s.sent=Math.min(s.sent+1,s.selected.length);if(s.sent===s.selected.length){s.sending=false;s.notice=tr('Plan sent.','Plan envoyé.')}break;case 'save':s.savedFields={...s.fields};s.dirty=false;s.notice=tr('Settings saved in this fixture.','Paramètres enregistrés dans cette simulation.');break;case 'cancel':s.fields={...s.savedFields};s.dirty=false;break;case 'test':s.notice=tr('Fixture connection succeeded. No network request was made.','Connexion simulée réussie. Aucune requête réseau.');break;case 'models':s.notice='fixture-model · fixture-model-small';break;case 'add-client':s.clients.push('Fixture '+(s.clients.length+1));s.dirty=true;break;case 'add-folder':s.folders.push('/library/new');s.dirty=true;break;case 'import-folders':s.folders.push('/downloads/imported');s.dirty=true;break;case 'browse':s.notice=s.host==='desktop'?tr('Native folder picker simulated: /downloads/films','Sélecteur natif simulé : /downloads/films'):tr('Server folder browser simulated: /downloads/films','Navigateur de dossiers serveur simulé : /downloads/films');if($('dialog').open)$('dialog').querySelector('.stack').insertAdjacentHTML('beforeend',`<p>${s.notice}</p>`);break;case 'pair':modal(tr('Pair browser companion','Associer l’extension'),`<p>${tr('One-time fixture code','Code simulé à usage unique')} · 123 456</p><p>${tr('Confirm in the browser extension.','Confirmez dans l’extension du navigateur.')}</p>`,[[tr('Simulate paired','Simuler l’association'),'paired','primary']]);return;case 'paired':$('dialog').close();s.notice=tr('Browser paired.','Navigateur associé.');break;case 'token':modal(tr('New agent token','Nouveau jeton agent'),`<p>${tr('Shown once. Read-only access.','Affiché une seule fois. Accès en lecture seule.')}</p><code>fixture-not-a-real-token</code>`,[[tr('Done','Terminé'),'close','primary']]);return;case 'revoke':modal(tr('Revoke access?','Révoquer l’accès ?'),`<p>${tr('This connection will need to be paired again.','Cette connexion devra être associée à nouveau.')}</p>`,[[tr('Revoke','Révoquer'),'revoked','primary']]);return;case 'revoked':$('dialog').close();s.notice=tr('Access revoked.','Accès révoqué.');break;case 'proposal':modal(tr('Review proposal','Vérifier la proposition'),`<p>${tr('Add one simulated torrent to Studio. No deletion or file changes.','Ajouter un torrent simulé à Studio. Aucune suppression ni modification de fichier.')}</p>`,[[tr('Reject','Refuser'),'close',''],[tr('Approve once','Approuver une fois'),'approved','primary']]);return;case 'approved':$('dialog').close();s.notice=tr('Fixture proposal approved.','Proposition simulée approuvée.');break;case 'speed':s.notice=s.host==='desktop'?tr('Speed is measured on this desktop. Fixture: 80 Mbit/s.','Le débit est mesuré sur ce bureau. Simulation : 80 Mbit/s.'):tr('Speed is measured on the server. Fixture: 80 Mbit/s.','Le débit est mesuré sur le serveur. Simulation : 80 Mbit/s.');break;case 'diagnostics':s.notice=tr('Diagnostics preview, no upload.','Aperçu des diagnostics, aucun envoi.');break;case 'dismiss':s.update=false;break;case 'release':modal(tr('Release notes','Notes de version'),`<p>${tr('Update notices describe the host installation. Web owners update the server; desktop owners install the package.','Les notifications décrivent l’installation de l’hôte. Le propriétaire Web met à jour le serveur ; sur bureau, il installe le paquet.')}</p>`,[[tr('Done','Terminé'),'close','primary']]);return;case 'shortcuts':modal(tr('Keyboard shortcuts','Raccourcis clavier'),`<p>${s.host==='desktop'?'Ctrl+1…8 · '+tr('Navigate','Naviguer')+'<br>Ctrl+, · '+names().settings+'<br>Ctrl+F · '+tr('Focus page search','Rechercher dans la page'):tr('Browser shortcuts remain with the browser. Use the navigation and search controls, or Tab and Enter.','Les raccourcis du navigateur restent au navigateur. Utilisez la navigation et la recherche, ou Tab et Entrée.')}</p>`,[[tr('Done','Terminé'),'close','primary']]);return;case 'activity':modal(tr('Activity','Activité'),`<p>${tr('No running jobs.','Aucune tâche en cours.')}</p>`,[[tr('Done','Terminé'),'close','primary']]);return;case 'signout':s.notice=tr('Sign-out preview. The fixture stays open.','Aperçu de la déconnexion. La simulation reste ouverte.');break;case 'back':if(s.historyAt>0)s.guide=s.history[--s.historyAt];break;case 'forward':if(s.historyAt<s.history.length-1)s.guide=s.history[++s.historyAt];break;case 'close':$('dialog').close();return;case 'clear':s.notice='';break}render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)action(el.dataset.action)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.field){s.fields[el.dataset.field]=el.type==='checkbox'?el.checked:el.value;s.dirty=true;note();return}if(el.dataset.selection){const i=Number(el.dataset.selection);s.selected=el.checked?[...s.selected,i]:s.selected.filter(x=>x!==i);render();return}if(['area','host','language','theme','scenario','size'].includes(el.id)){s[el.id]=el.value;if(el.id==='area'){s.page=el.value==='zen'?'catalogue':el.value==='settings'?'settings':'docs';history.replaceState(null,'','?area='+s.area)}render()}if(el.id==='navigation')action('page:'+el.value);if(el.id==='client'){s.client=el.value===tr('All clients','Tous les clients')?'All clients':el.value;render()}if(el.id==='guide-language'){s.guideLanguage=el.value;render()}if(el.id==='plan-sort'||el.id==='seed-sort'){s.notice=tr('Sort order changed in this fixture.','Ordre de tri modifié dans cette simulation.');s[el.id==='plan-sort'?'planSort':'seedSort']=el.selectedIndex;render()}});
document.addEventListener('input',e=>{if(e.target.id==='guide-filter'){const pos=e.target.selectionStart;s.guideFilter=e.target.value;render();$('guide-filter').focus();$('guide-filter').setSelectionRange(pos,pos)}else if(e.target.dataset.field){s.fields[e.target.dataset.field]=e.target.value;s.dirty=true;note()}});
$('reset').onclick=()=>{s=JSON.parse(copy);render()};
if(s.area==='settings')s.page='settings';if(s.area==='shell')s.page='docs';render();
</script></html>

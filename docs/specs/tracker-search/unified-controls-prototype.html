.tl-toasts {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 1000;

  gap: 8px;
  max-width: min(420px, calc(100vw - 32px));

  overflow: visible;
}

  display: flex;

        checked: node.checked,
        selected: node.multiple
          ? [...node.selectedOptions].map((o) => o.value)
          : null,
        start: node.selectionStart,
        end: node.selectionEnd,
        click: node.onclick,

            );

            if (saved.start != null)
              node.setSelectionRange(saved.start, saved.end);
          }
        },
      );

          if (french[sentence]) return prefix + french[sentence];

    node.className = `tl-toast ${failed ? "bad" : "ok"}`;
    node.setAttribute("role", failed ? "alert" : "status");
    const text = document.createElement("span");

      button.className = "tl-toast-close";

    if (Object.keys(body).filter((k) => k !== "_client").length)
      Object.assign(STUB.preferences, body);
    return STUB.preferences;
  }
  if (action === "job") {
    const id = ++jobId;
    const result =
      body.kind === "search-options" ? searchOptions(body.category) : searchResult(body);
    JOBS.set(id, { status: "completed", result });
    if (window.previewRequest) window.previewRequest(body);
    return { job: id };
  }
  if (action === "job-status") return JOBS.get(body.job) || { status: "failed", error: "gone" };
  if (action === "state")
    return { rows: [], search: [], score_profiles: ["HDLight 1080p", "Remux"], score_active: "HDLight 1080p", score_revision: 1 };
  if (action === "queue") return [];
  if (action === "navigate") return {};
  if (action === "detail") throw new Error("Le détail n’est pas dans l’aperçu.");
  return {};
}

window.TLPanel.connect = () =>
  Promise.resolve((action, body) => Promise.resolve(answer(action, body || {})));

    <script data-source="search/view.js">
"use strict";
const $ = (id) => document.getElementById(id);
let language = "en",
  env = {},
  generation = 0,
  activePage = "search";
const state = {
  searchSelected: new Set(),
  queueSelected: new Set(),
  queueRows: [],
};
const say = (en, fr) => (language === "fr" ? fr : en);
function element(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}
function button(text, callback, cls) {
  const node = element("button", text, cls);
  node.type = "button";
  node.onclick = () =>
    TLToast.busy(node, async () => {
      await callback();
    });
  return node;
}
const toast = (text) => TLToast.show(text, "ok");
// An action started by a button keeps that button busy until it ends.
async function guard(fn, node) {
  node ??= TLToast.trigger();
  if (node) return TLToast.press(node, fn);
  try {
    return await fn();
  } catch (e) {
    TLToast.error(e);
  }
}
async function request(action, body = {}) {
  const g = generation;
  const send = await window.searchTransport;
  const value = await send(action, { ...body, _client: env.client });
  if (g !== generation)
    throw Error(say("The target client changed.", "Le client cible a changé."));
  return value;
}
async function job(body, done) {
  const g = generation;
  const { job: id } = await request("job", body);
  for (;;) {
    const result = await request("job-status", { job: id });
    if (g !== generation) return;
    if (!["queued", "running"].includes(result.status)) {
      if (result.status !== "completed")
        throw Error(result.error || result.status);
      if (done) done(result.result);
      return result.result;
    }
    await new Promise((r) => setTimeout(r, 150));
  }
}
async function api() {
  const value = await request("state", {
    hashes: SS.rows.map((row) => row.hash),
  });
  refreshScoreProfiles(value);
  await refreshDetailScores(value);
  let changed = false;
  for (const fresh of value.search || []) {
    const row = SS.rows.find((row) => row.hash === fresh.hash);
    if (
      row &&
      (JSON.stringify(row.release_score) !==
        JSON.stringify(fresh.release_score) ||
        row.zen !== fresh.zen ||
        row.note !== fresh.note ||
        (SS.known[row.hash] || "") !== fresh.known)
    ) {
      row.release_score = fresh.release_score;
      row.zen = fresh.zen;
      row.note = fresh.note;
      SS.known[row.hash] = fresh.known;
      changed = true;
    }
  }
  if (changed) {
    const y = scrollY;
    renderResults();
    scrollTo(0, y);
  }
  return value.rows;
}
const details = (row) => openDetail(row);
async function navigate(page) {
  if (page === "details" && selectedDetail) {
    selectDetail(selectedDetail);
    return;
  }
  activePage = page;
  $("detail-pages").hidden = true;
  renderDetailTabs();
  $("results").hidden = page !== "search";
  $("queue").hidden = page !== "queue";
  hideHover();
  if (page === "queue") await loadQueue();
  else await loadSearchPage();
}
function translate() {
  document.documentElement.lang = language;
  document
    .querySelectorAll("[data-en]")
    .forEach((n) => (n.textContent = n.dataset[language] || n.dataset.en));
}
const bytes = (n) => {
  if (n === null || n === undefined) return "—";
  const units = ["B", "KiB", "MiB", "GiB", "TiB", "PiB"];
  let i = 0;
  while (n >= 1024 && i < 5) {
    n /= 1024;
    i++;
  }
  return `${n.toFixed(i ? 1 : 0)} ${units[i]}`;
};
const num = (n) => (n === null || n === undefined ? "—" : Number(n).toFixed(2));
function age(timestamp) {
  if (!timestamp) return "—";
  const seconds = Math.max(0, Date.now() / 1000 - timestamp);
  const [value, unit] =
    seconds < 3600
      ? [Math.floor(seconds / 60), say("minutes", "minutes")]
      : seconds < 86400
        ? [Math.floor(seconds / 3600), say("hours", "heures")]
        : [Math.floor(seconds / 86400), say("days", "jours")];
  return `${value} ${unit}`;
}
function table(
  target,
  rows,
  columns,
  selection,
  key = "hash",
  onChange,
  onRow,
) {
  const host = $(target);
  host.replaceChildren();
  if (!rows.length) {
    host.append(
      element(
        "p",
        say("Nothing to display yet.", "Aucun élément à afficher."),
        "empty",
      ),
    );
    return;
  }
  const t = element("table"),
    head = element("tr");
  if (selection) {
    const cell = element("th"),
      input = document.createElement("input");
    input.type = "checkbox";
    input.setAttribute(
      "aria-label",
      say("Select page", "Sélectionner la page"),
    );
    input.checked = rows.every((r) => selection.has(r[key]));
    input.onchange = () => {
      rows.forEach((r) =>
        input.checked ? selection.add(r[key]) : selection.delete(r[key]),
      );
      table(target, rows, columns, selection, key, onChange);
      if (onChange) onChange();
    };
    cell.append(input);
    head.append(cell);
  }
  for (const column of columns) {
    const cell = element("th");
    if (column.title) cell.title = column.title;
    cell.textContent = column.label;
    head.append(cell);
  }
  const thead = element("thead");
  thead.append(head);
  t.append(thead);
  const body = element("tbody");
  for (const row of rows) {
    const tr = element("tr");
    tr.dataset.key = row[key];
    if (onRow) {
      tr.onclick = (e) => {
        if (!e.target.closest("button, input, a")) onRow(row);
      };
      if (row[key] === state.current) tr.className = "current";
    }
    if (selection) {
      const cell = element("td"),
        input = document.createElement("input");
      input.type = "checkbox";
      input.checked = selection.has(row[key]);
      input.setAttribute("aria-label", row.name || row.title || row[key]);
      input.onchange = () => {
        input.checked ? selection.add(row[key]) : selection.delete(row[key]);
        if (onChange) onChange();
      };
      cell.append(input);
      tr.append(cell);
    }
    for (const column of columns) {
      const cell = element("td", undefined, column.name ? "name" : "");
      const value = column.render(row);
      if (value instanceof Node) cell.append(value);
      else cell.textContent = value ?? "—";
      if (column.name) cell.title = row.name || row.title;
      tr.append(cell);
    }
    body.append(tr);
  }
  t.append(body);
  host.append(t);
}

/* Search: category pills, filter row, sort chips, numbered pages and rich result rows.

};

const MERGED_SORTS = {

  seeders: "seeders",
  leechers: "leechers",

  name: "title",
};
const merged = () => SS.trackers.includes("tr4ker");
const FALLBACK_COLORS = [
  "#3b82f6",
  "#f59e0b",
  "#a855f7",
  "#6366f1",
  "#10b981",
  "#8b5cf6",

];
const TAG_KINDS = ["lang", "resolution", "source", "audio", "codec", "hdr"];
const VIDEO_LABELS = () => ({

  source: "Source",
  codec: "Codec",
  hdr: "HDR",
  audioType: "Audio",
  channels: say("Channels", "Canaux"),
  lang: say("Language", "Langue"),
  profile: say("Profile", "Profil"),
});
const PROFILE_LABELS = () => ({
  compatibility: say("Compatibility", "Compatibilité"),
  pure: say("Home Cinema Pure", "Home Cinéma Pure"),
  hc_optimized: say("Home Cinema Optimized", "Home Cinéma Optimisé"),

});
const SORTS = () => [
  ["createdAt", say("Age", "Âge")],

  ["size", say("Size", "Taille")],

let preferences = null,

function searchStore(key, value) {
  if (!preferences) return null;

  if (preferences[key] === value) return;

const searchRoot = (id) => {
  let node = String(id || "");
  const seen = new Set();
  while (
    node &&
    SS.categories[node] &&
    SS.categories[node].parent != null &&

/* The page numbers to link: the ends, the neighbours of the current page, and the first or
   last three near an end. A single hidden page is shown rather than an ellipsis. */
function pageNumbers(current, total) {
  if (total < 1) return [];
  current = Math.min(Math.max(1, current), total);
  const wanted = new Set([1, total, current - 1, current, current + 1]);
  if (current <= 3) [1, 2, 3].forEach((n) => wanted.add(n));
  if (current >= total - 2)
    [total - 2, total - 1, total].forEach((n) => wanted.add(n));
  const pages = [...wanted]
    .filter((n) => n >= 1 && n <= total)
    .sort((a, b) => a - b);
  const result = [];
  for (const n of pages) {
    const last = result[result.length - 1];
    if (last !== undefined && last !== null) {
      if (n - last === 2) result.push(last + 1);
      else if (n - last > 2) result.push(null);

  $("search-palliative").title = states[index][1];
  $("search-palliative").setAttribute("aria-pressed", String(index > 0));
}

/* ---- pills, sort, pages ---------------------------------------------------------- */
function renderTrackers() {
  const host = $("search-trackers");
  host.hidden = !SS.available.includes("tr4ker");
  host.replaceChildren(
    host.querySelector(".label"),
    ...Object.keys(TRACKER_COLORS).map((name) => {
      const b = chipButton(
        "",
        SS.trackers.includes(name),
        () => {
          const on = SS.trackers.includes(name);
          if (on && SS.trackers.length === 1) return; // at least one Tracker stays on
          SS.trackers = Object.keys(TRACKER_COLORS).filter((t) =>
            t === name ? !on : SS.trackers.includes(t),
          );
          if (merged() && !(SS.sort.key in MERGED_SORTS))
            SS.sort = { key: "createdAt", order: "desc" };
          renderTrackers();
          renderSort();
          return runSearch(1);
        },
        "chip",
      );
      b.style.setProperty("--tag", TRACKER_COLORS[name]);
      b.dataset.tracker = name;
      b.append(element("span", undefined, "dot"), name);
      return b;
    }),
  );
}

// What the tr4ker side of the last search says: its fallback, its own sort and its failure.
function renderTrackerNotes() {
  const info = SS.tr4ker || {};
  const note = $("search-backend-note");
  const names = Object.fromEntries(
    SORTS().map(([key, label]) => [key, label]),
  );
  if (!merged() || info.error) note.hidden = true;
  else if (info.backend === "torznab") {
    note.hidden = false;
    note.textContent = say(
      "The tr4ker companion is not paired: tr4ker rows come from Torznab (no leechers or completions). Pair it in Settings > Connection for native results.",
      "Le compagnon tr4ker n'est pas associé : les lignes tr4ker viennent de Torznab (sans leechers ni complétés). Associez-le dans Réglages > Connexion pour les résultats natifs.",
    );
  } else if (info.notes?.length) {
    note.hidden = false;
    note.textContent = say(
      `tr4ker cannot sort by ${names[SS.sort.key]} itself: its rows are sorted here, within the page it returned.`,
      "tr4ker ne sait pas trier par ce critère : ses lignes sont triées ici, dans la page reçue.",
    );
  } else note.hidden = true;
  const error = $("search-error-note");
  error.hidden = !(merged() && info.error);
  error.textContent = info.error
    ? say(`tr4ker did not answer: ${info.error}`, `tr4ker n'a pas répondu : ${info.error}`)
    : "";
  $("search-unavailable").textContent = merged()
    ? say(
        "Not on tr4ker: Zen, trust votes, release team.",
        "Absent sur tr4ker : Zen, votes de confiance, équipe.",
      )
    : "";
}

/* Where a control bites on each Tracker: ● its whole catalogue, ◐ only the page fetched,
   ○ not at all. Without it the pills showed c411's count as if it covered both. */
const SCOPE_MARKS = { server: "●", page: "◐", none: "○" };
const SCOPE_WORDS = () => ({
  server: say("filters the whole tracker", "filtre tout le tracker"),
  page: say(
    "no equivalent: these rows are filtered here, within the page fetched",
    "sans équivalent : ces lignes sont filtrées ici, dans la page reçue",
  ),
  none: say(
    "this tracker has no such category",
    "ce tracker n’a pas cette catégorie",
  ),
});
function scopeMark(scopes) {
  const host = element("span", undefined, "scope-mark");
  const words = SCOPE_WORDS();
  const lines = [];
  for (const [name, scope] of Object.entries(scopes)) {
    const dot = element("span", SCOPE_MARKS[scope], `scope-dot scope-${scope}`);
    dot.dataset.tracker = name;
    host.append(dot);
    lines.push(`${name} ${SCOPE_MARKS[scope]} ${words[scope]}`);
  }
  host.title = lines.join("\n");
  host.setAttribute("aria-label", lines.join(". "));
  return host;
}

function renderPills() {
  const roots = searchRoots();
  const host = $("search-pills");
  host.hidden = !roots.length;
  const counts = SS.rootCounts;
  const shown = Object.keys(counts).length;
  const total = roots.reduce((n, [id]) => n + (counts[id] || 0), 0);
  const current = searchRoot(SS.category);
  const pill = (id, name, count, color) => {
    const b = chipButton(
      "",
      id === current,
      () => pickCategory(id),
      "chip pill",
    );
    const dot = element("span", undefined, "dot");
    dot.style.background = color;
    b.append(dot, element("span", name));
    if (shown) {
      // c411 publishes a count per category; tr4ker's own listing total is capped and has no
      // per-category figure, so the number is c411's alone and says so.
      const value = element("span", searchNumber(count), "pill-count");
      if (merged()) {
        value.classList.add("c411-count");
        value.title = say(
          "c411 only: tr4ker publishes no count per category.",
          "c411 seulement : tr4ker ne publie pas de total par catégorie.",
        );
      }
      b.append(value);
    }
    if (merged())
      b.append(
        scopeMark({
          c411: "server",
          tr4ker: id === "" ? "server" : (SS.tr4kerScopes[id] ?? "page"),
        }),
      );
    return b;
  };
  host.replaceChildren(
    pill("", say("All", "Tout"), total, "#3b82f6"),
    ...roots.map(([id, c], i) =>
      pill(id, c.name, counts[id] || 0, searchColor(id, i + 1)),
    ),
  );
}

// Nothing to subscribe to without a query, nothing to clear while the filters are untouched.
function renderActions() {
  $("subscribe-search").disabled = !searchQuery();
  $("search-clear").disabled = !(
    SS.chosen.size ||
    Object.values(SS.inputs).some(Boolean) ||
    SS.exclusive ||
    SS.palliative ||
    SS.crew ||
    SS.category ||
    SS.sort.key !== "createdAt" ||
    SS.sort.order !== "desc"
  );
}

function renderSort() {
  const host = $("search-sort");
  host.hidden = !(SS.native || merged());
  host.closest(".results-sort").hidden = !(SS.native || merged());
  renderActions();
  host.replaceChildren(
    ...SORTS()
      .filter(([key]) => !merged() || key in MERGED_SORTS)
      .filter(([key]) => key !== "relevance" || searchQuery())
      .map(([key, label]) => {
        const active = SS.sort.key === key;
        return chipButton(
          label + (active ? (SS.sort.order === "desc" ? " ↓" : " ↑") : ""),
          active,
          () => {
            if (active)
              SS.sort.order = SS.sort.order === "desc" ? "asc" : "desc";
            else SS.sort = { key, order: key === "name" ? "asc" : "desc" };
            renderSort();
            if (SS.searched) return runSearch(1);
          },
          "chip sort",
        );
      }),
  );
}

function renderPages() {
  for (const id of ["search-pages-top", "search-pages-bottom"]) {
    const host = $(id);
    host.hidden = !SS.rows.length && SS.page <= 1;
    const go = (n) => () => runSearch(n);
    const parts = [];
    if (SS.page > 1)
      parts.push(
        button(say("← Previous", "← Précédent"), go(SS.page - 1), "chip page"),
      );
    for (const n of pageNumbers(SS.page, SS.pages)) {
      if (n === null) parts.push(element("span", "…", "muted"));
      else {
        const b = chipButton(String(n), n === SS.page, go(n), "chip page");
        b.setAttribute("aria-label", say(`Page ${n}`, `Page ${n}`));
        if (n === SS.page) b.setAttribute("aria-current", "page");
        parts.push(b);
      }
    }
    if (SS.page < SS.pages)
      parts.push(
        button(say("Next →", "Suivant →"), go(SS.page + 1), "chip page"),
      );
    if (SS.page < SS.pages - 1)
      parts.push(
        button(say("Last »", "Dernière »"), go(SS.pages), "chip page"),
      );
    host.replaceChildren(...parts);
  }
}

/* ---- rows ------------------------------------------------------------------------ */
function rootColorByName(label) {
  const first = (label || "").split(" / ")[0];
  const roots = searchRoots();
  const index = roots.findIndex(([, c]) => c.name === first);
  return index < 0 ? "#64748b" : searchColor(roots[index][0], index + 1);
}
function markChip(hash) {
  const kind = SS.known[hash];
  if (!kind) return null;
  return element(
    "span",
    "● " +
      (kind === "client"
        ? say("In client", "Dans le client")
        : say("Queued", "En file")),

}
function downloadButton(row) {

function cover(row, info) {

function trackerBadge(row) {

function richRow(row) {

  if (info) {
    when.append(
      element(
        "span",
        say(`${info.completions} compl.`, `${info.completions} compl.`),

      element("small", say("No Zen on tr4ker", "Pas de Zen sur tr4ker"), "muted"),

  el.append(
    check,
    cover(row, info),
    main,
    stats,
    when,
    zen,
    downloadButton(row),

  return el;

function renderResults() {
  const host = $("search-table");
  host.classList.toggle("compact", SS.density === "compact");
  if (!SS.rows.length) {
    host.replaceChildren(
      element(
        "p",
        SS.searched
          ? say(
              "No torrent matches. Try fewer filters, or another spelling of the title.",
              "Aucun torrent ne correspond. Essayez moins de filtres, ou une autre orthographe du titre.",
            )
          : say(
              "Search for torrents, then select the ones to download.",
              "Cherchez des torrents, puis sélectionnez ceux à télécharger.",
            ),
        "empty",
      ),
    );
  } else if (SS.density === "compact") {
    table(
      "search-table",
      SS.rows,
      compactColumns(),
      state.searchSelected,
      "hash",
      syncSelection,
    );
    // A header sorts the whole search, as on c411, instead of only this page.
    const heads = [...$("search-table").querySelectorAll("thead th")].slice(1);
    compactColumns().forEach((column, index) => {
      const key = COMPACT_SORTS[column.sortKey];
      if (!key || !SS.native) return;
      const active = SS.sort.key === key;
      const b = button(
        column.label + (active ? (SS.sort.order === "desc" ? " ↓" : " ↑") : ""),
        () => {
          if (active) SS.sort.order = SS.sort.order === "desc" ? "asc" : "desc";
          else SS.sort = { key, order: key === "name" ? "asc" : "desc" };
          renderSort();
          return runSearch(1);
        },
        "quiet header-sort",
      );
      heads[index].replaceChildren(b);
    });
  } else {
    host.replaceChildren(...SS.rows.map(richRow));
  }
  renderPages();
  syncSelection();

function syncSelection() {
  const count = state.searchSelected.size;
  $("search-selection").hidden = !count;
  $("search-selected-count").textContent = say(
    `${count} selected`,
    `${count} sélectionné(s)`,
  );
  $("search-details").hidden = !count;
}

/* ---- the search itself ---------------------------------------------------------- */
function searchFilters() {
  const filters = {};
  if (!SS.native) return filters;
  const options = [];
  for (const def of SS.facetDefs) {
    const values = [...(SS.chosen.get(def.key) || [])];
    if (!values.length) continue;
    if (def.kind === "option") options.push(...values);
    else filters[def.param] = values.join(",");
  }
  if (options.length) filters.options = options.join(",");
  for (const key of ["year", "team", "uploader"])
    if (SS.inputs[key]) filters[key] = SS.inputs[key];
  if (SS.exclusive) filters.exclusive = "true";
  if (SS.palliative) filters.palliative = SS.palliative;
  if (SS.crew && searchRoot(SS.category) === "1" && searchQuery())
    filters.crew = "true";
  filters.sortBy =
    SS.sort.key === "relevance" && !searchQuery() ? "createdAt" : SS.sort.key;
  filters.sortOrder = SS.sort.order;
  return filters;
}

function yearAcceptable() {
  return (
    !SS.inputs.year ||
    (/^\d{4}$/.test(SS.inputs.year) &&
      +SS.inputs.year >= 1900 &&
      +SS.inputs.year <= 2100)
  );
}

function runSearch(page = 1) {
  if (!yearAcceptable())
    throw Error(
      say(
        "Enter a year between 1900 and 2100.",
        "Saisissez une année entre 1900 et 2100.",
      ),
    );
  $("search-status").textContent = say("Searching…", "Recherche…");
  return job(
    {
      kind: "search",
      query: $("search-query").value,
      page,
      category: Number(SS.category) || null,
      filters: searchFilters(),
      search_listing: true,
      trackers: SS.trackers,
      merged_sort: MERGED_SORTS[SS.sort.key] || "recent",
    },
    (r) => {
      SS.searched = true;
      SS.tr4ker = r.tr4ker || {};
      SS.page = r.page;
      SS.pages = Math.max(1, r.pages);
      SS.total = r.total;
      SS.totalSize = r.total_size;
      SS.rows = r.rows;
      SS.listing = r.listing || {};
      SS.known = r.known || {};
      if (r.root_counts && Object.keys(r.root_counts).length)
        SS.rootCounts = r.root_counts;
      SS.palliativeCount = r.palliative_count ?? SS.palliativeCount;
      state.searchSelected.clear();
      let summary =
        r.total === null || r.total === undefined
          ? ""
          : say(
              `${searchNumber(r.total)} torrents`,
              `${searchNumber(r.total)} torrents`,
            );
      if (SS.totalSize) summary += (summary ? " · " : "") + bytes(SS.totalSize);
      if (merged()) {
        const kept = (t) => SS.rows.filter((x) => x.tracker === t).length;
        summary =
          say(`${SS.rows.length} results`, `${SS.rows.length} résultats`) +
          Object.keys(TRACKER_COLORS)
            .filter((t) => SS.trackers.includes(t))
            .map((t) => ` · ${t} ${kept(t)}`)
            .join("");
        // tr4ker could not narrow this category itself, so say how many of the rows it did
        // return were kept here rather than let the figure look like a whole-tracker count.
        const info = SS.tr4ker || {};
        if (info.category_scope === "page" && info.fetched > kept("tr4ker"))
          summary += say(
            ` of ${info.fetched} fetched`,
            ` sur ${info.fetched} reçus`,
          );
      }
      $("search-summary").textContent = summary;
      $("search-status").textContent = r.window_limited
        ? say(
            `c411 limits this search to ${r.per_page * r.pages} accessible results. Narrow your filters.`,
            `c411 limite cette recherche à ${r.per_page * r.pages} résultats accessibles. Affinez vos filtres.`,
          )
        : "";
      renderPills();
      syncToggles();
      renderSort();
      renderTrackerNotes();
      renderResults();
      refreshQueueCount();
    },
  );

"use strict";
/* The proposal, wrapped around the real Search panel (issue: unified Tracker controls).

   Nothing in src/ is changed here. The real renderers run first and this file adds what the
   change would add, so the preview shows the application's own screen with the proposal on
   top of it — the bar at the top switches it off to compare against today.

   The idea: every control says where it bites. A Tracker gets one of three marks.

     ● server  the Tracker filters its whole catalogue, as c411 does today
     ◐ page    the Tracker cannot filter it, so TorrentLinker filters the rows it fetched
     ○ none    the Tracker has no equivalent; its rows are not narrowed at all

   Today every control is silently ● for c411 and ○ for tr4ker, which is why a search looks
   filtered while half the rows are not. Verified tr4ker native parameters are q, cat,
   tmdb_id, freeleech and sort=recent|completed (docs/research/tr4ker-integration.md). */

let proposal = true;

/* ---- what each Tracker does with each control ------------------------------------ */
// TR4KER_ROOTS and TR4KER_CHILDREN come from the stub, with the rest of the tracker data.
const SCOPES = {
  "v:resolution": "page",
  "v:source": "page",
  "v:codec": "page",
  "v:hdr": "page",
  "v:audioType": "page",
  "v:channels": "page",
  "v:lang": "page",
  "v:profile": "none",
  "o:genre": "none",
  "o:type": "none",
  "o:saison": "none",
  "o:episode": "none",
  year: "page",
  team: "none",
  uploader: "none",
};

const MARKS = { server: "●", page: "◐", none: "○" };
const SCOPE_TEXT = {
  server: [
    "filters the whole tracker",
    "filtre tout le tracker",
  ],
  page: [
    "no equivalent on this tracker: its rows are filtered here, within the page fetched",
    "sans équivalent sur ce tracker : ses lignes sont filtrées ici, dans la page reçue",
  ],
  none: [
    "this tracker has no equivalent: its rows are not narrowed",
    "ce tracker n’a pas d’équivalent : ses lignes ne sont pas restreintes",
  ],
};

/* The two dots a control carries. `c411` is the scope on c411, `tr4ker` on tr4ker. */
function scopeMark(scopes) {
  const span = element("span", undefined, "scope-mark");
  const parts = [];
  for (const [name, scope] of Object.entries(scopes)) {
    const dot = element("span", MARKS[scope], `scope-dot scope-${scope}`);
    dot.dataset.tracker = name;
    span.append(dot);
    parts.push(`${name} ${MARKS[scope]} ${say(...SCOPE_TEXT[scope])}`);
  }
  span.title = parts.join("\n");
  span.setAttribute("aria-label", parts.join(". "));
  return span;
}

// tr4ker's scope for the category currently chosen, and why.
function categoryScope(id) {
  const key = String(id || "");
  if (!key) return { scope: "server", slug: "", why: ["every category", "toutes les catégories"] };
  if (TR4KER_CHILDREN[key])
    return { scope: "server", slug: TR4KER_CHILDREN[key], why: [`cat=${TR4KER_CHILDREN[key]}`, `cat=${TR4KER_CHILDREN[key]}`] };
  const slugs = TR4KER_ROOTS[key] || [];
  if (!slugs.length)
    return { scope: "none", slug: "", why: ["tr4ker has no such category", "tr4ker n’a pas cette catégorie"] };
  if (slugs.length === 1)
    return { scope: "server", slug: slugs[0], why: [`cat=${slugs[0]}`, `cat=${slugs[0]}`] };
  return {
    scope: "page",
    slug: "",
    why: [
      `tr4ker splits this root into ${slugs.join(" + ")}: its rows are kept here`,
      `tr4ker découpe cette racine en ${slugs.join(" + ")} : ses lignes sont retenues ici`,
    ],
  };
}

/* ---- the page-scope filter: what tr4ker's rows are narrowed by here --------------
   `derived`, `derivedYear` and `derivedTags` come from the stub: they stand in for the
   ReleaseScore estimator the server already runs on every release name. */
function pageFilters() {
  const active = [];
  for (const def of SS.facetDefs) {
    const values = [...(SS.chosen.get(def.key) || [])];
    if (values.length && SCOPES[def.key] === "page")
      active.push({ key: def.key, param: def.param, values, label: def.label });
  }
  if (SS.inputs.year && SCOPES.year === "page")
    active.push({ key: "year", param: "year", values: [SS.inputs.year], label: say("Year", "Année") });
  return active;
}

function keepsRow(row) {
  if (row.tracker !== "tr4ker") return true;
  const scope = categoryScope(SS.category);
  if (SS.category && scope.scope === "none") return false;
  // The root tr4ker could not be sent as one `cat=`: its rows are kept here instead.
  if (SS.category && scope.scope === "page")
    if (!(TR4KER_ROOTS[String(SS.category)] || []).includes(row.cat_slug)) return false;
  const facts = derived(row.title);
  for (const filter of pageFilters()) {
    if (filter.param === "year") {
      if (derivedYear(row.title) !== Number(filter.values[0])) return false;
    } else if (!filter.values.includes(facts[filter.param])) return false;
  }
  return true;
}

/* ---- the legend under the Tracker chips ------------------------------------------ */
function renderLegend() {
  let host = $("scope-legend");
  if (!host) {
    host = element("p", undefined, "scope-legend");
    host.id = "scope-legend";
    $("search-trackers").after(host);
  }
  host.hidden = !(proposal && SS.trackers.includes("tr4ker"));
  if (host.hidden) return;
  host.replaceChildren(
    element("span", say("Each control says where it applies:", "Chaque contrôle indique où il s’applique :"), "muted"),
    element("span", `${MARKS.server} ${say("the whole tracker", "tout le tracker")}`, "scope-key scope-server"),
    element("span", `${MARKS.page} ${say("the page fetched", "la page reçue")}`, "scope-key scope-page"),
    element("span", `${MARKS.none} ${say("not applied", "non appliqué")}`, "scope-key scope-none"),
  );
}

/* ---- the controls, wrapped ------------------------------------------------------- */
const basePills = renderPills;
renderPills = function () {
  basePills();
  renderLegend();
  if (!proposal || !SS.trackers.includes("tr4ker")) return;
  const roots = searchRoots();
  const pills = [...$("search-pills").children];
  // The first pill is "All"; the rest follow searchRoots() in order.
  pills.forEach((pill, index) => {
    if (!index) {
      pill.append(scopeMark({ c411: "server", tr4ker: "server" }));
      return;
    }
    const id = roots[index - 1]?.[0];
    const scope = categoryScope(id);
    const mark = scopeMark({ c411: "server", tr4ker: scope.scope });
    mark.title += `\ntr4ker: ${say(...scope.why)}`;
    // tr4ker publishes no per-category total (its listing total is capped), so the number
    // on the pill is c411's alone and now says so.
    const count = pill.querySelector(".pill-count");
    if (count) count.title = say("c411 only: tr4ker publishes no category total.", "c411 seulement : tr4ker ne publie pas de total par catégorie.");
    if (count) count.classList.add("c411-count");
    pill.append(mark);
  });
};

const baseFacets = renderFacets;
renderFacets = function () {
  baseFacets();
  if (!proposal) return;
  const host = $("search-facets");
  const defs = [...SS.facetDefs.map((d) => d.key), "year", "team", "uploader"];
  [...host.querySelectorAll(".fdrop")].forEach((drop, index) => {
    const key = defs[index];
    const scope = SCOPES[key] || "none";
    if (!SS.trackers.includes("tr4ker")) return;
    const summary = drop.querySelector("summary");
    const mark = scopeMark({ c411: "server", tr4ker: scope });
    // setLabel rewrites the summary's text when a choice is made, so the mark is put back.
    const baseSetLabel = drop.setLabel;
    drop.setLabel = (count, text = "") => {
      baseSetLabel(count, text);
      summary.append(mark);
    };
    summary.append(mark);
  });
};

const baseToggles = syncToggles;
syncToggles = function () {
  baseToggles();
  if (!proposal) return;
  // Freeleech is the one control tr4ker answers natively and c411 has no equivalent for.
  let free = $("search-freeleech");
  if (!free) {
    free = chipButton("", false, () => {
      SS.freeleech = !SS.freeleech;
      criteriaChanged();
    }, "chip");
    free.id = "search-freeleech";
    $("search-palliative").after(free);
  }
  free.hidden = !SS.trackers.includes("tr4ker");
  free.setAttribute("aria-pressed", String(!!SS.freeleech));
  free.replaceChildren(
    document.createTextNode("⚡ Freeleech"),
    ...(SS.trackers.includes("tr4ker") ? [scopeMark({ c411: "none", tr4ker: "server" })] : []),
  );
  if (!SS.trackers.includes("tr4ker")) return;
  for (const [id, scope] of [["search-exclusive", "none"], ["search-palliative", "none"], ["search-crew", "none"]]) {
    const node = $(id);
    if (node.hidden || node.querySelector(".scope-mark")) continue;
    node.append(scopeMark({ c411: "server", tr4ker: scope }));
  }
};

// The blanket "Absent sur tr4ker" sentence is replaced by the marks on the controls.
const baseNotes = renderTrackerNotes;
renderTrackerNotes = function () {
  baseNotes();
  if (proposal) $("search-unavailable").textContent = "";
};

/* ---- the rows -------------------------------------------------------------------- */
const baseRichRow = richRow;
richRow = function (row) {
  const node = baseRichRow(row);
  if (!proposal || row.tracker !== "tr4ker") return node;
  const tags = node.querySelector(".sr-main > .sr-line:last-child");
  const found = derivedTags(row.title);
  if (tags && found.length) {
    for (const [kind, text] of found) {
      const tag = element("span", text, `tag tag-${kind} tag-derived`);
      tag.title = say(
        "Read from the release name: tr4ker publishes no listing facts.",
        "Lu dans le nom de release : tr4ker ne publie pas les faits de listing.",
      );
      tags.append(tag);
    }
  }
  return node;
};

const baseResults = renderResults;
renderResults = function () {
  if (!proposal) return baseResults();
  const all = SS.rows;
  const kept = all.filter(keepsRow);
  SS.rows = kept;
  try {
    baseResults();
  } finally {
    SS.rows = all;
  }
  const dropped = all.length - kept.length;
  const summary = $("search-summary");
  if (dropped && SS.trackers.includes("tr4ker")) {
    const fetched = all.filter((r) => r.tracker === "tr4ker").length;
    summary.textContent =
      `${kept.length} ${say("results", "résultats")}` +
      ` · c411 ${kept.filter((r) => r.tracker === "c411").length}` +
      ` · tr4ker ${kept.filter((r) => r.tracker === "tr4ker").length}` +
      say(
        ` of ${fetched} fetched`,
        ` sur ${fetched} reçus`,
      );
    summary.title = say(
      "tr4ker cannot filter on these criteria, so its rows are narrowed here, within the page it returned.",
      "tr4ker ne sait pas filtrer sur ces critères : ses lignes sont restreintes ici, dans la page reçue.",
    );
  }
};

/* ---- the preview bar -------------------------------------------------------------- */
window.previewRequest = (body) => {
  if (body.kind !== "search") return;
  const scope = categoryScope(body.category);
  const sent = [`q=${body.query || "∅"}`];
  if (body.category) sent.push(`category=${body.category}`);
  const t4k = [`q=${body.query || "∅"}`];
  if (body.category && scope.slug) t4k.push(`cat=${scope.slug}`);
  if (SS.freeleech) t4k.push("freeleech=1");
  const page = pageFilters();
  $("demo-hint").textContent = proposal
    ? `c411 ← ${sent.concat(Object.keys(body.filters || {}).filter((k) => !["sortBy", "sortOrder"].includes(k)).map((k) => `${k}=${body.filters[k]}`)).join(" ")}   ·   tr4ker ← ${t4k.join(" ")}` +
      (page.length ? `   ·   ${say("here", "ici")}: ${page.map((f) => f.label).join(", ")}` : "")
    : "";
};

$("demo-theme").onclick = () => {
  const light = document.documentElement.dataset.theme !== "light";
  document.documentElement.dataset.theme = light ? "light" : "dark";
  $("demo-theme").textContent = light ? "Thème : clair" : "Thème : sombre";
};
$("demo-lang").onclick = () => {
  language = language === "fr" ? "en" : "fr";
  $("demo-lang").textContent = language.toUpperCase();
  translate();
  searchRetranslate();
  renderPills();
  renderFacets();
  renderChosen();
  syncToggles();
  renderSort();
  renderResults();
};
$("demo-proposal").onclick = () => {
  proposal = !proposal;
  $("demo-proposal").setAttribute("aria-pressed", String(proposal));
  $("demo-proposal").textContent = proposal ? "Proposition : activée" : "Proposition : désactivée";
  document.body.classList.toggle("no-proposal", !proposal);
  document.querySelectorAll(".scope-mark").forEach((n) => n.remove());
  renderPills();
  renderFacets();
  syncToggles();
  renderTrackerNotes();
  renderResults();
};

// Films & Vidéos from the start: it is the root that carries every control, and the one
// where c411 and tr4ker disagree most (tr4ker splits it into films and series).
SS.category = "1";

// Boot the panel the way the shell does.
window.dispatchEvent(
  new CustomEvent("search-environment", {
    detail: {
      client: "preview",
      language: "fr",
      theme: "dark",
      page: "search",
      active: true,
      adult: false,
      indexer: "https://c411.org",
      readonly: false,
      mode: "web",
    },
  }),
);

    </script>
  </body>

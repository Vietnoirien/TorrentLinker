.tracker-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.tracker-row .label { font-size: 12px; letter-spacing: .06em; color: var(--muted); }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: var(--tag); }
.notice { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 0 0 12px; font-size: 13px; }
.notice[hidden] { display: none; }
.notice.warn { border-color: var(--warning); }
.demo-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 12px; margin-bottom: 14px; border: 1px dashed var(--line); border-radius: 10px; font-size: 12.5px; color: var(--muted); }
.demo-bar .chip { padding: 3px 10px; }
main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
.sr-row.leaving { display: none; }
.unavailable { color: var(--muted); font-size: 12px; font-style: italic; }
@media (max-width: 720px) {
  .sr-row { grid-template-columns: 24px 44px minmax(0, 1fr) 44px; }
  .sr-row .sr-stats, .sr-row .sr-age, .sr-row .sr-zen { grid-column: 3 / 4; }
  .sr-row .dl-button { grid-column: 4; grid-row: 1; }
  .sr-row .sr-stats { display: flex; gap: 12px; align-items: center; }
  .search-head { justify-content: flex-start; }
}

</style></head><body>
<main>
 <div class="demo-bar" role="group" aria-label="Preview controls">
  <span>Preview</span>
  <button type="button" class="chip" id="demo-theme">Theme: dark</button>
  <button type="button" class="chip" id="demo-companion" aria-pressed="true">tr4ker companion: paired</button>
  <button type="button" class="chip" id="demo-lang">EN</button>
 </div>
 <section id="results">
  <div class="search-head">
   <label class="release-score-selector">ReleaseScore <select aria-label="ReleaseScore profile"><option>Default</option></select></label>
   <span class="search-tools">
    <button type="button" class="chip" id="dens-compact" aria-pressed="false">Compact</button>
    <button type="button" class="chip" id="dens-comfortable" aria-pressed="true">Comfortable</button>
    <button type="button" class="quiet">Download queue</button>
   </span>
  </div>
  <form id="search-form" class="search-bar">
   <input id="search-query" value="Big Buck Bunny" aria-label="Search" maxlength="200" />
   <button class="primary">Search</button>
  </form>
  <div class="tracker-row" role="group" aria-label="Trackers">
   <span class="label" id="l-trackers">TRACKERS</span>
   <button type="button" class="chip" data-tracker="c411" aria-pressed="true" style="--tag:#3b82f6"><span class="dot"></span>c411</button>
   <button type="button" class="chip" data-tracker="tr4ker" aria-pressed="true" style="--tag:#f97316"><span class="dot"></span>tr4ker</button>
  </div>
  <div class="search-row">
   <span class="unavailable" id="note-unavailable"></span>
   <span class="spacer"></span>
   <button type="button" class="quiet">Subscribe to RSS</button>
  </div>
  <p class="notice" id="note-backend" role="status" hidden></p>
  <p class="notice warn" id="note-error" role="status" hidden></p>
  <div class="results-card">
   <div class="results-head"><h2 id="h-results">Search results</h2><span id="search-summary" class="muted"></span></div>
   <div class="results-sort"><span class="muted" id="l-sort">SORT</span><span id="search-sort" class="search-sort" role="group" aria-label="Sort"></span></div>
   <div id="search-table" class="search-results"></div>
  </div>
  <p id="search-status" class="muted" role="status"></p>
 </section>
</main>
<script>
const DAY = 86400000, NOW = Date.UTC(2026, 10, 23, 12);
// Synthetic rows. tr4ker rows have no info hash (native rows carry a slug); the same
// release on both Trackers stays two rows.
const ROWS = [
 {t:"c411", title:"Big.Buck.Bunny.2008.MULTI.VFF.2160p.WEB-DL.x265-GRP", size:9.6e9, up:42, down:3, age:1, done:211, cat:"Film", up_by:"neo"},
 {t:"tr4ker", title:"Big.Buck.Bunny.2008.MULTI.VFF.2160p.WEB-DL.x265-GRP", size:9.6e9, up:17, down:1, age:1.2, done:64, cat:"Films", free:true},
 {t:"c411", title:"Big.Buck.Bunny.2008.1080p.BluRay.x264-WOLF", size:4.1e9, up:12, down:2, age:6, done:98, cat:"Film", up_by:"wolf"},
 {t:"tr4ker", title:"Big.Buck.Bunny.2008.VO.2160p.AC3.5.1.x264", size:7.3e9, up:0, down:0, age:30, done:12, cat:"Films"},
 {t:"tr4ker", title:"Big Buck Bunny (soundtrack) FLAC", size:3.2e8, up:5, down:0, age:90, done:20, cat:"Audio"},
 {t:"c411", title:"Big.Buck.Bunny.Making.Of.2008.720p.WEB.x264-TEAM", size:8.2e8, up:3, down:1, age:200, done:30, cat:"Film", up_by:"lux"},
];
const COLOR = {Film:"#3b82f6", Films:"#3b82f6", Audio:"#f59e0b"};
const SORTS = [["age","Age","Âge"],["seeds","Seeders","Seeders"],["leech","Leechers","Leechers"],["size","Size","Taille"],["done","Completed","Complétés"],["name","Name","Nom"]];
const state = {on:new Set(["c411","tr4ker"]), sort:{key:"age", order:"desc"}, fr:false, paired:true, compact:false};
const $ = (id) => document.getElementById(id);
const say = (en, fr) => (state.fr ? fr : en);
const bytes = (n) => n >= 1e9 ? (n/1e9).toFixed(1)+" GB" : (n/1e6).toFixed(0)+" MB";
const age = (d) => d < 2 ? say("1 d","1 j") : d < 60 ? Math.round(d)+say(" d"," j") : Math.round(d/30)+say(" mo"," mois");
function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
// tr4ker sorts by seeders, size, title and leechers fail natively (HTTP 500): these sorts run
// here on the rows both Trackers returned. The page says so for tr4ker rows.
const LOCAL = new Set(["seeds","size","name","leech"]);
function sorted() {
  const k = state.sort.key, sign = state.sort.order === "desc" ? -1 : 1;
  const val = {age:(r)=>-r.age, seeds:(r)=>r.up, leech:(r)=>r.down, size:(r)=>r.size, done:(r)=>r.done, name:(r)=>r.title.toLowerCase()}[k];
  return ROWS.filter((r)=>state.on.has(r.t)).sort((a,b)=>{ const x=val(a), y=val(b); return (x<y?-1:x>y?1:0)*sign; });
}
function row(r, i) {
  const e = el("div", undefined, "sr-row");
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.setAttribute("aria-label", r.title);
  cb.onchange = () => e.classList.toggle("selected", cb.checked);
  const cover = el("div", undefined, "cover"); cover.style.setProperty("--cover", COLOR[r.cat] || "#64748b");
  cover.append(el("span", r.cat.slice(0,2).toUpperCase(), "cover-letters"));
  const main = el("div", undefined, "sr-main"), l1 = el("div", undefined, "sr-line");
  const kind = el("span", r.cat, "tag kind"); kind.style.setProperty("--tag", COLOR[r.cat] || "#64748b");
  const badge = el("span", r.t, "tag tracker " + r.t); badge.title = say("Tracker: "+r.t, "Tracker : "+r.t); badge.dataset.tracker = r.t;
  const title = el("button", r.title.replace(/\./g, " "), "sr-title link"); title.type = "button";
  title.onclick = () => ($("search-status").textContent = say("Opens the detail of the "+r.t+" torrent (files, NFO, description).", "Ouvre le détail du torrent "+r.t+" (fichiers, NFO, description)."));
  const score = el("button", r.up > 10 ? "92" : "74", "release-score-pill " + (r.up > 10 ? "score-green" : "score-yellow")); score.type = "button";
  l1.append(badge, kind, title, score);
  if (r.free) l1.append(el("span", "FREELEECH", "tag tag-zen"));
  const rel = el("div", r.title, "sr-release");
  main.append(l1, rel);
  const stats = el("div", undefined, "sr-stats"), bar = el("div", undefined, "seedbar"), tot = r.up + r.down;
  bar.style.setProperty("--seeds", tot ? Math.round(100*r.up/tot)+"%" : "0%"); bar.classList.toggle("no-peers", !tot);
  const peers = el("span", undefined, "sr-peers"); peers.append(el("span","↑ "+r.up,"up"), el("span","↓ "+r.down,"down"));
  stats.append(el("strong", bytes(r.size), "sr-size"), peers, bar);
  const when = el("div", undefined, "sr-age"); when.append(el("span", age(r.age)), el("span", r.done+" compl.", "muted"));
  if (r.up_by) when.append(el("span", r.up_by, "muted sr-uploader"));
  const zen = el("div", undefined, "sr-zen");
  if (r.t === "c411") zen.append(el("span", "≈ 31 Zen/"+say("day","j"), "tag tag-zen"), el("small", "≈ 2.4 Note", "muted"));
  else zen.append(el("small", say("No Zen on tr4ker", "Pas de Zen sur tr4ker"), "muted"));
  const dl = el("button", undefined, "dl-button"); dl.type = "button"; dl.title = say("Add to the download queue","Ajouter à la file de téléchargement");
  dl.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  dl.onclick = (ev) => { ev.stopPropagation(); $("search-status").textContent = say("Queued "+r.t+": "+r.title, "Ajouté ("+r.t+") : "+r.title); };
  e.append(cb, cover, main, stats, when, zen, dl);
  return e;
}
function render() {
  const rows = sorted();
  const host = $("search-table"); host.classList.toggle("compact", state.compact);
  host.replaceChildren(...rows.map(row));
  const counts = ["c411","tr4ker"].map((t)=>t+" "+rows.filter((r)=>r.t===t).length).join(" · ");
  $("search-summary").textContent = rows.length+say(" results · "," résultats · ")+counts;
  $("h-results").textContent = say("Search results", "Résultats de recherche");
  $("l-sort").textContent = say("SORT", "TRIER"); $("l-trackers").textContent = "TRACKERS";
  $("search-sort").replaceChildren(...SORTS.map(([key,en,fr]) => {
    const active = state.sort.key === key, b = el("button", (state.fr?fr:en)+(active?(state.sort.order==="desc"?" ↓":" ↑"):""), "chip sort");
    b.type = "button"; b.setAttribute("aria-pressed", String(active));
    b.onclick = () => { state.sort = active ? {key, order: state.sort.order==="desc"?"asc":"desc"} : {key, order: key==="name"?"asc":"desc"}; render(); };
    return b;
  }));
  const t4k = state.on.has("tr4ker");
  const note = $("note-backend");
  if (!t4k) note.hidden = true;
  else if (!state.paired) { note.hidden = false; note.textContent = say("The tr4ker companion is not paired: tr4ker rows come from Torznab (no leechers or completions). Pair it in Settings > Connection for native results.", "Le compagnon tr4ker n'est pas associé : les lignes tr4ker viennent de Torznab (sans leechers ni complétés). Associez-le dans Réglages > Connexion pour les résultats natifs."); }
  else if (LOCAL.has(state.sort.key)) { note.hidden = false; note.textContent = say("tr4ker cannot sort by "+SORTS.find((s)=>s[0]===state.sort.key)[1]+" itself: its rows are sorted here, within the page it returned.", "tr4ker ne sait pas trier par ce critère : ses lignes sont triées ici, dans la page reçue."); }
  else note.hidden = true;
  $("note-unavailable").textContent = t4k ? say("Not on tr4ker: Zen, trust votes, release team.", "Absent sur tr4ker : Zen, votes de confiance, équipe.") : "";
  $("note-error").hidden = true;
  $("demo-companion").textContent = say("tr4ker companion: ", "compagnon tr4ker : ") + (state.paired ? say("paired","associé") : say("not paired","non associé"));
  $("demo-lang").textContent = state.fr ? "FR" : "EN";
  $("dens-compact").setAttribute("aria-pressed", String(state.compact)); $("dens-comfortable").setAttribute("aria-pressed", String(!state.compact));
}
document.querySelectorAll("[data-tracker]").forEach((b) => (b.onclick = () => {
  const t = b.dataset.tracker;
  if (state.on.has(t) && state.on.size === 1) return; // at least one Tracker stays on
  state.on.has(t) ? state.on.delete(t) : state.on.add(t);
  b.setAttribute("aria-pressed", String(state.on.has(t))); render();
}));
$("demo-theme").onclick = () => { const light = document.documentElement.dataset.theme !== "light"; document.documentElement.dataset.theme = light ? "light" : "dark"; $("demo-theme").textContent = "Theme: " + (light ? "light" : "dark"); };
$("demo-companion").onclick = () => { state.paired = !state.paired; $("demo-companion").setAttribute("aria-pressed", String(state.paired)); render(); };
$("demo-lang").onclick = () => { state.fr = !state.fr; render(); };
$("dens-compact").onclick = () => { state.compact = true; render(); };
$("dens-comfortable").onclick = () => { state.compact = false; render(); };
$("search-form").onsubmit = (e) => { e.preventDefault(); $("search-status").textContent = say("Search runs on both Trackers (preview data).", "La recherche porte sur les deux Trackers (données de l'aperçu)."); };
render();
</script></body></html>

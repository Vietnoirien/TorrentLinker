<!doctype html><html lang="fr" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TorrentLinker · Pré-rolls · Prototype</title><style>/* Shared palette for Qt, the Web shell and bundled panels.
   Keep these two token blocks literal: gui/theme.py reads their declarations.
   Approved panel-specific light overrides remain in each panel's view.css. */
:root {
  color-scheme: dark;
  --bg: #161d23;
  --panel: #202932;
  --raised: #26323c;
  --line: #33404b;
  --text: #e2e9ed;
  --muted: #98aab7;
  --accent: #80bdb6;
  --accent-text: #102a2b;
  --tint: #263e43;
  --hover: #263e43;
  --danger: #ff9c9c;
  --warning: #edbf73;
  --success: #4ad394;
  --link: #64c9c0;
  --shadow: none;
  --ink: var(--text);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f6fa;
  --panel: #ffffff;
  --raised: #f7f9fc;
  --line: #d5dfe9;
  --text: #203047;
  --muted: #5c6c80;
  --accent: #087f76;
  --accent-text: #ffffff;
  --tint: #d8eeeb;
  --hover: #e8f3f2;
  --danger: #b42332;
  --warning: #8a5800;
  --success: #1f9d63;
  --link: #087f76;
  --shadow: 0 16px 60px #172b3e12;
}

*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:var(--bg);color:var(--text)}button,select,input{font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text)}button{cursor:pointer}button:hover{background:var(--hover)}.primary,.selected{background:var(--tint);color:var(--accent);border-color:var(--accent)}aside{width:190px;position:fixed;inset:0 auto 0 0;background:var(--panel);border-right:1px solid var(--line);padding:26px 18px}aside h3{color:var(--accent)}aside p{padding:12px;border-radius:8px}main{margin-left:190px;padding:30px 38px 110px;max-width:1700px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:0 0 8px}h2{font-size:22px}h3{font-size:17px}.muted,small{color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}article,.panel{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--panel)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.toolbar{display:flex;gap:10px;margin:18px 0}.poster{aspect-ratio:16/9;border-radius:8px;background:linear-gradient(145deg,#152c36,#32646a);display:grid;place-items:center;color:#e2e9ed;font-size:26px;letter-spacing:.06em}.gold{background:linear-gradient(145deg,#47301a,#987347)}.violet{background:linear-gradient(145deg,#302946,#626589)}.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px}table{width:100%;border-collapse:collapse;background:var(--panel)}th,td{text-align:left;padding:17px;border-bottom:1px solid var(--line)}th{font-weight:500;color:var(--muted)}.tag{display:inline-block;padding:5px 9px;background:var(--raised);border-radius:5px;font-size:12px}.stack{display:grid;gap:12px}.step{padding:18px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:90px;border:1px solid var(--line);padding:9px;border-radius:6px}.day.active{background:var(--tint)}.player{height:350px;background:#10232b;color:#fff;display:grid;place-items:center;border-radius:12px;font-size:36px}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;background:#203047;color:white;padding:9px 15px;border-radius:40px;box-shadow:0 6px 24px #0003;z-index:9}.switcher button{border-radius:50%;background:transparent;color:white}.note{padding:12px 16px;border-left:3px solid var(--accent);background:var(--tint);margin:18px 0}.wide{max-width:800px;margin:auto}.stepper{display:flex;justify-content:space-between;margin:24px 0}.stepper span{border-bottom:3px solid var(--line);padding:12px}.stepper .active{border-color:var(--accent)}.field{display:grid;gap:8px;margin:16px 0}footer{margin-top:24px;color:var(--muted)}@media(max-width:900px){aside{display:none}main{margin:0;padding:24px 18px 110px}.grid,.split{grid-template-columns:1fr}.switcher{min-width:330px}.calendar{grid-template-columns:repeat(7,minmax(35px,1fr))}.day{min-height:60px;font-size:12px}}
</style><aside><h3>▣ TorrentLinker</h3><p>Zen</p><p>Bibliothèque</p><p>Upload</p><p>Recherche</p><p>RSS</p><p>Torrents</p><p>Assistant</p><p class="selected">Médias</p><p>Documentation</p><p>Paramètres</p></aside><main><header><div><small>MÉDIAS / PRÉ-ROLLS</small><h1>Votre séance commence ici</h1><span class="muted">Les clips, bandes-annonces et messages avant vos films.</span></div><button id="theme">Clair / sombre</button></header><nav id="screens"></nav><div id="content"></div><footer>Prototype #141 · données fictives · aucune lecture ni modification réelle</footer></main><div class="switcher"><button id="prev" aria-label="Variante précédente">←</button><span id="label"></span><button id="next" aria-label="Variante suivante">→</button></div><script>
const screens={library:'Bibliothèque',sequence:'Séquences',calendar:'Calendrier',rules:'Règles',trailers:'Bandes-annonces',studio:'Studio',playback:'Lecture'};
const params=new URLSearchParams(location.search);let variant=params.get('variant')||'A',screen=params.get('screen')||'library';
const names={A:'Cartes et sections',B:'Liste et inspecteur',C:'Parcours guidé'};
const clips=[['Bienvenue au cinéma','Local · 12 s · Tous publics','BIENVENUE',''],['Une soirée ensemble','Communauté · 18 s · Tous publics','CINÉMA','gold'],['Prochainement','Local · 8 s · Tous publics','À SUIVRE','violet']];
const card=(c)=>`<article><div class="poster ${c[3]}">${c[2]}</div><h3>${c[0]}</h3><p class="muted">${c[1]}</p><div class="row"><span class="tag">Accueil</span><button onclick="selectClip(this)">Choisir</button></div></article>`;
const library=()=>`<div class="toolbar"><input placeholder="Rechercher un clip" aria-label="Rechercher un clip"><select aria-label="Origine"><option>Toutes les origines</option><option>Local</option><option>Communauté</option></select><button class="primary">Importer un clip</button></div><div class="grid">${clips.map(card).join('')}</div>`;
const sequence=()=>`<h2>Soirée cinéma</h2><p class="muted">Avant les films · 42 secondes · Ignorable</p><div class="stack">${['1 · Bienvenue au cinéma · 12 s','2 · Bande-annonce adaptée au public · 20 s','3 · Pause · 2 s','4 · Prochainement · 8 s'].map(x=>`<div class="step row"><span>${x}</span><button>↑ ↓</button></div>`).join('')}</div><div class="toolbar"><button>Ajouter une étape</button><button class="primary">Prévisualiser</button></div><p class="note">Si une étape manque, passer à la suivante. Tirage aléatoire sans répétition.</p>`;
const calendar=()=>`<div class="row"><h2>Décembre 2026</h2><button>Nouvel événement</button></div><div class="calendar">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<small>${x}</small>`).join('')}${Array.from({length:28},(_,i)=>`<div class="day ${i>19&&i<26?'active':''}">${i+1}${i===23?'<p>Noël<br>Priorité 20</p>':''}</div>`).join('')}</div><p class="note">Le programme prioritaire remplace le programme habituel. Le reste du temps : Soirée cinéma.</p>`;
const rules=()=>`<h2>Quand jouer cette séquence ?</h2><div class="grid">${[['Contenu','Films et épisodes'],['Genres','Aventure, famille'],['Horaire','18:00 – 23:00'],['Public','Tous les comptes'],['Audio','Tous les formats'],['Classification','Adaptée au film et au spectateur']].map(([a,b])=>`<article><small>${a}</small><h3>${b}</h3><button>Modifier</button></article>`).join('')}</div><p class="note">Un clip ne dépasse jamais la classification du film ni la limite du spectateur.</p>`;
const trailers=()=>`<h2>Bandes-annonces</h2><p class="muted">Liens TMDb lus dans YouTube, sans téléchargement. Les fichiers locaux sont aussi disponibles.</p><div class="grid">${[['Les explorateurs','YouTube · Français · Tous publics','EXPLORATEURS',''],['Au-delà des nuages','Local · 1 min 40 · Tous publics','LES NUAGES','violet'],['Le voyage','YouTube · Français · −12','LE VOYAGE','gold']].map(card).join('')}</div>`;
const studio=()=>`<h2>Créer un message d’accueil</h2><div class="split"><div class="player">Bienvenue au cinéma</div><div class="panel"><label class="field">Modèle<select><option>Bienvenue</option><option>Annonce</option><option>Prochainement</option></select></label><label class="field">Nom de votre cinéma<input value="Cinéma du salon"></label><label class="field">Durée<select><option>12 secondes</option><option>20 secondes</option></select></label><button class="primary">Générer sur cet appareil</button><p class="muted">Votre vidéo reste locale jusqu’à ce que vous choisissiez de la partager.</p></div></div>`;
const playback=()=>`<div class="row"><h2>Soirée cinéma</h2><span class="tag">1 / 3 · Bienvenue au cinéma</span></div><div class="player">BIENVENUE</div><div class="toolbar"><button>▶ Lecture</button><span>00:04 / 00:12</span><button>Passer ce clip</button><button class="primary">Aller au film</button></div><p class="muted">À suivre : bande-annonce, puis votre film. Une erreur de clip n’empêche jamais le film de démarrer.</p>`;
const views={library,sequence,calendar,rules,trailers,studio,playback};
const rows={library:clips.map(c=>[c[0],c[1]]),sequence:[['Bienvenue','12 s'],['Bande-annonce','20 s'],['Pause','2 s'],['Prochainement','8 s']],calendar:[['Tous les vendredis','Soirée cinéma · priorité 1'],['24–26 décembre','Noël · priorité 20'],['Sans événement','Programme habituel']],rules:[['Films','Famille, aventure'],['Après 18 h','Tous les comptes'],['Classification','Adaptée au spectateur']],trailers:[['Les explorateurs','YouTube · Français'],['Au-delà des nuages','Fichier local'],['Le voyage','YouTube · −12']],studio:[['Bienvenue','Modèle simple'],['Annonce','Texte et affiches'],['Prochainement','Affiches de la bibliothèque']],playback:[['1 · Bienvenue','En cours · 12 s'],['2 · Bande-annonce','À suivre · 20 s'],['3 · Film','Prêt']]};
function variantB(){return `<h2>${screens[screen]}</h2><div class="toolbar"><input placeholder="Filtrer" aria-label="Filtrer"><button class="primary">Ajouter</button></div><div class="split"><div class="panel"><table><thead><tr><th>Élément</th><th>Détails</th></tr></thead><tbody>${rows[screen].map(([a,b],i)=>`<tr class="${i===0?'selected':''}" onclick="inspect(this)"><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table></div><div class="panel"><small>INSPECTEUR</small><h2 id="inspect-title">${rows[screen][0][0]}</h2><div class="poster">${screen==='playback'?'▶':'APERÇU'}</div><p>${rows[screen][0][1]}</p><label class="field">Catégorie<select><option>Accueil</option><option>Événement</option></select></label><label class="field">Classification<select><option>Tous publics</option><option>−12</option></select></label><button class="primary">${screen==='playback'?'Passer au film':'Enregistrer'}</button><p class="muted">Les détails restent visibles à côté de la liste.</p></div></div>`}
let step=0;function variantC(){const steps=screen==='playback'?['Avant la séance','Le clip','Votre film']:['Choisir','Configurer','Vérifier'];return `<div class="wide"><div class="stepper">${steps.map((x,i)=>`<span class="${i===step?'active':''}">${i+1}. ${x}</span>`).join('')}</div><h2>${screens[screen]} · ${steps[step]}</h2><p class="muted">Une étape à la fois, avec un aperçu avant de confirmer.</p>${step===0?`<div class="stack">${rows[screen].map(([a,b])=>`<article class="row"><div><h3>${a}</h3><span class="muted">${b}</span></div><button onclick="selectClip(this)">Choisir</button></article>`).join('')}</div>`:step===1?`<article><label class="field">Nom<input value="Soirée cinéma"></label><label class="field">Public<select><option>Selon le film et le spectateur</option></select></label><label class="field">Si un clip manque<select><option>Continuer la séance</option></select></label></article>`:`<article><div class="poster">SÉANCE PRÊTE</div><p>Vos choix sont prêts. La séquence reste toujours ignorable.</p><button class="primary">${screen==='playback'?'Démarrer le film':'Confirmer'}</button></article>`}<div class="row toolbar"><button onclick="step=Math.max(0,step-1);render()">Précédent</button><button class="primary" onclick="step=Math.min(2,step+1);render()">Continuer →</button></div></div>`}
function render(){if(!screens[screen])screen='library';if(!names[variant])variant='A';document.getElementById('screens').innerHTML=Object.entries(screens).map(([k,v])=>`<button class="${screen===k?'selected':''}" onclick="screen='${k}';step=0;render()">${v}</button>`).join('');document.getElementById('content').innerHTML=variant==='A'?views[screen]():variant==='B'?variantB():variantC();document.getElementById('label').textContent=`${variant} · ${names[variant]}`;history.replaceState(null,'',`?screen=${screen}&variant=${variant}`)}
function cycle(delta){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+delta+3)%3];step=0;render()}
function selectClip(button){button.classList.toggle('selected');button.textContent=button.classList.contains('selected')?'Sélectionné':'Choisir'}
function inspect(row){row.closest('tbody').querySelectorAll('tr').forEach(x=>x.classList.remove('selected'));row.classList.add('selected');document.getElementById('inspect-title').textContent=row.cells[0].textContent}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1)});render();
</script></html>

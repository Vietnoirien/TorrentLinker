<h1 style="padding-right:340px">Paramètres</h1>
<div class="settings-layout">
 <nav id="settings-navigation" aria-label="Sections des paramètres"></nav>
 <main><p id="settings-status" role="status"></p><div id="settings-body"></div></main>
</div>
<dialog class="assistant-dialog" id="dialog"></dialog>
<div id="switcher"><button id="scenario" title="Change la situation de départ">Situation : <span id="scenario-label"></span></button><button id="theme">Thème</button><button id="reset">Réinitialiser</button></div>
<script>
/* Fictional state. Scenario "import": tr4ker was imported from Prowlarr earlier and sits in the Indexers list.
   Scenario "clean": nothing of tr4ker yet. Switch with the "Situation" button (or ?s=clean). */
const scenarios={
 import:()=>({tab:"tr4ker",
  c411:{key:true,announce:true,companion:"paired",enabled:true},
  tr4ker:{enabled:false,key:false,passkey:false,companion:"none",adopted:false,history:0},
  indexers:[
   {id:"nebula",name:"Nebula",url:"http://prowlarr:9696/3/api",source:"Prowlarr",on:true,state:"ok",caps:["IMDb","TVDB"]},
   {id:"t4k",name:"tr4ker",url:"http://prowlarr:9696/9/api",host:"tr4ker.net",source:"Prowlarr",on:true,state:"ok",caps:["IMDb","TMDb"],history:42,key:true},
   {id:"vega",name:"Vega",url:"https://vega.example/api/torznab",source:"Ajouté à la main",on:false,state:"error",caps:[],error:"Clé API refusée (401)."}],
  arr:{kind:"prowlarr",url:"http://prowlarr:9696",synced:"il y a 2 h",available:[["Nebula",true],["tr4ker",true],["Lyra",false],["Altair",false]]}}),
 clean:()=>({tab:"tr4ker",
  c411:{key:true,announce:true,companion:"paired",enabled:true},
  tr4ker:{enabled:false,key:false,passkey:false,companion:"none",adopted:false,history:0},
  indexers:[{id:"nebula",name:"Nebula",url:"http://prowlarr:9696/3/api",source:"Prowlarr",on:true,state:"ok",caps:["IMDb","TVDB"]}],
  arr:{kind:"prowlarr",url:"http://prowlarr:9696",synced:"il y a 2 h",available:[["Nebula",true],["tr4ker",false],["Lyra",false]]}})};
let scenario=new URLSearchParams(location.search).get("s")==="clean"?"clean":"import";
let S=scenarios[scenario]();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const status=t=>{document.getElementById("settings-status").textContent=t};
const nav=()=>["Connexion","Clients","Général","ReleaseScore","Utilisateurs","Notifications"].map(s=>`<button ${s==="Connexion"?'aria-current="page"':""}>${s}</button>`).join("");
const TABS=[["c411","c411"],["tr4ker","tr4ker"],["indexers","Indexeurs"]];
const tabs=()=>`<div class="tabs" role="tablist">${TABS.map(([id,label])=>`<button role="tab" data-tab="${id}" aria-selected="${S.tab===id}">${label}${id==="tr4ker"&&S.tr4ker.enabled?' <span class="tag on">actif</span>':""}${id==="indexers"?` <small class="muted">${S.indexers.length}</small>`:""}</button>`).join("")}</div>`;
const tr4kerIdx=()=>S.indexers.find(i=>i.host==="tr4ker.net");
const companionTag=c=>c==="paired"?`<span class="tag on">Appairé</span>`:c==="waiting"?`<span class="tag warn">En attente de la session tr4ker</span>`:`<span class="tag">Non appairé</span>`;

/* c411: today's connection settings, unchanged. */
function c411(){const c=S.c411;return `<div class="settings-form"><h2>c411</h2>
 <p class="muted">La connexion actuelle à c411, inchangée : la clé API, l'adresse d'annonce et le compagnon du navigateur.</p>
 <section class="settings-card"><h3>Clé API</h3><div class="secret-line"><input type="password" placeholder="${c.key?"Enregistrée ; laisser vide pour la garder":"Collez la clé API"}" data-c411-key><button data-test-c411>Tester</button></div>
 <p class="muted" style="margin:8px 0 0">Enregistrée dans le trousseau, jamais renvoyée à l'écran.</p></section>
 <section class="settings-card"><h3>Adresse d'annonce</h3><div class="secret-line"><input type="password" placeholder="${c.announce?"Enregistrée ; laisser vide pour la garder":"https://…/announce/votre-passkey"}"></div></section>
 <section class="settings-card"><h3>Compagnon du navigateur</h3><p>${companionTag(c.companion)}</p><div class="settings-actions"><button data-c411-companion>${c.companion==="paired"?"Dissocier":"Appairer"}</button></div></section>
 <div class="settings-actions"><button class="primary" data-save>Enregistrer</button><button data-discard>Annuler les modifications</button></div></div>`}

/* tr4ker: enable, API key, passkey, companion, capabilities, and the adoption offer. */
function caps(){const t=S.tr4ker,live=t.enabled&&t.key,ses=t.companion==="paired";
 const row=(name,state,why)=>`<tr><th>${name}</th><td>${state==="live"?'<span class="tag on">Disponible</span>':state==="needs"?`<span class="tag warn">${why}</span>`:`<span class="tag bad">Indisponible</span> <span class="unavailable">${why}</span>`}</td></tr>`;
 return `<table class="file-access-capabilities matrix"><tbody>
 ${row("Recherche, Cross-seed et téléchargements",live?"live":"needs","Clé API requise")}
 ${row("Flux RSS et adresse d'annonce",t.enabled&&t.passkey?"live":"needs","Passkey requis")}
 ${row("Profil, détail d'un torrent, publication",live&&ses?"live":"needs","Session tr4ker appairée requise")}
 ${row("Zen",  "none","tr4ker n'a pas de Zen : ses crédits sont une estimation apprise")}
 </tbody></table>`}
function adoptOffer(){const i=tr4kerIdx();if(!i||S.tr4ker.adopted)return "";
 return `<section class="settings-card offer"><h3>Un indexeur tr4ker existe déjà</h3>
 <p>« ${esc(i.name)} », importé de ${esc(i.source)}, pointe vers <b>${esc(i.host)}</b>. Vous pouvez le reprendre ici : sa clé API et l'historique de ses cross-seeds (${i.history} enregistrements) passent à tr4ker, et il quitte la liste des indexeurs, pour que tr4ker ne soit jamais cherché deux fois.</p>
 <div class="settings-actions"><button class="primary" data-adopt>Reprendre cet indexeur</button><button data-keep-separate>Le laisser dans les indexeurs</button></div>
 <p class="muted" style="margin:8px 0 0">Une nouvelle synchronisation Prowlarr ne le recréera pas.</p></section>`}
function tr4ker(){const t=S.tr4ker;return `<div class="settings-form"><h2>tr4ker</h2>
 <p class="muted">tr4ker est un tracker à part entière, comme c411 : un compte, une API et ses propres règles. Ses résultats s'ajoutent à ceux de c411, chaque ligne portant son tracker.</p>
 ${adoptOffer()}
 <section class="settings-card"><label class="settings-check"><input type="checkbox" data-t-enable ${t.enabled?"checked":""}> Activer tr4ker</label>${t.adopted?'<p class="muted" style="margin:8px 0 0">Indexeur repris : clé API et historique des cross-seeds conservés.</p>':""}</section>
 <section class="settings-card ${t.enabled?"":"is-off"}"><h3>Clé API</h3><div class="secret-line"><input type="password" placeholder="${t.key?"Enregistrée ; laisser vide pour la garder":"Collez la clé API de tr4ker"}" data-t-key ${t.enabled?"":"disabled"}><button data-t-test ${t.enabled&&t.key?"":"disabled"}>Tester</button></div>
 <p class="muted" style="margin:8px 0 0">Recherche, cross-seed et téléchargements des .torrent. Dans le trousseau, jamais renvoyée à l'écran.</p></section>
 <section class="settings-card ${t.enabled?"":"is-off"}"><h3>Passkey</h3><div class="secret-line"><input type="password" placeholder="${t.passkey?"Enregistré ; laisser vide pour le garder":"Collez votre passkey"}" data-t-pass ${t.enabled?"":"disabled"}></div>
 <p class="muted" style="margin:8px 0 0">Flux RSS et adresse d'annonce de vos torrents. Distinct de la clé API.</p></section>
 <section class="settings-card ${t.enabled?"":"is-off"}"><h3>Compagnon du navigateur</h3><p>${companionTag(t.companion)}</p>
 <p class="muted">Le profil, le détail des torrents et la publication passent par votre session tr4ker dans le navigateur ; aucun cookie ne quitte le navigateur.</p>
 <div class="settings-actions"><button data-t-companion ${t.enabled?"":"disabled"}>${t.companion==="paired"?"Dissocier":t.companion==="waiting"?"Annuler l'appairage":"Appairer avec un onglet tr4ker"}</button></div></section>
 <section class="settings-card"><h3>Ce qui fonctionne</h3><div id="caps">${caps()}</div></section>
 <div class="settings-actions"><button class="primary" data-save>Enregistrer</button><button data-discard>Annuler les modifications</button></div></div>`}

/* Indexers: the search-only list and the Prowlarr or Jackett import, as today. */
const stateTag=x=>x.state==="ok"?`<span class="tag on">Connecté</span>`:x.state==="limited"?`<span class="tag warn">Limité</span>`:`<span class="tag bad">Erreur</span>`;
function idxCard(x){return `<section class="client-card"><div class="head"><div><h3>${esc(x.name)}</h3><p class="muted">${esc(x.source)} · ${esc(x.url)}</p></div><div>${stateTag(x)}${x.caps.map(c=>`<span class="tag">${c}</span>`).join("")}</div></div>
 ${x.error?`<p class="settings-error" style="margin:6px 0 0">${esc(x.error)}</p>`:""}
 <div class="settings-actions" style="margin-top:10px"><label class="settings-check"><input type="checkbox" data-on="${x.id}" ${x.on?"checked":""}> Chercher sur cet indexeur</label><button data-test="${x.id}">Tester</button><button data-remove="${x.id}">Retirer</button></div></section>`}
function arrCard(){const a=S.arr;return `<section class="settings-card"><h3>Importer depuis Prowlarr ou Jackett</h3>
 <div class="settings-fields"><label class="settings-field">Service<select data-arr-kind><option value="prowlarr" ${a.kind==="prowlarr"?"selected":""}>Prowlarr</option><option value="jackett" ${a.kind==="jackett"?"selected":""}>Jackett</option></select></label>
 <label class="settings-field">Adresse<input value="${esc(a.url)}"></label><label class="settings-field">Clé API<input type="password" placeholder="Enregistrée ; laisser vide pour la garder"></label></div>
 <div style="margin-top:12px">${a.available.map(([n,imp])=>{const adopted=n==="tr4ker"&&S.tr4ker.adopted;return `<label class="settings-check" style="padding:6px 0;border-bottom:1px solid var(--line)"><input type="checkbox" ${imp||adopted?"checked disabled":""} data-import="${esc(n)}"> ${esc(n)}<small style="margin-left:auto">${adopted?"repris par le tracker tr4ker":imp?"déjà importé":"disponible"}</small></label>`}).join("")}</div>
 <div class="settings-actions" style="margin-top:12px"><button data-import-go>Importer la sélection</button><button data-sync>Resynchroniser</button><small class="muted">Dernière synchronisation ${a.synced}</small></div></section>`}
function indexers(){return `<div class="settings-form"><h2>Indexeurs</h2>
 <p class="muted">Les indexeurs de recherche seule : Prowlarr, Jackett ou ajoutés à la main. c411 et tr4ker sont des trackers, avec leur propre onglet.</p>
 <div class="settings-actions"><button class="primary" data-add>Ajouter un indexeur Torznab</button></div>
 ${S.indexers.map(idxCard).join("")||'<p class="muted">Aucun indexeur de recherche seule.</p>'}${arrCard()}
 <div class="settings-actions"><button class="primary" data-save>Enregistrer</button><button data-discard>Annuler les modifications</button></div></div>`}

function render(){document.getElementById("settings-navigation").innerHTML=nav();
 document.getElementById("settings-body").innerHTML=`<h2 style="margin-bottom:12px">Connexion</h2>${tabs()}`+({c411,tr4ker,indexers})[S.tab]();
 document.getElementById("scenario-label").textContent=scenario==="import"?"tr4ker déjà importé":"rien d'importé"}
function addDialog(){const d=document.getElementById("dialog");d.innerHTML=`<form method="dialog"><h2>Ajouter un indexeur Torznab</h2><div class="settings-fields">
 <label class="settings-field">Nom<input placeholder="Lyra" data-new-name></label><label class="settings-field">Adresse Torznab<input placeholder="https://tracker.example/api/torznab" data-new-url></label>
 <label class="settings-field">Clé API<input type="password"></label></div><p class="muted" id="caps-line" style="margin:10px 0 0">« Tester » lit aussi ses capacités.</p>
 <p class="muted" style="margin:6px 0 0">Une adresse tr4ker.net sera proposée à l'onglet tr4ker plutôt que cherchée deux fois.</p>
 <div class="settings-actions" style="margin-top:12px"><button type="button" data-dialog-test>Tester</button><button class="primary" value="ok" data-dialog-save>Ajouter</button><button value="cancel">Annuler</button></div></form>`;d.showModal()}
document.addEventListener("change",e=>{const d=e.target.dataset;if(d.import)return;
 if(d.on){S.indexers.find(x=>x.id===d.on).on=e.target.checked;status("Modifications non enregistrées")}
 else if("tEnable" in d){S.tr4ker.enabled=e.target.checked;status(S.tr4ker.enabled?"tr4ker activé : saisissez sa clé API":"tr4ker désactivé");render()}
 else if("arrKind" in d){S.arr.kind=e.target.value;status("Modifications non enregistrées")}});
document.addEventListener("input",e=>{const d=e.target.dataset;
 if("tKey" in d||"tPass" in d){if("tKey" in d)S.tr4ker.key=!!e.target.value||S.tr4ker.key;else S.tr4ker.passkey=!!e.target.value||S.tr4ker.passkey;
  document.getElementById("caps").innerHTML=caps();document.querySelector("[data-t-test]").disabled=!(S.tr4ker.enabled&&S.tr4ker.key);status("Modifications non enregistrées")}});
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(t.closest("#switcher")){if(t.id==="theme"){const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"dark":"light"}
  else if(t.id==="scenario"){scenario=scenario==="import"?"clean":"import";S=scenarios[scenario]();status("");render()}
  else if(t.id==="reset"){S=scenarios[scenario]();status("Aperçu réinitialisé");render()}return}
 if(t.closest("#settings-navigation")){status("Cet aperçu ne montre que la section Connexion");return}
 if(d.tab){S.tab=d.tab;status("");render()}
 else if("save" in d){const t4=S.tr4ker;status(S.tab==="tr4ker"&&t4.enabled&&!t4.key?"Enregistré. tr4ker est actif mais sans clé API : la recherche reste indisponible.":"Enregistré")}
 else if("discard" in d){S=scenarios[scenario]();S.tab=t.closest("main").querySelector("[aria-selected=true]").dataset.tab;status("Modifications annulées");render()}
 else if("testC411" in d){status("c411 répond · clé API acceptée")}
 else if("c411Companion" in d){S.c411.companion=S.c411.companion==="paired"?"none":"paired";status(S.c411.companion==="paired"?"Compagnon c411 appairé":"Compagnon c411 dissocié");render()}
 else if("tTest" in d){status("tr4ker répond · recherche par IMDb et TMDb · 5 modes de recherche")}
 else if("tCompanion" in d){const t4=S.tr4ker;if(t4.companion==="paired")t4.companion="none";else if(t4.companion==="waiting")t4.companion="none";else{t4.companion="waiting";setTimeout(()=>{if(S.tr4ker.companion==="waiting"){S.tr4ker.companion="paired";status("Compagnon appairé avec votre session tr4ker");render()}},1200)}
  status(t4.companion==="waiting"?"Ouvrez un onglet tr4ker connecté dans le navigateur…":"Appairage annulé ou compagnon dissocié");render()}
 else if("adopt" in d){const i=tr4kerIdx();S.tr4ker.adopted=true;S.tr4ker.enabled=true;S.tr4ker.key=true;S.tr4ker.history=i.history;S.indexers=S.indexers.filter(x=>x!==i);status(`Indexeur repris : clé API et ${i.history} cross-seeds conservés ; il a quitté la liste des indexeurs`);render()}
 else if("keepSeparate" in d){S.tr4ker.adopted="declined";status("Indexeur laissé dans la liste. Attention : tr4ker serait cherché deux fois si vous l'activez ici.");render()}
 else if(d.test){const x=S.indexers.find(i=>i.id===d.test);status(x.state==="error"?`${x.name} : ${x.error}`:`${x.name} répond · recherche par ${x.caps.join(", ")||"nom"}`)}
 else if(d.remove){const x=S.indexers.find(i=>i.id===d.remove);S.indexers=S.indexers.filter(i=>i!==x);status(`${x.name} retiré ; ses cross-seeds restent dans le client`);render()}
 else if("add" in d)addDialog();
 else if("dialogTest" in d)document.getElementById("caps-line").textContent="Répond · recherche par IMDb et TMDb.";
 else if("dialogSave" in d){const n=document.querySelector("[data-new-name]").value||"Lyra",u=document.querySelector("[data-new-url]").value||"https://tracker.example/api/torznab";
  if(/tr4ker\.net/.test(u)&&!S.tr4ker.adopted)status("Cette adresse est celle de tr4ker : activez tr4ker à son onglet au lieu de l'ajouter ici.");
  else if(!S.indexers.some(i=>i.name===n)){S.indexers.push({id:n.toLowerCase(),name:n,url:u,source:"Ajouté à la main",on:true,state:"ok",caps:["IMDb"]});status(n+" ajouté")}
  setTimeout(render,0)}
 else if("importGo" in d){const picked=[...document.querySelectorAll("[data-import]:checked:not(:disabled)")].map(i=>i.dataset.import);
  picked.forEach(n=>{S.arr.available.find(a=>a[0]===n)[1]=true;if(n==="tr4ker"){S.indexers.push({id:"t4k",name:"tr4ker",url:S.arr.url+"/9/api",host:"tr4ker.net",source:"Prowlarr",on:true,state:"ok",caps:["IMDb","TMDb"],history:0});S.tr4ker.adopted=false}else S.indexers.push({id:n.toLowerCase(),name:n,url:S.arr.url+"/x/api",source:"Prowlarr",on:true,state:"ok",caps:["IMDb"]})});
  status(picked.length?picked.join(", ")+" importé"+(picked.length>1?"s":""):"Rien de sélectionné");render()}
 else if("sync" in d){S.arr.synced="à l'instant";const gone=S.tr4ker.adopted===true?" · tr4ker, déjà repris, n'a pas été recréé":"";status("Resynchronisé : rien de nouveau"+gone);render()}});
render();
</script>

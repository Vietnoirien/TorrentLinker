<!doctype html>
<!-- Throwaway #119 preview. One placement within the already approved Settings layout;
     reuse #118's file-access fields rather than proposing unrelated redesigns. No persistence. -->
<html lang="en" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>File access in Settings · prototype</title>
<link rel="stylesheet" href="../../../src/torrentlinker/web/static/panel/base.css">
<link rel="stylesheet" href="../../../src/torrentlinker/web/static/settings/view.css">
<style>
body{max-width:1440px;margin:auto;padding-bottom:100px} .prototype-bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:3;background:var(--raised);border:1px solid var(--accent);padding:10px 14px;border-radius:12px;max-width:calc(100vw - 24px);flex-wrap:wrap}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.status{color:var(--accent)}.capabilities{width:100%;border-collapse:collapse}.capabilities td,.capabilities th{padding:12px 0;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}.capabilities td:last-child{padding-left:20px}.capabilities th{font-weight:600}dialog{color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;width:min(1000px,calc(100vw - 24px));max-height:90vh;overflow:auto;padding:24px}dialog::backdrop{background:#0008}.full{grid-column:1/-1}.fingerprint{overflow-wrap:anywhere}.danger{color:var(--danger)}.info{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:12px}.settings-card h3{margin-top:0}.settings-card{padding:20px}#state{white-space:pre-wrap;font-size:12px}.settings-form{margin-top:16px}input[type=checkbox]{width:auto}label{display:grid;gap:6px}.check{display:flex;align-items:start;gap:8px}
</style>
<h1 data-en="Settings" data-fr="Paramètres"></h1>
<div class="settings-layout"><nav id="settings-navigation"></nav><main><h2 data-en="Connections" data-fr="Connexions"></h2><div class="settings-form">
<section class="settings-card"><h3 data-en="Torrent Client" data-fr="Client torrent"></h3><div class="settings-fields"><label><span data-en="Client name" data-fr="Nom du client"></span><input value="Seedbox"></label><label><span data-en="Client type" data-fr="Type de client"></span><select><option>qBittorrent</option></select></label><label class="full"><span data-en="Address" data-fr="Adresse"></span><input value="https://seedbox.example/qbittorrent"></label></div><p class="muted" data-en="Torrent API connection configured. File access is separate." data-fr="Connexion à l’API torrent configurée. L’accès aux fichiers est séparé."></p></section>
<section class="settings-card"><div class="row"><h3 data-en="Remote file access" data-fr="Accès aux fichiers distants"></h3><span id="access-status" class="status"></span></div><p class="muted" data-en="Optional SFTP access for this client. Reuse it in Transfers without entering credentials again." data-fr="Accès SFTP facultatif pour ce client. Réutilisez-le dans Transferts sans ressaisir les identifiants."></p><p id="access-address"></p><div class="settings-actions"><button id="configure" data-en="Configure file access…" data-fr="Configurer l’accès aux fichiers…"></button><button id="recheck" data-en="Check access" data-fr="Tester l’accès"></button><button id="remove" class="danger" data-en="Remove access…" data-fr="Supprimer l’accès…"></button></div>
<p id="access-message" class="info" hidden></p>
<h4 data-en="Available workflows" data-fr="Fonctions disponibles"></h4><table class="capabilities"><tbody id="capabilities"></tbody></table><p class="muted" data-en="Access checks do not grant permissions. Every transfer rechecks its paths and required operations. Category-folder defaults and per-transfer overrides still apply." data-fr="Un contrôle d’accès n’accorde aucun droit. Chaque transfert revérifie les chemins et opérations nécessaires. Les dossiers par catégorie et destinations propres à chaque transfert restent applicables."></p>
</section><section class="settings-card"><h3>c411</h3><p class="muted" data-en="The existing Indexer, proxy and account controls continue below." data-fr="Les contrôles existants de l’indexeur, du proxy et du compte restent en dessous."></p></section>
<details><summary data-en="Prototype state" data-fr="État du prototype"></summary><pre id="state"></pre></details>
</div></main></div>
<dialog id="editor"><div class="row"><div><small data-en="FILE CONNECTION" data-fr="CONNEXION AUX FICHIERS"></small><h2>Seedbox</h2></div><button id="close-editor" data-en="Close" data-fr="Fermer"></button></div><p data-en="These credentials are for files. The torrent client connection stays separate." data-fr="Ces identifiants sont propres aux fichiers. La connexion au client torrent reste séparée."></p>
<div class="settings-fields"><section class="settings-card"><h3>SFTP</h3><div class="settings-form"><label><span data-en="Host" data-fr="Serveur"></span><input id="host" value="sftp.seedbox.example"></label><label>Port<input type="number" value="22"></label><label><span data-en="Username" data-fr="Utilisateur"></span><input value="reader"></label><label><span data-en="Authentication" data-fr="Authentification"></span><select id="auth"><option value="password" data-en="Password" data-fr="Mot de passe"></option><option value="key" data-en="SSH key" data-fr="Clé SSH"></option></select></label><label><span data-en="Credential" data-fr="Identifiant secret"></span><input type="password" placeholder="••••••••" autocomplete="new-password"></label><p class="muted" data-en="Leave blank to keep a saved credential. On desktop, secrets stay in the keyring; on Web, they stay on the TorrentLinker server." data-fr="Laissez vide pour conserver le secret. Sur le bureau, il reste dans le trousseau ; sur le Web, sur le serveur TorrentLinker."></p></div></section>
<section class="settings-card"><h3 data-en="Folder mapping" data-fr="Correspondance des dossiers"></h3><div class="settings-form"><label><span data-en="Root seen by the torrent client" data-fr="Racine vue par le client torrent"></span><input id="client-root" value="/downloads"></label><label><span data-en="Root seen over SFTP" data-fr="Racine vue en SFTP"></span><input id="file-root" value="/home/reader/downloads"></label><button id="browse" data-en="Browse…" data-fr="Parcourir…"></button><p class="muted" data-en="Matching names do not prove shared storage." data-fr="Des noms identiques ne prouvent pas un stockage partagé."></p><h3 data-en="Server identity" data-fr="Identité du serveur"></h3><p id="identity" class="fingerprint muted"></p><label class="check"><input id="trust" type="checkbox"><span data-en="Fingerprint compared with my provider’s value" data-fr="Empreinte comparée à celle fournie par mon hébergeur"></span></label></div></section></div>
<p id="editor-result" class="info"></p><div class="settings-actions"><button id="test" data-en="Check access" data-fr="Tester l’accès"></button><button id="save" data-en="Save file access" data-fr="Enregistrer l’accès aux fichiers"></button></div></dialog>
<dialog id="removal"><h2 data-en="Remove file access?" data-fr="Supprimer l’accès aux fichiers ?"></h2><p data-en="The saved SFTP secret and server identity will be removed. Transfers must be checked again. Torrent API credentials and files are kept." data-fr="Le secret SFTP et l’identité du serveur seront supprimés. Les transferts devront être revérifiés. Les identifiants de l’API torrent et les fichiers sont conservés."></p><div class="settings-actions"><button id="cancel-remove" data-en="Cancel" data-fr="Annuler"></button><button id="confirm-remove" class="danger" data-en="Remove access" data-fr="Supprimer l’accès"></button></div></dialog>
<div class="prototype-bar"><strong>Prototype #119</strong><select id="language"><option value="en">English</option><option value="fr">Français</option></select><select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select><select id="scenario"><option value="empty">Not configured</option><option value="ready">Checked</option><option value="identity">Identity changed</option><option value="offline">Offline</option></select></div>
<script>
const $=id=>document.getElementById(id);let lang='en',state={configured:false,checked:false,identity:false,trusted:false,scenario:'empty'};const say=(en,fr)=>lang==='fr'?fr:en;
const sections=[['Connections','Connexions'],['Clients','Clients'],['Companion','Extension'],['Agent access','Accès agent'],['Assistant','Assistant'],['General','Général'],['Library Folders','Dossiers de bibliothèque'],['Download Folders','Dossiers de téléchargement'],['Client Paths','Chemins du client'],['Search & Matching','Recherche et correspondance'],['Zen','Zen']];
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[lang]);$('settings-navigation').replaceChildren(...sections.map((p,i)=>{let b=document.createElement('button');b.textContent=say(...p);if(!i)b.setAttribute('aria-current','page');return b;}));$('access-status').textContent=state.checked?say('Checked','Vérifié'):state.configured?say('Recheck required','À revérifier'):say('Not configured','Non configuré');$('access-address').textContent=state.configured?'sftp.seedbox.example:22 · /downloads ↔ /home/reader/downloads':'';$('remove').hidden=$('recheck').hidden=!state.configured;
const available=state.checked?say('Available; each operation still checks permissions and paths.','Disponible ; chaque opération vérifie ses droits et chemins.'):say('Configure and check file access first.','Configurez et testez d’abord l’accès aux fichiers.');const rows=[[say('Transfers','Transferts'),available],[say('Remote folder browsing','Parcours des dossiers distants'),available],[say('Library scan and Reseed','Analyse de bibliothèque et remise en seed'),say('Needs locally accessible files. SFTP alone is not supported.','Nécessite des fichiers accessibles localement. SFTP seul n’est pas pris en charge.')],[say('Upload preparation','Préparation des envois'),say('Needs local files and preparation tools.','Nécessite les fichiers et outils de préparation locaux.')],[say('Media inspection and playback','Inspection et lecture des médias'),say('Needs media files accessible on this computer or the TorrentLinker server.','Nécessite des médias accessibles sur cet ordinateur ou le serveur TorrentLinker.')]];$('capabilities').replaceChildren(...rows.map(([a,b])=>{let tr=document.createElement('tr');for(const text of[a,b]){let td=document.createElement('td');td.textContent=text;tr.append(td);}return tr;}));$('identity').textContent=state.identity?'SHA256:EXAMPLE-FINGERPRINT-PREVIEW-ONLY':say('Check access displays the fingerprint before authentication.','Tester l’accès affiche l’empreinte avant toute authentification.');$('trust').checked=state.trusted;$('trust').disabled=!state.identity;$('browse').disabled=!state.checked;$('save').disabled=!state.checked;$('editor-result').textContent=state.checked?say('Mapped folder is reachable. Transfer operations will check their own permissions.','Le dossier est accessible. Les transferts vérifieront leurs propres droits.'):say('No network request is sent in this preview.','Aucune requête réseau n’est envoyée dans cet aperçu.');$('access-message').hidden=!['identity','offline'].includes(state.scenario);$('access-message').textContent=state.scenario==='identity'?say('Server identity changed. Access is blocked until the fingerprint is reviewed.','L’identité du serveur a changé. L’accès est bloqué jusqu’à vérification de l’empreinte.'):say('Server unreachable. Check connectivity and retry.','Serveur inaccessible. Vérifiez la connexion puis réessayez.');$('state').textContent=JSON.stringify(state,null,2);}
$('language').onchange=e=>{lang=e.target.value;render()};$('theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;$('scenario').onchange=e=>{let value=e.target.value;state={configured:value!=='empty',checked:value==='ready',identity:value!=='empty',trusted:value==='ready',scenario:value};render()};$('configure').onclick=()=>{$('editor').showModal();render()};$('close-editor').onclick=()=>$('editor').close();$('test').onclick=()=>{state.identity=true;state.checked=state.trusted;render()};$('trust').onchange=e=>{state.trusted=e.target.checked;render()};$('save').onclick=()=>{state.configured=true;state.checked=true;state.scenario='ready';$('editor').close();render()};$('recheck').onclick=()=>{if(state.scenario==='identity'){$('editor').showModal();state.trusted=false;state.checked=false;}else{state.checked=true;state.scenario='ready';}render()};$('remove').onclick=()=>$('removal').showModal();$('cancel-remove').onclick=()=>$('removal').close();$('confirm-remove').onclick=()=>{state={configured:false,checked:false,identity:false,trusted:false,scenario:'empty'};$('removal').close();render()};$('browse').onclick=()=>{$('file-root').value='/home/reader/downloads/Films'};render();
</script></html>

    // Rerender translated dialog labels while preserving user input and focus.
    refreshForm(container, render) {
      const controls = [
        ...container.querySelectorAll("input,select,textarea,button"),
      ];
      const focused = controls.indexOf(document.activeElement);
      const values = controls.map((node) => ({
        value: node.value,
        checked: node.checked,
        selected: node.multiple
          ? [...node.selectedOptions].map((o) => o.value)
          : null,
        start: node.selectionStart,
        end: node.selectionEnd,
        click: node.onclick,
      }));
      render();
      [...container.querySelectorAll("input,select,textarea,button")].forEach(
        (node, index) => {
          const saved = values[index];
          if (!saved) return;
          if (node.matches("input,select,textarea") && node.type !== "file")
            node.value = saved.value;
          if (node.matches("input")) node.checked = saved.checked;
          if (saved.selected)
            [...node.options].forEach(
              (o) => (o.selected = saved.selected.includes(o.value)),
            );
          if (saved.click && !node.onclick) node.onclick = saved.click;
          if (index === focused) {
            node.focus({ preventScroll: true });
            if (saved.start != null)
              node.setSelectionRange(saved.start, saved.end);
          }
        },
      );
    },
    t(fr, en) {
      return language.startsWith("fr")
        ? fr
        : (en ?? (Object.hasOwn(english, fr) ? english[fr] : fr));
    },
  };

          auth: p.auth || "key",

    }

      if (!$("remote-host")) return;
      const previous = remoteDraft.config;
      const config = {
        host: $("remote-host").value.trim(),
        port: Number($("remote-port").value),
        username: $("remote-user").value.trim(),
        auth: $("remote-auth").value,
        client_root: $("remote-client-root").value.trim(),
        file_root: $("remote-file-root").value.trim(),

      d.innerHTML = `<div class="transfer-heading"><div><small>${t("CONNEXION AUX FICHIERS", "FILE CONNECTION")}</small><h2>${escape(client.name)}</h2></div><button id="remote-back" aria-label="${t("Retour", "Back")}">×</button></div><p class="muted">${t("Ces identifiants sont propres aux fichiers. La connexion au client torrent reste séparée.", "These credentials are for files. The torrent client connection stays separate.")}</p><div class="transfer-grid"><section class="panel transfer-card"><h3>SFTP</h3><label>${t("Serveur", "Host")}<input id="remote-host" value="${escape(c.host)}" autocomplete="off"></label><div class="remote-fields"><label>Port<input id="remote-port" type="number" min="1" max="65535" value="${c.port}"></label><label>${t("Utilisateur", "Username")}<input id="remote-user" value="${escape(c.username)}" autocomplete="off"></label></div><label>${t("Authentification", "Authentication")}<select id="remote-auth"><option value="key" ${c.auth === "key" ? "selected" : ""}>${t("Clé SSH", "SSH key")}</option><option value="password" ${c.auth === "password" ? "selected" : ""}>${t("Mot de passe", "Password")}</option></select></label><label>${c.auth === "key" ? t("Clé privée SSH", "Private SSH key") : t("Mot de passe", "Password")}${c.auth === "key" ? `<textarea id="remote-credential" autocomplete="off">${escape(p.credential)}</textarea>` : `<input id="remote-credential" type="password" autocomplete="new-password" value="${escape(p.credential)}">`}</label><small>${client.access?.has_credential ? t("Laissez vide pour conserver le secret enregistré.", "Leave blank to keep the saved credential.") : ""}</small><p class="muted">${mode === "web" ? t("Les identifiants et fichiers sont utilisés par le serveur TorrentLinker, pas par votre navigateur.", "Credentials and files are used by the TorrentLinker server, not your browser.") : t("Les identifiants sont conservés dans le trousseau de ce PC.", "Credentials are stored in this PC’s keyring.")}</p></section><section class="panel transfer-card"><h3>${t("Correspondance des dossiers", "Folder mapping")}</h3><label>${t("Racine vue par le client torrent", "Root seen by the torrent client")}<input id="remote-client-root" value="${escape(c.client_root)}"></label><label>${t("Racine vue en SFTP", "Root seen over SFTP")}<div class="transfer-path"><input id="remote-file-root" value="${escape(c.file_root)}"><button id="remote-browse" ${client.access?.checked ? "" : "disabled"}>${t("Parcourir…", "Browse…")}</button></div></label><p class="muted">${t("Exemple : le client voit /downloads, le compte SFTP voit /home/seed/downloads. Des noms identiques ne prouvent pas un stockage partagé.", "Example: the client sees /downloads, while SFTP sees /home/seed/downloads. Identical names do not prove shared storage.")}</p><h3>${t("Identité du serveur", "Server identity")}</h3>${p.fingerprint ? `<code class="fingerprint">${escape(p.fingerprint)}</code><label class="trust-key"><input id="remote-trust" type="checkbox" ${p.trusted ? "checked" : ""}>${t("Empreinte comparée à celle fournie par mon hébergeur", "Fingerprint compared with my provider’s value")}</label>` : `<p class="muted">${t("Tester l’accès affiche l’empreinte avant toute authentification.", "Check access displays the fingerprint before authentication.")}</p>`}</section></div><section class="panel remote-access ${p.error ? "needs-access" : ""}"><h3>${t("Résultat du contrôle", "Check result")}</h3><p id="remote-result" role="status">${escape(p.error || p.result || t("Accès non vérifié", "Access not checked"))}</p></section><div class="transfer-footer"><button id="remote-test">${t("Enregistrer et tester l’accès", "Save and check access")}</button><button id="remote-done" class="primary">${escape(returnLabel())}</button></div>`;

        await onClose();

        if (pending) return;
        pending = true;
        captureRemote();
        d.querySelectorAll(
          "input,select,textarea,#remote-test,#remote-browse",
        ).forEach((node) => (node.disabled = true));
        try {
          const identity = await request("discover", {
            client_id: p.client_id,
            config: p.config,

          if (!p.host_key || identity.host_key !== p.host_key) {
            Object.assign(p, identity, {
              trusted: false,
              error: "",

                "Comparez l’empreinte fournie par votre hébergeur, puis confirmez-la.",
                "Compare the fingerprint with your provider’s value, then confirm it.",

            await onSaved(checked);

        } catch (error) {
          p.error = transferError(error.message);
          p.result = "";
        } finally {
          pending = false;
        }
        drawRemoteDialog();
      };
    }

    async function browseRemoteRoot(path = "") {
      const p = remoteDraft;
      const access = client.access;
      const result = await request("browse", { client_id: p.client_id, path });
      const mapped = (value) =>
        access.file_root.replace(/\/$/, "") +
        value.slice(access.client_root.replace(/\/$/, "").length);
      if (!alive || !isCurrent()) return;
      $("dialog").innerHTML =
        `<h2>${t("Parcourir les dossiers SFTP", "Browse SFTP folders")}</h2><p>${escape(mapped(result.path))}</p><div class="transfer-folders">${[result.parent, ...result.folders].map((folder, i) => `<button data-sftp-folder="${escape(folder)}">${i === 0 ? "↑ " : ""}${escape(mapped(folder))}</button>`).join("")}</div><div class="transfer-footer"><button id="root-cancel">${t("Annuler", "Cancel")}</button><button id="root-select" class="primary">${t("Choisir ce dossier", "Use this folder")}</button></div>`;
      $("dialog")
        .querySelectorAll("[data-sftp-folder]")
        .forEach((b) => {
          b.onclick = () =>
            transferGuard(() => browseRemoteRoot(b.dataset.sftpFolder));
        });
      $("root-cancel").onclick = drawRemoteDialog;
      $("root-select").onclick = () => {
        p.config.file_root = mapped(result.path);
        p.result = "";
        drawRemoteDialog();
      };
    }

    openRemoteAccess(client.id);
    return {
      destroy,
      redraw: () => {
        captureRemote();
        drawRemoteDialog();
      },
    };
  },
};

    <script data-source="torrents/transport.js">
"use strict";
let environment = {},
  generation = 0,
  busy = false,
  pendingReload = false,
  lastError = "",
  widths = {},
  commandId = 0;
const connection = TLPanel.connect("torrents", { asynchronous: true });
async function request(action, body = {}) {
  const current = generation,
    send = await connection;
  const result = await send(action, { ...body, _client: environment.client });
  if (current !== generation)
    throw Error(
      TLPanel.t("Le client cible a changé.", "The target client changed."),
    );
  return result;
}
// An action started by a button keeps that button busy until it ends.
async function guard(fn, node) {
  node ??= TLToast.trigger();
  if (node) return TLToast.press(node, fn);
  try {
    return await fn();
  } catch (e) {
    lastError = e.message;
    notify(e.message);
  }
}
function formatBytes(n) {
  let i = 0;
  while (n >= 1024 && i < 4) {
    n /= 1024;
    i++;
  }
  return `${Number(n.toFixed(1))} ${["B", "KiB", "MiB", "GiB", "TiB"][i]}`;
}
function peerText(connected, total) {
  return `${connected >= 0 ? connected : "?"} (${total >= 0 ? total : "?"})`;
}
async function savePreferences() {
  await guard(() => request("preferences", { columns: cols, widths }));
}
function applyWidths() {
  document.querySelectorAll("[data-sort]").forEach((b) => {
    const th = b.closest("th"),
      key = b.dataset.sort;
    if (Number.isFinite(widths[key]))
      th.style.minWidth = Math.max(80, Math.min(600, widths[key])) + "px";
    const grip = document.createElement("span");
    grip.className = "resize-grip";
    grip.tabIndex = 0;
    grip.setAttribute("role", "separator");
    grip.setAttribute(
      "aria-label",
      TLPanel.t("Largeur de colonne", "Column width") + " " + b.textContent,
    );
    grip.onpointerdown = (e) => {
      e.preventDefault();
      const start = e.clientX,
        width = th.getBoundingClientRect().width;
      grip.setPointerCapture(e.pointerId);
      grip.onpointermove = (ev) => {
        widths[key] = Math.max(80, Math.min(600, width + ev.clientX - start));
        th.style.minWidth = widths[key] + "px";
      };
      grip.onpointerup = () => {
        grip.onpointermove = null;
        savePreferences();
      };
    };
    grip.onkeydown = (e) => {
      if (!["ArrowLeft", "ArrowRight"].includes(e.key)) return;
      e.preventDefault();
      widths[key] = Math.max(
        80,
        Math.min(
          600,
          (widths[key] || th.getBoundingClientRect().width) +
            (e.key === "ArrowRight" ? 20 : -20),
        ),
      );
      th.style.minWidth = widths[key] + "px";
      savePreferences();
    };
    th.append(grip);
  });
}
async function load() {
  if (busy) {
    pendingReload = true;
    return;
  }
  busy = true;
  const current = generation;
  try {
    const keys = { client: "client_name", down: "download", up: "upload" };
    const body = {
      client_id: client,
      q: query,
      ...(hashes.length ? { hashes } : {}),
      sort: keys[sortKey] || sortKey,
      descending: sortDir < 0,
      offset: page * 100,
      ...filters,
    };
    for (const [local, remote] of Object.entries({
      scope: "scope",
      sizeMin: "size_min",
      sizeMax: "size_max",
      noteMin: "note_min",
      zenMin: "zen_min",
      weightMin: "weight_min",
      seedMax: "seed_max",
      daysMin: "days_min",
    })) {
      if (metrics[local] !== "")
        body[remote] =
          local === "scope"
            ? metrics[local]
            : Number(metrics[local]) *
              (local.startsWith("size")
                ? 1024 ** (sizeUnits[local] === "MiB" ? 2 : 3)
                : 1);
    }
    const result = await request("list", body);
    if (current !== generation) return;
    snapshot = result;
    page = Math.floor(result.offset / 100);
    data = result.rows.map((raw) => ({
      raw,
      id: raw.key,
      name: raw.name,
      client: raw.client_name,
      category: raw.categories.map((c) => c.join(" / ")).join(", "),
      tracker: raw.trackers.join(", "),
      tag: raw.tags.join(", "),
      state: raw.status,
      progress: Math.round(raw.progress * 100),
      size: raw.size / 1024 ** 3,
      ratio: raw.ratio,
      c411: raw.c411,
      note: raw.note,
      zen: raw.zen,
      weight: raw.weight,
      seeds: raw.total_seeds,
      peers: raw.total_peers,
      seedtime: raw.seedtime,
    }));
    data.forEach((r) => rowCache.set(r.id, r));
    if (!focus || !rowCache.has(focus)) focus = data[0]?.id || "";
    scenario = "normal";
    lastError = "";
    render();
    if (result.client_errors.length)
      notify(
        result.client_errors.map((e) => e.name + ": " + e.message).join(" · "),
      );
  } catch (e) {
    const repeated = lastError === e.message;
    lastError = e.message;
    if (current === generation) {
      if (!data.length) scenario = "error";
      render();
      // The 5 s refresh must not bring a dismissed error back every time.
      if (!repeated) notify(lastError);
    }
  } finally {
    busy = false;
    if (pendingReload) {
      pendingReload = false;
      guard(load);
    }
  }
}
window.addEventListener("DOMContentLoaded", () => {
  render();
  window.addEventListener("torrents-environment", (e) =>
    guard(async () => {
      const next = e.detail,
        changed = environment.client !== next.client,
        languageChanged = lang !== next.language,
        newCommand = next.command && commandId !== next.command.id;
      environment = next;
      lang = next.language || "en";
      mode = next.mode || "web";
      theme = next.theme || "dark";
      TLPanel.setLanguage(lang);
      document.documentElement.dataset.theme = theme;
      if (changed) {
        generation++;
        client = next.client || "all";
        selected.clear();
        rowCache.clear();
        data = [];
        focus = "";
        page = 0;
        $("dialog").close();
        const preferences = await request("preferences");
        if (preferences.columns)
          for (const k of Object.keys(cols))
            if (typeof preferences.columns[k] === "boolean")
              cols[k] = preferences.columns[k];
        widths = preferences.widths || {};
      }
      if (newCommand) {
        commandId = next.command.id;
        query = next.command.hash || "";
        hashes = next.command.hashes || [];
        if (typeof next.command.tracker === "string") filters.tracker = next.command.tracker;
        focus = "";
        page = 0;
      }
      if (
        next.active &&
        (changed || languageChanged || !data.length || newCommand)
      )
        await load();
      else if (languageChanged) render();
    }),
  );
  connection.then(() => window.torrentsReady());
  // A refresh redraws the page, which closes an open list: it waits while a list has focus.
  // The 5 s count from the end of the last answer, so a slow client never chains them.
  const refresh = () =>
    setTimeout(async () => {
      if (
        environment.active &&
        !document.hidden &&
        !busy &&
        !$("dialog").open &&
        document.activeElement?.tagName !== "SELECT"
      )
        await guard(load);
      refresh();
    }, 5000);
  refresh();
});

            [
              snapshot.summary.count || 0,
              t("Torrents · tous les clients", "Torrents · all clients"),
            ],
            [
              formatBytes(snapshot.summary.download || 0) + "/s",
              t("Réception cumulée", "Total download"),
            ],
            [
              formatBytes(snapshot.summary.upload || 0) + "/s",
              t("Envoi cumulé", "Total upload"),
            ],
          ]
            .map(
              ([v, k]) =>
                `<div class="panel stat"><small>${k}</small><strong>${v}</strong></div>`,
            )

function transferError(message) {

    ? t(transferErrors[message], message)

}

async function transferGuard(fn) {
  try {
    document.getElementById("transfer-error")?.remove();
    await fn();
  } catch (error) {
    const dialog = $("dialog");
    if (!dialog.open) {
      notify(String(error.message || error));
      return;

    const message = document.createElement("p");
    message.id = "transfer-error";
    message.className = "note transfer-blocking-summary";
    message.setAttribute("role", "alert");
    message.textContent = transferError(String(error.message || error));
    dialog.append(message);
    message.scrollIntoView({ block: "nearest" });
  }

function remoteClients() {
  const ids = new Set([
    ...(transferOptions?.sources || []).map((s) => s.client_id),

  content.before(route, panel);
  panel.querySelectorAll("[data-remote-edit]").forEach((button) => {

function openRemoteAccess(identifier) {
  const owner = environment.client;
  const client = transferOptions.clients.find(c => c.id === identifier);

    dialog: $("dialog"), client, t, mode, formatBytes, errorText: transferError,
    returnLabel: () => t("Revenir au transfert", "Back to transfer"),

    onClose: async () => {

    <script data-source="select-all-preview.js">
"use strict";
/* The proposal, layered on the real panel:
   - the box at the head of the table selects every torrent the filters match, not a page;
     while it is ticked the selection follows the filters, and unticking one row leaves the
     others selected;
   - pages are gone: the table loads 100 more rows as it is scrolled near its end.
   The selection stays the panel's own `selected` set, so Resume, Pause, Transfer…, More…
   and Remove… act on it without change. */

const STEP = 100;
let proposal = true,
  shown = STEP, // rows loaded so far
  lastListBody = {},
  allMatching = false, // the head box is ticked: the selection is every match
  allSignature = "",
  loadingMore = false;

// What the filters ask for, without the order or how far the table is loaded.
const listingSignature = (body = lastListBody) => {
  const { offset, limit, sort, descending, ...rest } = body;
  return JSON.stringify(rest);
};
const baseRequest = request;
request = async (action, body = {}) => {
  if (action === "list" && proposal) {
    // A filter change starts the table from its top again.
    if (listingSignature(body) !== listingSignature()) shown = STEP;
    body = { ...body, offset: 0, limit: shown };
  }
  if (action === "list") lastListBody = body;
  const result = await baseRequest(action, body);
  if (action === "list" && proposal && allMatching && allSignature !== listingSignature())
    await selectAll();

// The same row shape load() builds in torrents/transport.js.
const toRow = (raw) => ({
  raw,
  id: raw.key,
  name: raw.name,
  client: raw.client_name,
  category: raw.categories.map((c) => c.join(" / ")).join(", "),
  tracker: raw.trackers.join(", "),
  tag: raw.tags.join(", "),
  state: raw.status,
  progress: Math.round(raw.progress * 100),
  size: raw.size / 1024 ** 3,
  ratio: raw.ratio,
  c411: raw.c411,
  note: raw.note,
  zen: raw.zen,
  weight: raw.weight,
  seeds: raw.total_seeds,
  peers: raw.total_peers,
  seedtime: raw.seedtime,
});
const count = (n) => n.toLocaleString(lang === "fr" ? "fr-FR" : "en-US");

async function selectAll() {
  const { offset, limit, ...body } = lastListBody;
  const result = await baseRequest("match", body);
  selected.clear();
  for (const raw of result.rows) {
    const row = toRow(raw);
    rowCache.set(row.id, row);
    selected.add(row.id);
  }
  allMatching = true;
  allSignature = listingSignature();
}

async function loadMore() {
  if (loadingMore || shown >= snapshot.total) return;
  loadingMore = true;
  shown += STEP;
  try {
    await load();
  } finally {
    loadingMore = false;
  }
}

const basePaint = paint;
paint = function () {
  basePaint();
  hint();
  if (!proposal || scenario !== "normal") return;

    total = snapshot.total;

    const label = t(`Tout sélectionner (${count(total)})`, `Select all (${count(total)})`);
    head.setAttribute("aria-label", label);
    head.title = label;
    head.checked = allMatching && selected.size === total && total > 0;
    head.indeterminate = !head.checked && selected.size > 0;
    head.closest("th").classList.add("proposal");
    head.onchange = () =>
      guard(async () => {
        if (head.checked) await selectAll();
        else {
          selected.clear();
          allMatching = false;
        }
        render();
      });
  }
  // Unticking or ticking one row makes the selection a plain list again.
  document.querySelectorAll("[data-select]").forEach((box) => {
    const base = box.onchange;
    box.onchange = () => {
      allMatching = false;
      base();
    };
  });
  const status = document.querySelector("section.panel > .status > span");
  if (status && allMatching && selected.size === total)
    status.textContent = t(
      `Les ${count(total)} torrents correspondants sont sélectionnés`,
      `All ${count(total)} matching torrents selected`,
    );

  const pager = $("prev")?.closest(".status");
  if (pager) {
    pager.classList.add("proposal");
    pager.replaceChildren(
      Object.assign(document.createElement("small"), {
        textContent:
          data.length < total
            ? t(
                `${count(data.length)} sur ${count(total)} torrents affichés · la suite se charge au défilement`,
                `${count(data.length)} of ${count(total)} torrents shown · more load as you scroll`,
              )

    ? t(
        "La case en tête du tableau sélectionne tout ce que les filtres trouvent. Faites défiler le tableau : plus de pages.",
        "The box at the head of the table selects everything the filters match. Scroll the table: no more pages.",

  shown = STEP;
  allMatching = false;
  selected.clear();
  page = 0;

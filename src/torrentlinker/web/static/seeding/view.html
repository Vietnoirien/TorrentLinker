<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Seeding</title>
    <link rel="stylesheet" href="../panel/base.css" />
    <link rel="stylesheet" href="view.css" />
    <script defer src="../panel/i18n.js"></script>
    <script defer src="../panel/transport.js"></script>
    <script defer src="common.js"></script>
    <script defer src="transport.js"></script>
    <script defer src="view.js"></script>
  </head>
  <body>
    <h1 data-en="Seeding" data-fr="En partage">Seeding</h1>
    <div class="toolbar">
      <input
        id="seeding-query"
        aria-label="Filter torrents or categories"
        placeholder="Filter torrents or categories…"
      />
      <button id="seeding-expand" data-i18n="expandAll">Expand all</button>
      <button id="seeding-collapse" data-i18n="collapseAll">
        Collapse all
      </button>
      <button id="seeding-refresh" class="quiet" data-i18n="refresh">
        Refresh
      </button>
    </div>
    <div class="toolbar">
      <label
        ><span data-i18n="seedingSort">Sort torrents by</span
        ><select id="seeding-sort">
          <option value="zen" data-i18n="zenPerDay">≈ Zen/day</option>
          <option value="name" data-i18n="torrentName">Torrent</option>
          <option value="size" data-i18n="torrentSize">Size</option>
          <option value="seeders">Seeders</option>
          <option value="seed_days" data-i18n="seedAge">Seed age (days)</option>
          <option value="note">≈ Note</option>
        </select></label
      >
      <label
        ><span data-i18n="seedingOrder">Order</span
        ><select id="seeding-order">
          <option value="desc" data-i18n="descending">Descending</option>
          <option value="asc" data-i18n="ascending">Ascending</option>
        </select></label
      >
    </div>
    <p id="seeding-status" role="status"></p>
    <div id="seeding-groups"></div>
    <p id="seeding-total"></p>
    <section class="card">
      <h2 data-i18n="classComparison">Class comparison</h2>
      <div id="seeding-classes" class="toolbar"></div>
      <label
        ><span data-i18n="yourUploads">Your uploads</span
        ><input id="seeding-uploads" type="number" min="0" max="1000000"
      /></label>
      <button id="seeding-save-uploads" data-i18n="saveComparison">
        Save comparison input
      </button>
    </section>
    <p id="seeding-tags"></p>
    <p id="seeding-error" role="alert"></p>
  </body>
</html>

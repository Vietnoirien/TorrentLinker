<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media</title><link rel="stylesheet" href="../panel/base.css"><link rel="stylesheet" href="../media.css"><link rel="stylesheet" href="view.css"></head><body>        <section inert id="view-media" class="view" data-layout="cinematic" data-kind="video">
          <div class="media-topbar">
            <div class="media-tabs" role="tablist" aria-label="Media kind" data-aria-en="Media kind" data-aria-fr="Type de média"><button id="media-video-tab" data-en="Video" data-fr="Vidéo" role="tab" aria-selected="true">Video</button><button id="media-music-tab" data-en="Music" data-fr="Musique" role="tab" aria-selected="false">Music</button></div>
            <nav class="media-browse-nav" aria-label="Video browsing" data-aria-en="Video browsing" data-aria-fr="Parcourir les vidéos"><button data-media-view="recent" data-en="Home" data-fr="Accueil">Home</button><button data-media-view="films" data-en="Films" data-fr="Films">Films</button><button data-media-view="series" data-en="Series" data-fr="Séries">Series</button><button data-media-view="anime" data-en="Anime" data-fr="Animés">Anime</button><button data-media-view="adult" data-adult hidden>XXX</button><button data-media-view="continue" data-en="Continue watching" data-fr="Reprendre la lecture">Continue watching</button><button id="media-ratings-entry" type="button" hidden>Unrated</button></nav>
            <nav id="media-music-nav" class="media-music-nav" aria-label="Music browsing" data-aria-en="Music browsing" data-aria-fr="Parcourir la musique" hidden><button data-media-music-view="albums">Albums</button><button data-media-music-view="artists">Artists</button><button data-media-music-view="tracks">Tracks</button></nav>
            <input id="media-search" type="search" aria-label="Search media" data-aria-en="Search media" data-aria-fr="Rechercher des médias" placeholder="Search your media" />
            <details id="media-library-options" class="media-library-options"><summary data-en="Options" data-fr="Options">Options</summary><div class="media-options-panel"><label class="media-layout-control"><span data-en="Layout" data-fr="Disposition">Layout</span><select id="media-layout-switch" aria-label="Media layout" data-aria-en="Media layout" data-aria-fr="Disposition des médias"><option value="cinematic" data-en="Cinematic home" data-fr="Accueil cinéma">Cinematic home</option><option value="focus" data-en="Focus" data-fr="Focus">Focus</option><option value="horizon" data-en="Horizon" data-fr="Horizon">Horizon</option></select></label><label class="media-layout-control" id="media-horizon-control" hidden><span data-en="Horizon view" data-fr="Vue Horizon">Horizon view</span><select id="media-horizon-switch" aria-label="Horizon view" data-aria-en="Horizon view" data-aria-fr="Vue Horizon"><option value="home" data-en="Home" data-fr="Accueil">Home</option><option value="showcase" data-en="Showcase" data-fr="Showcase">Showcase</option><option value="wall" data-en="Wall" data-fr="Mur">Wall</option></select></label><div class="toolbar media-filters"><select id="media-view" aria-label="Media view" data-aria-en="Media view" data-aria-fr="Vue des médias"></select><select id="media-genre" aria-label="Genre" data-aria-en="Genre" data-aria-fr="Genre"></select><select id="media-year" aria-label="Year" data-aria-en="Year" data-aria-fr="Année"></select><select id="media-language" aria-label="Language" data-aria-en="Language" data-aria-fr="Langue"></select><select id="media-availability" aria-label="Availability" data-aria-en="Availability" data-aria-fr="Disponibilité"></select><button id="media-refresh" data-en="Refresh inventory" data-fr="Actualiser les médias">Refresh inventory</button><button id="media-cancel-scan" class="quiet" data-en="Cancel scan" data-fr="Annuler l’analyse" hidden>Cancel scan</button><button data-view="setup" data-en="Add Library Folder" data-fr="Ajouter un dossier de bibliothèque">Add Library Folder</button></div></div></details>
            <time id="media-clock" class="media-clock" aria-hidden="true"></time><button id="media-toolbar-refresh" class="icon-button" type="button" aria-pressed="false">⟳</button><button id="media-toolbar-chat" class="icon-button" type="button" aria-pressed="false">✦</button><select id="media-client" aria-label="Target client" data-aria-en="Target client" data-aria-fr="Client cible"></select><button id="media-center-mode" class="icon-button" type="button" aria-pressed="false">⤢</button>
          </div>
          <section id="media-feature" class="media-feature" aria-label="Featured title" data-aria-en="Featured title" data-aria-fr="Titre en vedette" hidden></section>
          <section id="media-ratings" class="media-ratings-page" hidden></section>
          <div class="media-shelves">
            <p id="media-status" role="status" class="media-inventory-status"></p>
            <section id="media-continue" class="media-continue" aria-label="Continue watching" data-aria-en="Continue watching" data-aria-fr="Reprendre la lecture" hidden><h2 data-en="Continue watching" data-fr="Reprendre la lecture">Continue watching</h2><div id="media-continue-items" class="media-continue-row"></div></section>
            <section id="media-episodes" class="media-episodes" aria-label="Episodes" data-aria-en="Episodes" data-aria-fr="Épisodes" hidden></section>
            <div id="media-home-rows" class="media-home-rows" hidden></div>
            <div class="media-library-layout"><div class="media-library-content"><div class="media-section-heading"><h2 id="media-shelf-title">Recently added</h2><span id="media-shelf-count"></span></div>
            <div id="media-results" class="media-grid"></div><button id="media-more" data-en="Load more" data-fr="Afficher la suite" hidden>Load more</button>
            </div><aside id="media-playlists" hidden><p class="media-eyebrow" data-en="Your listening" data-fr="Votre écoute">Your listening</p><h2 data-en="Playlists" data-fr="Playlists">Playlists</h2><button id="media-show-queue" class="media-queue-link">Playback queue · 0</button><div id="media-playlist-list"></div><form id="media-save-playlist"><label for="media-playlist-name" data-en="Save the current queue" data-fr="Enregistrer la file actuelle">Save the current queue</label><input id="media-playlist-name" aria-label="Playlist name" data-aria-en="Playlist name" data-aria-fr="Nom de la playlist" placeholder="Playlist name" required maxlength="100"/><button data-en="Save playlist" data-fr="Enregistrer la playlist">Save playlist</button></form><p class="media-playlist-note" data-en="Music playlists are separate from Download Queues." data-fr="Les playlists musicales sont distinctes des files de téléchargement.">Music playlists are separate from Download Queues.</p></aside></div>
          </div>
          <dialog id="media-details" class="media-detail-dialog" aria-label="Media details" data-aria-en="Media details" data-aria-fr="Détails du média"></dialog>
        </section>
<div id="toast" role="status" hidden></div><script src="../panel/i18n.js"></script><script src="../panel/transport.js"></script><script src="../panel/media-flags.js"></script><script src="transport.js"></script><script src="common.js"></script><script src="browser.js"></script><script src="ratings.js"></script><script src="view.js"></script></body></html>

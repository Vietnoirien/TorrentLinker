name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libpulse0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 desktop-file-utils
      - run: pip install '.[package]'
      - run: pyinstaller --noconfirm --distpath ../dist --workpath ../build torrentlinker.spec
        working-directory: packaging
      - name: Bundled audio dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          assert list(Path('dist/torrentlinker').rglob('libpulse.so.0')), 'PulseAudio library missing from bundle'
          PY
      - run: packaging/build_appimage.sh
      - name: Smoke test
        run: APPIMAGE_EXTRACT_AND_RUN=1 timeout 120 dist/TorrentLinker-x86_64.AppImage --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/TorrentLinker-x86_64.AppImage

  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[package]'
      - run: pyinstaller --noconfirm --distpath ../dist --workpath ../build torrentlinker.spec
        working-directory: packaging
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\TorrentLinker.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-ChildItem "$env:APPDATA\TorrentLinker" -Filter torrentlinker.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
            throw "smoke test failed with exit code $($p.ExitCode)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/TorrentLinker.exe

  macos:
    # Apple Silicon only; the app is ad-hoc signed, not notarized, so Gatekeeper asks once
    runs-on: macos-14
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[package]'
      - run: pyinstaller --noconfirm --distpath ../dist --workpath ../build torrentlinker.spec
        working-directory: packaging
      - name: Smoke test
        run: |
          if ! dist/TorrentLinker.app/Contents/MacOS/torrentlinker --smoke-test; then
            find "$HOME/Library" -name torrentlinker.log -exec cat {} \; 2>/dev/null
            exit 1
          fi
      - name: Disk image
        run: |
          mkdir dmg && cp -R dist/TorrentLinker.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname TorrentLinker -srcfolder dmg -ov -format UDZO dist/TorrentLinker-macOS-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/TorrentLinker-macOS-arm64.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/TorrentLinker-x86_64.AppImage
            artifacts/windows/TorrentLinker.exe
            artifacts/macos/TorrentLinker-macOS-arm64.dmg
          name: TorrentLinker ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

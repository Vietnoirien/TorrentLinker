name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libpulse0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 desktop-file-utils
      - run: pip install '.[package]'
      - run: pyinstaller --noconfirm --distpath ../dist --workpath ../build torrentlinker.spec
        working-directory: packaging
      - name: Bundled audio dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          assert list(Path('dist/torrentlinker').rglob('libpulse.so.0')), 'PulseAudio library missing from bundle'
          PY
      - run: packaging/build_appimage.sh
      - name: Verify host graphics runtime policy
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('build/AppDir')
          forbidden = [p for pattern in ('libstdc++.so*', 'libgcc_s.so*') for p in root.rglob(pattern)]
          assert not forbidden, f'Compiler runtimes would shadow system Mesa dependencies: {forbidden}'
          PY
      - name: Smoke test
        run: APPIMAGE_EXTRACT_AND_RUN=1 timeout 120 dist/TorrentLinker-x86_64.AppImage --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/TorrentLinker-x86_64.AppImage

  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[package]'
      - run: pyinstaller --noconfirm --distpath ../dist --workpath ../build torrentlinker.spec
        working-directory: packaging
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\TorrentLinker.exe -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(120000)) {
            $p.Kill()
            throw "smoke test exceeded 120 seconds"
          }
          if ($p.ExitCode -ne 0) {
            Get-ChildItem "$env:APPDATA\TorrentLinker" -Filter torrentlinker.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
            throw "smoke test failed with exit code $($p.ExitCode)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/TorrentLinker.exe

  macos:
    # Apple Silicon only; the app is ad-hoc signed, not notarized, so Gatekeeper asks once
    runs-on: macos-14
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[package]'
      - run: pyinstaller --noconfirm --distpath ../dist --workpath ../build torrentlinker.spec
        working-directory: packaging
      - name: Smoke test
        run: |
          if ! python -c 'import subprocess; subprocess.run(["dist/TorrentLinker.app/Contents/MacOS/torrentlinker", "--smoke-test"], check=True, timeout=120)'; then
            find "$HOME/Library" -name torrentlinker.log -exec cat {} \; 2>/dev/null
            exit 1
          fi
      - name: Disk image
        run: |
          mkdir dmg && cp -R dist/TorrentLinker.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname TorrentLinker -srcfolder dmg -ov -format UDZO dist/TorrentLinker-macOS-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/TorrentLinker-macOS-arm64.dmg

  container:
    # Built and tested on every run; pushed to GHCR only for a tag, once every desktop build passed
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/vietnoirien/torrentlinker
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: torrentlinker:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          echo smoke-password > "$RUNNER_TEMP/pw"
          chmod 644 "$RUNNER_TEMP/pw"
          docker run -d --name tl -p 8787:8787 -e TL_WEB_PASSWORD_FILE=/run/pw -v "$RUNNER_TEMP/pw:/run/pw:ro" torrentlinker:smoke
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8787/healthz && exit 0; sleep 2; done
          docker logs tl
          exit 1
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{linux,windows,macos}"
      - name: Package browser companion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          source = Path('src/torrentlinker/companion_extension')
          assert (source / 'manifest.json').is_file()
          with ZipFile('artifacts/TorrentLinker-companion.zip', 'w', ZIP_DEFLATED) as bundle:
              for path in sorted(source.iterdir()):
                  if path.is_file():
                      bundle.write(path, f'torrentlinker-companion/{path.name}')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/TorrentLinker-x86_64.AppImage
            artifacts/windows/TorrentLinker.exe
            artifacts/macos/TorrentLinker-macOS-arm64.dmg
            artifacts/TorrentLinker-companion.zip
          name: TorrentLinker ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

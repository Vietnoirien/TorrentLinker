name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest -q

  qbittorrent:
    name: Reseed against qBittorrent ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 4.x (Ubuntu)
            ppa: ""
          - name: 5.x (stable PPA)
            ppa: ppa:qbittorrent-team/qbittorrent-stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install qbittorrent-nox
        run: |
          if [ -n "${{ matrix.ppa }}" ]; then sudo add-apt-repository -y "${{ matrix.ppa }}"; fi
          sudo apt-get update && sudo apt-get install -y qbittorrent-nox
          qbittorrent-nox --version
      - run: pip install -e '.[dev]'
      - name: Start a sandbox qBittorrent
        run: |
          python scripts/qbit_sandbox.py "$RUNNER_TEMP/qbt"
          qbittorrent-nox --profile="$RUNNER_TEMP/qbt" > "$RUNNER_TEMP/qbt.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18080/api/v2/app/version && break; sleep 1; done
          echo; curl -s http://127.0.0.1:18080/api/v2/app/webapiVersion
      - run: pytest -q tests/test_qbit_integration.py -rs
        env:
          TL_QBIT_SANDBOX: http://127.0.0.1:18080
      - if: failure()
        run: cat "$RUNNER_TEMP/qbt.log"

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest -q

  qbittorrent:
    name: Reseed against qBittorrent ${{ matrix.name }}
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 4.6 (Ubuntu package)
            static: ""
          - name: 5.2.4 (static build)
            static: release-5.2.4_v2.0.15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install qbittorrent-nox and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          if [ -n "${{ matrix.static }}" ]; then
            curl -fsSL -o "$RUNNER_TEMP/qbittorrent-nox" \
              "https://github.com/userdocs/qbittorrent-nox-static/releases/download/${{ matrix.static }}/x86_64-qbittorrent-nox"
            chmod +x "$RUNNER_TEMP/qbittorrent-nox"
            echo "QBT=$RUNNER_TEMP/qbittorrent-nox" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y qbittorrent-nox
            echo "QBT=qbittorrent-nox" >> "$GITHUB_ENV"
          fi
      - run: pip install -e '.[dev]'
      - name: Start a sandbox qBittorrent
        run: |
          "$QBT" --version
          python scripts/qbit_sandbox.py "$RUNNER_TEMP/qbt"
          "$QBT" --profile="$RUNNER_TEMP/qbt" > "$RUNNER_TEMP/qbt.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18080/api/v2/app/version && break; sleep 1; done
          echo; curl -sf http://127.0.0.1:18080/api/v2/app/webapiVersion
      - run: pytest -q tests/test_qbit_integration.py -rs
        env:
          TL_QBIT_SANDBOX: http://127.0.0.1:18080
      - if: failure()
        run: cat "$RUNNER_TEMP/qbt.log"

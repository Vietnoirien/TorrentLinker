name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest -q

  windows-library:
    name: Windows Library rescan regression
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_library_rescans.py tests/test_library_timeout.py tests/test_stall_watchdog.py tests/test_transmission_unit.py -o faulthandler_timeout=30
      - run: pip install '.[package]'
      - run: pyinstaller --noconfirm --distpath ../dist --workpath ../build torrentlinker.spec
        working-directory: packaging
      - name: Packaged smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\TorrentLinker.exe -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(120000)) {
            $p.Kill()
            throw "Packaged smoke test exceeded 120 seconds"
          }
          if ($p.ExitCode -ne 0) { throw "Packaged smoke test failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-library-diagnostics
          path: dist/TorrentLinker.exe
      - name: Collect diagnostic logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "$env:APPDATA\TorrentLinker" -Filter torrentlinker.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }

  browser:
    name: Browser workflow acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      TL_WEB_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - run: pip install -e '.[dev,browser-test]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/test_selection_cards.py tests/test_web_browser.py tests/test_request_details.py tests/test_assistant_ui.py tests/test_upload_restart.py

  qbittorrent:
    name: Reseed against qBittorrent ${{ matrix.name }}
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 4.6 (Ubuntu package)
            static: ""
          - name: 5.2.4 (static build)
            static: release-5.2.4_v2.0.15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install qbittorrent-nox and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          if [ -n "${{ matrix.static }}" ]; then
            curl -fsSL -o "$RUNNER_TEMP/qbittorrent-nox" \
              "https://github.com/userdocs/qbittorrent-nox-static/releases/download/${{ matrix.static }}/x86_64-qbittorrent-nox"
            chmod +x "$RUNNER_TEMP/qbittorrent-nox"
            echo "QBT=$RUNNER_TEMP/qbittorrent-nox" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y qbittorrent-nox
            echo "QBT=qbittorrent-nox" >> "$GITHUB_ENV"
          fi
      - run: pip install -e '.[dev]'
      - name: Start a sandbox qBittorrent
        run: |
          "$QBT" --version
          python scripts/qbit_sandbox.py "$RUNNER_TEMP/qbt"
          "$QBT" --profile="$RUNNER_TEMP/qbt" > "$RUNNER_TEMP/qbt.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18080/api/v2/app/version && break; sleep 1; done
          echo; curl -sf http://127.0.0.1:18080/api/v2/app/webapiVersion
          # A second instance where localhost must log in, for the shared-login test
          python scripts/qbit_sandbox.py "$RUNNER_TEMP/qbt-auth" 18081 --auth
          "$QBT" --profile="$RUNNER_TEMP/qbt-auth" > "$RUNNER_TEMP/qbt-auth.log" 2>&1 &
          for i in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/api/v2/app/version)" = 403 ] && break; sleep 1; done
      - run: pytest -q tests/test_qbit_integration.py -rs
        env:
          TL_QBIT_SANDBOX: http://127.0.0.1:18080
          TL_QBIT_SANDBOX_AUTH: http://127.0.0.1:18081
          TL_QBIT_SANDBOX_AUTH_PASSWORD_FILE: ${{ runner.temp }}/qbt-auth/password
      - if: failure()
        run: cat "$RUNNER_TEMP/qbt.log"

  docker-paths:
    name: Path Mappings against qBittorrent in Docker
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e '.[dev]'
      - name: Start qBittorrent in a container that sees a host folder as /data
        run: |
          mkdir -p "$RUNNER_TEMP/nas" "$RUNNER_TEMP/profile"
          python scripts/qbit_sandbox.py "$RUNNER_TEMP/profile" --docker
          docker run -d --name tl-qbt -p 127.0.0.1:18090:8080 \
            -e QBT_LEGAL_NOTICE=confirm -e PUID=$(id -u) -e PGID=$(id -g) \
            -v "$RUNNER_TEMP/profile:/config" -v "$RUNNER_TEMP/nas:/data" \
            qbittorrentofficial/qbittorrent-nox:5.2.4-1
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18090/api/v2/app/version && break; sleep 1; done
      - run: pytest -q tests/test_docker_paths.py -rs
        env:
          TL_QBIT_DOCKER: http://127.0.0.1:18090
          TL_QBIT_DOCKER_DATA: ${{ runner.temp }}/nas
      - if: failure()
        run: docker logs tl-qbt

  deluge:
    name: Reseed and Path Mappings against Deluge ${{ matrix.version }} in Docker
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ["2.1.1", "2.2.0"]  # Debian/Ubuntu's, and the latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e '.[dev]'
      - name: Start two Deluge containers, one seeing a host folder at its own path, one as /data
        run: |
          mkdir -p "$RUNNER_TEMP/same" "$RUNNER_TEMP/nas"
          # lscr.io answers 429 when many runners pull at once: retry, then Docker Hub's copy
          image=""
          for i in 1 2 3 4 5; do
            for candidate in lscr.io/linuxserver/deluge linuxserver/deluge; do
              if docker pull -q "$candidate:${{ matrix.version }}"; then
                image="$candidate:${{ matrix.version }}"; break 2
              fi
            done
            sleep $((i * 15))
          done
          [ -n "$image" ] || { echo "could not pull Deluge ${{ matrix.version }}"; exit 1; }
          docker run -d --name tl-deluge -p 127.0.0.1:18112:8112 \
            -e PUID=$(id -u) -e PGID=$(id -g) -v "$RUNNER_TEMP/same:$RUNNER_TEMP/same" "$image"
          docker run -d --name tl-deluge-paths -p 127.0.0.1:18113:8112 \
            -e PUID=$(id -u) -e PGID=$(id -g) -v "$RUNNER_TEMP/nas:/data" "$image"
          python scripts/deluge_sandbox.py http://127.0.0.1:18112
          python scripts/deluge_sandbox.py http://127.0.0.1:18113
      - run: pytest -q tests/test_deluge_integration.py tests/test_deluge_docker_paths.py -rs
        env:
          TL_DELUGE_SANDBOX: http://127.0.0.1:18112
          TL_DELUGE_DATA: ${{ runner.temp }}/same
          TL_DELUGE_DOCKER: http://127.0.0.1:18113
          TL_DELUGE_DOCKER_DATA: ${{ runner.temp }}/nas
      - if: failure()
        run: docker logs tl-deluge; docker logs tl-deluge-paths

  transmission:
    name: Reseed and Path Mappings against Transmission 4.1.3 in Docker
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e '.[dev]'
      - name: Start two Transmission containers, one seeing a host folder at its own path, one as /data
        run: |
          mkdir -p "$RUNNER_TEMP/same" "$RUNNER_TEMP/nas"
          # lscr.io answers 429 when many runners pull at once: retry, then Docker Hub's copy
          image=""
          for i in 1 2 3 4 5; do
            for candidate in lscr.io/linuxserver/transmission linuxserver/transmission; do
              if docker pull -q "$candidate:4.1.3"; then
                image="$candidate:4.1.3"; break 2
              fi
            done
            sleep $((i * 15))
          done
          [ -n "$image" ] || { echo "could not pull Transmission 4.1.3"; exit 1; }
          docker run -d --name tl-transmission -p 127.0.0.1:19091:9091 \
            -e PUID=$(id -u) -e PGID=$(id -g) -v "$RUNNER_TEMP/same:$RUNNER_TEMP/same" "$image"
          docker run -d --name tl-transmission-paths -p 127.0.0.1:19092:9091 \
            -e PUID=$(id -u) -e PGID=$(id -g) -v "$RUNNER_TEMP/nas:/data" "$image"
          python scripts/transmission_sandbox.py http://127.0.0.1:19091
          python scripts/transmission_sandbox.py http://127.0.0.1:19092
      - run: pytest -q tests/test_transmission_integration.py tests/test_transmission_docker_paths.py -rs
        env:
          TL_TRANSMISSION_SANDBOX: http://127.0.0.1:19091
          TL_TRANSMISSION_DATA: ${{ runner.temp }}/same
          TL_TRANSMISSION_DOCKER: http://127.0.0.1:19092
          TL_TRANSMISSION_DOCKER_DATA: ${{ runner.temp }}/nas
      - if: failure()
        run: docker logs tl-transmission; docker logs tl-transmission-paths

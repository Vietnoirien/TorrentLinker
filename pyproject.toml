[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "torrentlinker"
version = "0.6.0"
description = "Reconcile local files with private-tracker torrents and reseed them in qBittorrent, Deluge or Transmission"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "qbittorrent-api>=2026.10",
  "httpx[socks]>=0.27",
  "requests[socks]",  # SOCKS proxies for qBittorrent's adapter
  "guessit>=3.8",
  "torf>=4.2",
  "keyring>=24",
  "numpy>=1.26",  # the 3D preview reads and decimates meshes
  "pymediainfo>=6.1",  # MediaInfo of videos, for the Films & Vidéos upload (ADR-0012)
  "mutagen>=1.47",  # audio tags for the Audio and Ebook uploads
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.5", "mypy>=1.10"]
package = ["pyinstaller>=6.10", "pillow>=10"]  # pillow converts the icon on Windows

[project.gui-scripts]
torrentlinker = "torrentlinker.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torrentlinker = ["i18n/*.qm", "assets/*.png", "gui/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Qt signatures default to QModelIndex()

[tool.mypy]
python_version = "3.11"
packages = ["torrentlinker"]
mypy_path = "src"
ignore_missing_imports = true
